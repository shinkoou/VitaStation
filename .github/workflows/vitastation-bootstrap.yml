name: VitaStation Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Vita3K-Plus snapshot
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/nckstwrt/Vita3K-Plus.git 2>/dev/null || true
          git fetch upstream master
          git checkout upstream/master -- .

      - name: Preserve only VitaStation workflow
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/vitastation-bootstrap.yml /tmp/vitastation-bootstrap.yml
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/vitastation-bootstrap.yml .github/workflows/vitastation-bootstrap.yml

      - name: Apply VitaStation Phase 01
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path("android/app/src/main/java/org/vita3k/emulator")

          def literal_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  print(f"\nERROR [{label}] expected 1 literal match, found {count}")
                  raise SystemExit(1)
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"OK: {label}")

          def regex_once(path: Path, pattern: str, replacer, label: str, flags=0):
              text = path.read_text(encoding="utf-8")
              matches = list(re.finditer(pattern, text, flags))
              if len(matches) != 1:
                  print(f"\nERROR [{label}] expected 1 regex match, found {len(matches)}")
                  print(f"Pattern: {pattern}")
                  raise SystemExit(1)
              match = matches[0]
              replacement = replacer(match) if callable(replacer) else replacer
              out = text[:match.start()] + replacement + text[match.end():]
              path.write_text(out, encoding="utf-8")
              print(f"OK: {label}")

          # ==============================================================
          # 1. AppsListViewModel
          # ==============================================================

          vm = ROOT / "ui/viewmodel/AppsListViewModel.kt"

          literal_once(
              vm,
              "import android.app.Application\n",
              "import android.app.Application\nimport android.content.Context\n",
              "ViewModel Context import",
          )

          literal_once(
              vm,
              "import org.vita3k.emulator.data.ViewMode\n\n"
              "class AppsListViewModel(application: Application) : AndroidViewModel(application) {\n",
              "import org.vita3k.emulator.data.ViewMode\n\n"
              'private const val UI_PREFS_NAME = "vitastation_ui"\n'
              'private const val KEY_LIBRARY_VIEW_MODE = "library_view_mode"\n\n'
              "class AppsListViewModel(application: Application) : AndroidViewModel(application) {\n"
              "\n"
              "    private val uiPreferences =\n"
              "        application.getSharedPreferences(UI_PREFS_NAME, Context.MODE_PRIVATE)\n",
              "ViewModel preference storage",
          )

          literal_once(
              vm,
              "    var viewMode by mutableStateOf(ViewMode.LIST)\n",
              "    var viewMode by mutableStateOf(loadViewMode())\n",
              "ViewModel restore last view mode",
          )

          literal_once(
              vm,
              "    fun toggleViewMode() {\n"
              "        viewMode = if (viewMode == ViewMode.LIST) ViewMode.GRID else ViewMode.LIST\n"
              "    }\n",
              "    fun setViewMode(mode: ViewMode) {\n"
              "        if (viewMode == mode) return\n"
              "\n"
              "        viewMode = mode\n"
              "        uiPreferences.edit()\n"
              "            .putString(KEY_LIBRARY_VIEW_MODE, mode.name)\n"
              "            .apply()\n"
              "    }\n"
              "\n"
              "    fun toggleViewMode() {\n"
              "        setViewMode(if (viewMode == ViewMode.LIST) ViewMode.GRID else ViewMode.LIST)\n"
              "    }\n"
              "\n"
              "    private fun loadViewMode(): ViewMode {\n"
              "        val storedMode = uiPreferences.getString(\n"
              "            KEY_LIBRARY_VIEW_MODE,\n"
              "            ViewMode.LIST.name\n"
              "        )\n"
              "\n"
              "        return runCatching {\n"
              "            ViewMode.valueOf(storedMode ?: ViewMode.LIST.name)\n"
              "        }.getOrDefault(ViewMode.LIST)\n"
              "    }\n",
              "ViewModel explicit selectable mode + persistence",
          )

          # ==============================================================
          # 2. FilterSheet
          # ==============================================================

          filter_sheet = ROOT / "ui/screens/FilterSheet.kt"

          literal_once(
              filter_sheet,
              "    onViewModeToggle: () -> Unit,\n",
              "    onViewModeChanged: (ViewMode) -> Unit,\n",
              "FilterSheet callback",
          )

          literal_once(
              filter_sheet,
              "                    onClick = { if (viewMode != ViewMode.LIST) onViewModeToggle() },\n",
              "                    onClick = { onViewModeChanged(ViewMode.LIST) },\n",
              "FilterSheet LIST button",
          )

          literal_once(
              filter_sheet,
              "                    onClick = { if (viewMode != ViewMode.GRID) onViewModeToggle() },\n",
              "                    onClick = { onViewModeChanged(ViewMode.GRID) },\n",
              "FilterSheet GRID button",
          )

          # ==============================================================
          # 3. AppsListScreen
          # ==============================================================

          screen = ROOT / "ui/screens/AppsListScreen.kt"

          literal_once(
              screen,
              "    onViewModeToggle: () -> Unit,\n",
              "    onViewModeChanged: (ViewMode) -> Unit,\n",
              "AppsListScreen callback",
          )

          # Do not depend on a multi-line whitespace block.
          # Match only the unique Search IconButton line and reuse its indentation.
          def add_view_buttons(match):
              i = match.group("indent")
              anchor = match.group(0)
              return (
                  f"{i}IconButton(onClick = {{ onViewModeChanged(ViewMode.LIST) }}) {{\n"
                  f"{i}    Icon(\n"
                  f"{i}        Icons.AutoMirrored.Filled.List,\n"
                  f"{i}        contentDescription = stringResource(R.string.filter_view_list),\n"
                  f"{i}        tint = if (viewMode == ViewMode.LIST)\n"
                  f"{i}            MaterialTheme.colorScheme.primary\n"
                  f"{i}        else\n"
                  f"{i}            MaterialTheme.colorScheme.onSurfaceVariant\n"
                  f"{i}    )\n"
                  f"{i}}}\n"
                  f"{i}IconButton(onClick = {{ onViewModeChanged(ViewMode.GRID) }}) {{\n"
                  f"{i}    Icon(\n"
                  f"{i}        Icons.Default.GridView,\n"
                  f"{i}        contentDescription = stringResource(R.string.filter_view_grid),\n"
                  f"{i}        tint = if (viewMode == ViewMode.GRID)\n"
                  f"{i}            MaterialTheme.colorScheme.primary\n"
                  f"{i}        else\n"
                  f"{i}            MaterialTheme.colorScheme.onSurfaceVariant\n"
                  f"{i}    )\n"
                  f"{i}}}\n"
                  f"{anchor}"
              )

          regex_once(
              screen,
              r"(?m)^(?P<indent>[ \t]*)IconButton\(onClick = \{ showSearchBar = true \}\) \{$",
              add_view_buttons,
              "AppsListScreen visible LIST/GRID controls",
          )

          literal_once(
              screen,
              "            onViewModeToggle = onViewModeToggle,\n",
              "            onViewModeChanged = onViewModeChanged,\n",
              "AppsListScreen FilterSheet wiring",
          )

          # ==============================================================
          # 4. AppNavigation
          # ==============================================================

          nav = ROOT / "ui/navigation/AppNavigation.kt"

          literal_once(
              nav,
              "                onViewModeToggle = { appsListViewModel.toggleViewMode() },\n",
              "                onViewModeChanged = { mode -> appsListViewModel.setViewMode(mode) },\n",
              "AppNavigation view mode wiring",
          )

          print("\nPhase 01 transformations completed.")
          PY

          rm -f VitaStation-v0.1.0-Phase01-Selectable-Grid.patch

      - name: Validate Phase 01
        shell: bash
        run: |
          set -euo pipefail

          SCREEN="android/app/src/main/java/org/vita3k/emulator/ui/screens/AppsListScreen.kt"
          VM="android/app/src/main/java/org/vita3k/emulator/ui/viewmodel/AppsListViewModel.kt"
          FILTER="android/app/src/main/java/org/vita3k/emulator/ui/screens/FilterSheet.kt"
          NAV="android/app/src/main/java/org/vita3k/emulator/ui/navigation/AppNavigation.kt"

          test "$(grep -c 'onViewModeChanged(ViewMode.LIST)' "$SCREEN")" -ge 1
          test "$(grep -c 'onViewModeChanged(ViewMode.GRID)' "$SCREEN")" -ge 1
          grep -q 'KEY_LIBRARY_VIEW_MODE' "$VM"
          grep -q 'fun setViewMode(mode: ViewMode)' "$VM"
          grep -q 'onViewModeChanged(ViewMode.LIST)' "$FILTER"
          grep -q 'onViewModeChanged(ViewMode.GRID)' "$FILTER"
          grep -q 'appsListViewModel.setViewMode(mode)' "$NAV"

          if grep -R "onViewModeToggle =" \
            "$SCREEN" "$FILTER" "$NAV"; then
            echo "ERROR: old callback wiring still exists."
            exit 1
          fi

          git diff --check
          echo "Phase 01 validation passed."
          git status --short

      - name: Commit VitaStation foundation
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "VitaStation v0.1.0 Phase 01: import base and selectable Grid"
          git push origin HEAD:main
