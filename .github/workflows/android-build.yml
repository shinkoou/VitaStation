          require(
              "android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/EmulationPauseMenu.kt",
              "[VS-RUNTIME-HACKS7]",
              "PauseMenuTab.Hacks -> RuntimeHacksTab()",
              "enabled = false",
          )
          require(
              "android/app/src/main/res/values/strings.xml",
              "[VS-LICENSES-HACKS-STRINGS7]",
              "VitaStation / Vita3K — GNU GPL v2",
              "Snapdragon Game Super Resolution (Qualcomm) — BSD-3-Clause",
              "LSFG-VK Android — MIT",
          )
          require(
              "android/app/src/main/res/values-pt-rBR/strings.xml",
              "[VS-LICENSES-HACKS-STRINGS7]",
              "Licenças",
              "Backend ainda não está pronto na FIX7",
          )

          # FrameGen and typeless staging header stay byte-identical to persisted FIX5.
          frozen = {
              "vita3k/renderer/src/vulkan/frame_generation.cpp": "1e7cc634f3308566b6ea3d972b73c55086f8f781",
              "vita3k/renderer/include/renderer/vulkan/surface_cache.h": "c30ac772a497c59f93a9b5d27c3de1edeb20f451",
          }
          for path, wanted in frozen.items():
              got = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              if got != wanted:
                  raise SystemExit(f"::error::Frozen component changed: {path} expected={wanted} actual={got}")

          print("[VS-FIX7] integrated source gates passed")
          print("[VS-FIX7] FrameGen + FIX4 typeless staging remain frozen")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and JVM preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac \
            --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done

          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"
          keytool -list -v \
            -keystore "$SIGNING_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > "$RUNNER_TEMP/vitastation-keytool.txt"

          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed VitaStation FIX7 APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify permanent APK signature and frozen FrameGen
        shell: bash
        run: |
          set -euo pipefail
          APK='artifacts/vitastation-android/app.apk'
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/vitastation-apksigner.txt"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          report = Path(os.environ["RUNNER_TEMP"]) / "vitastation-apksigner.txt"
          data = report.read_text(encoding="utf-8", errors="replace")
          m = re.search(r"certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)", data)
          if not m:
              raise SystemExit("::error::apksigner certificate SHA-256 digest not found")
          actual = m.group(1).replace(":", "").lower()
          expected = os.environ["VITASTATION_SIGNING_CERT_SHA256"].lower()
          if actual != expected:
              raise SystemExit(
                  f"::error::Signing certificate mismatch expected={expected} actual={actual}"
              )

          frozen = {
              "vita3k/renderer/src/vulkan/frame_generation.cpp": "1e7cc634f3308566b6ea3d972b73c55086f8f781",
          }
          for path, wanted in frozen.items():
              got = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              if got != wanted:
                  raise SystemExit(f"::error::Frozen component drift after build: {path}")

          print(f"[VS-FIX7] permanent signing certificate verified: {actual}")
          print("[VS-FIX7] FrameGen remained byte-identical")
          PY

      - name: Rename and hash FIX7 APK
        shell: bash
        run: |
          set -euo pipefail
          SRC='artifacts/vitastation-android/app.apk'
          DST="artifacts/vitastation-android/$FIX7_APK_NAME"
          test -s "$SRC"
          mv "$SRC" "$DST"
          sha256sum "$DST" | tee "artifacts/vitastation-android/$FIX7_APK_NAME.sha256"
          ls -lh "$DST"

      - name: Upload VitaStation FIX7 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.3.0-Alpha4-FIX7-Android-Signed
          path: |
            artifacts/vitastation-android/${{ env.FIX7_APK_NAME }}
            artifacts/vitastation-android/${{ env.FIX7_APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
