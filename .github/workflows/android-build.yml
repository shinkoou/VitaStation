# VitaStation Alpha 4 FIX8 MEGA
# Builds from the exact successful FIX7-R2 + green FIX7-R3 behavior, then applies one
# consolidated Mega Update: memory-map safety, Uncharted typeless isolation, Lord ABI
# compatibility, original-size PNG touch, real HACK controls, UI cleanup and telemetry.
# No Bootstrap. Gintama sync/Fractional-HD and FrameGen remain protected baselines.

name: VitaStation Android APK - Alpha 4 FIX8 MEGA

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: vitastation-android-fix8-mega-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30
  FIX8_APK_NAME: VitaStation-v0.3.0-Alpha4-FIX8-Mega-MemMap-Typeless-Lord-Touch-SkipCutscene-StableFG-Signed.apk

jobs:
  android-build:
    name: Build VitaStation v0.3.0 Alpha 4 FIX8 MEGA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply exact verified FIX7-R2 baseline from green Run 52
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          # [VS-FIX7-R3-R2-HISTORY] Read the exact green FIX7-R2 workflow from
          # Run #52's commit instead of the file currently being replaced.
          fix7_r2_commit = "2eddab750e31ede25ec771bc07fef4d5a00d32b8"
          workflow = subprocess.check_output(
              ["git", "show", f"{fix7_r2_commit}:.github/workflows/android-build.yml"],
              text=True,
          )

          def embedded_python(step_name: str) -> str:
              marker = f'      - name: {step_name}'
              step = workflow.find(marker)
              if step < 0:
                  raise SystemExit(f'::error::FIX7-R2 step not found: {step_name}')
              begin_marker = "          python3 - <<'PY'\n"
              begin = workflow.find(begin_marker, step)
              if begin < 0:
                  raise SystemExit(f'::error::Python block not found in: {step_name}')
              begin += len(begin_marker)
              end = workflow.find('\n          PY', begin)
              if end < 0:
                  raise SystemExit(f'::error::Python terminator not found in: {step_name}')
              raw = workflow[begin:end]
              lines = raw.splitlines()
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)

          for step_name in (
              'Guard exact FIX5 persisted source baseline',
              'Apply one consolidated FIX7 source patch',
              'FIX7 integrated source gates and regression audit',
          ):
              code = embedded_python(step_name)
              compile(code, f'<{step_name}>', 'exec')
              exec(code, {'__name__': '__main__'})
              print(f'[VS-FIX7-R3] inherited verified step: {step_name}')
          PY

      - name: Apply FIX7-R3 Fractional-HD and Eden delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'::error::{label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          # R3 app identity, after the inherited FIX7 patch has set 47/fix7.
          path = 'android/app/build.gradle'
          text = read(path)
          text = replace_once(text, 'versionCode = 47', 'versionCode = 48', 'R3 versionCode')
          text = replace_once(
              text,
              'versionName = "0.3.0-alpha4-fix7"',
              'versionName = "0.3.0-alpha4-fix7-r3"',
              'R3 versionName',
          )
          write(path, text)

          # Fractional-HD Surface Safety. Keep the existing framebuffer extent
          # convention and FIX4 compute reinterpret algorithm. The R3 delta only
          # makes cropped intervals, copy bounds, and fallback raw-row pitch coherent.
          path = 'vita3k/renderer/src/vulkan/surface_cache.cpp'
          text = read(path)
          text = replace_once(
              text,
              'namespace renderer::vulkan {\n\n\nstatic bool region_empty',
              'namespace renderer::vulkan {\n\n\n'
              '// [VS-FRACTIONAL-HD-SURFACE7R3] Canonical guest-to-scaled coordinate rule.\n'
              'static uint32_t vs_scale_surface_floor(const uint64_t value, const float scale) {\n'
              '    return static_cast<uint32_t>(static_cast<float>(value) * scale);\n'
              '}\n\n'
              'static uint32_t vs_scale_surface_interval_extent(\n'
              '    const uint32_t native_start, const uint32_t native_extent,\n'
              '    const float scale, const uint32_t scaled_start) {\n'
              '    const uint32_t scaled_end = vs_scale_surface_floor(\n'
              '        static_cast<uint64_t>(native_start) + native_extent, scale);\n'
              '    if (scaled_end > scaled_start)\n'
              '        return scaled_end - scaled_start;\n'
              '    return native_extent != 0 ? 1u : 0u;\n'
              '}\n\n'
              'static bool region_empty',
              'fractional helpers',
          )
          text = replace_once(
              text,
              '    const uint32_t width = static_cast<uint32_t>(original_width * state.res_multiplier);\n'
              '    const uint32_t height = static_cast<uint32_t>(original_height * state.res_multiplier);',
              '    uint32_t width = static_cast<uint32_t>(original_width * state.res_multiplier);\n'
              '    uint32_t height = static_cast<uint32_t>(original_height * state.res_multiplier);',
              'mutable cropped extent',
          )
          text = replace_once(
              text,
              '    const uint32_t data_delta = address - ite->first;\n'
              '    uint32_t start_sourced_line = static_cast<uint32_t>((data_delta / stride_bytes) * state.res_multiplier);\n'
              '    uint32_t start_x = static_cast<uint32_t>((data_delta % stride_bytes) / bytes_per_pixel_requested * state.res_multiplier);',
              '    const uint32_t data_delta = address - ite->first;\n'
              '    const uint32_t native_start_line = data_delta / stride_bytes;\n'
              '    const uint32_t native_start_x = (data_delta % stride_bytes) / bytes_per_pixel_requested;\n'
              '    const uint32_t start_sourced_line = vs_scale_surface_floor(native_start_line, state.res_multiplier);\n'
              '    const uint32_t start_x = vs_scale_surface_floor(native_start_x, state.res_multiplier);\n'
              '    if (bytes_per_pixel_requested == bytes_per_pixel_in_store)\n'
              '        width = vs_scale_surface_interval_extent(\n'
              '            native_start_x, original_width, state.res_multiplier, start_x);\n'
              '    height = vs_scale_surface_interval_extent(\n'
              '        native_start_line, original_height, state.res_multiplier, start_sourced_line);\n'
              '    const uint32_t source_available_width =\n'
              '        start_x < info.width ? info.width - start_x : 0u;\n'
              '    const uint32_t source_available_height =\n'
              '        start_sourced_line < info.height ? info.height - start_sourced_line : 0u;\n'
              '    if (source_available_height == 0\n'
              '        || (bytes_per_pixel_requested == bytes_per_pixel_in_store && source_available_width == 0)) {\n'
              '        LOG_WARN_ONCE("[VS-FRACTIONAL-HD-SURFACE7R3] cropped surface origin outside cached image");\n'
              '        return std::nullopt;\n'
              '    }\n'
              '    const bool fractional_surface_scale = state.res_multiplier !=\n'
              '        static_cast<float>(static_cast<uint32_t>(state.res_multiplier));\n'
              '    static thread_local uint64_t fractional_surface_log_counter = 0;\n'
              '    if (fractional_surface_scale && (native_start_x != 0 || native_start_line != 0)\n'
              '        && ((++fractional_surface_log_counter & 0x3FFu) == 1u)) {\n'
              '        LOG_DEBUG("[VS-FRACTIONAL-HD-SURFACE7R3] native_start=({}, {}) scaled_start=({}, {}) extent={}x{} available={}x{} scale={}",\n'
              '            native_start_x, native_start_line, start_x, start_sourced_line, width, height,\n'
              '            source_available_width, source_available_height, state.res_multiplier);\n'
              '    }',
              'fractional cropped origin',
          )
          text = replace_once(
              text,
              '                    std::min<uint32_t>(width, info.width),\n'
              '                    std::min<uint32_t>(height, info.height),',
              '                    std::min<uint32_t>(width, source_available_width),\n'
              '                    std::min<uint32_t>(height, source_available_height),',
              'offset-aware equal-bpp clamp',
          )
          text = replace_once(
              text,
              '                const vk::DeviceSize buffer_size =\n'
              '                    static_cast<vk::DeviceSize>(stride_bytes)\n'
              '                        * static_cast<size_t>(state.res_multiplier * align(height, 4))\n'
              '                    + static_cast<vk::DeviceSize>(start_x) * bytes_per_pixel_requested\n'
              '                    + bytes_per_pixel_requested;\n\n'
              '                if (!casted->transition_buffer.buffer\n'
              '                    || casted->transition_buffer.size < buffer_size) {\n'
              '                    state.frame().destroy_queue.add_buffer(casted->transition_buffer);\n'
              '                    casted->transition_buffer = vkutil::Buffer(buffer_size);\n'
              '                    casted->transition_buffer.init_buffer(\n'
              '                        vk::BufferUsageFlagBits::eTransferDst\n'
              '                        | vk::BufferUsageFlagBits::eTransferSrc);\n'
              '                }\n\n'
              '                const uint32_t src_pixel_stride = static_cast<uint32_t>(\n'
              '                    (info.stride_bytes / bytes_per_pixel_in_store)\n'
              '                    * state.res_multiplier);',
              '                // [VS-FRACTIONAL-HD-ROW-PITCH7R3] One canonical scaled raw-row pitch.\n'
              '                const uint32_t src_pixel_stride = vs_scale_surface_floor(\n'
              '                    info.stride_bytes / bytes_per_pixel_in_store, state.res_multiplier);\n'
              '                const vk::DeviceSize scaled_row_bytes =\n'
              '                    static_cast<vk::DeviceSize>(src_pixel_stride) * bytes_per_pixel_in_store;\n'
              '                const uint32_t copy_height = std::min<uint32_t>(height, source_available_height);\n'
              '                if (src_pixel_stride == 0 || scaled_row_bytes == 0 || copy_height == 0)\n'
              '                    return std::nullopt;\n'
              '                const vk::DeviceSize buffer_size =\n'
              '                    scaled_row_bytes * static_cast<vk::DeviceSize>(copy_height);\n\n'
              '                if (!casted->transition_buffer.buffer\n'
              '                    || casted->transition_buffer.size < buffer_size) {\n'
              '                    state.frame().destroy_queue.add_buffer(casted->transition_buffer);\n'
              '                    casted->transition_buffer = vkutil::Buffer(buffer_size);\n'
              '                    casted->transition_buffer.init_buffer(\n'
              '                        vk::BufferUsageFlagBits::eTransferDst\n'
              '                        | vk::BufferUsageFlagBits::eTransferSrc);\n'
              '                }',
              'canonical source row pitch',
          )
          text = replace_once(
              text,
              '                    .bufferImageHeight = height,',
              '                    .bufferImageHeight = copy_height,',
              'source buffer height',
          )
          text = replace_once(
              text,
              '                        std::min<uint32_t>(\n'
              '                            height,\n'
              '                            info.height > start_sourced_line\n'
              '                                ? info.height - start_sourced_line\n'
              '                                : 0),',
              '                        copy_height,',
              'source copy height',
          )
          text = replace_once(
              text,
              '                const uint32_t dst_pixel_stride = static_cast<uint32_t>(\n'
              '                    (stride_bytes / bytes_per_pixel_requested)\n'
              '                    * state.res_multiplier);',
              '                if ((scaled_row_bytes % bytes_per_pixel_requested) != 0)\n'
              '                    return std::nullopt;\n'
              '                const uint32_t dst_pixel_stride = static_cast<uint32_t>(\n'
              '                    scaled_row_bytes / bytes_per_pixel_requested);\n'
              '                const uint32_t dst_available_width =\n'
              '                    start_x < dst_pixel_stride ? dst_pixel_stride - start_x : 0u;\n'
              '                if (dst_available_width == 0)\n'
              '                    return std::nullopt;',
              'canonical destination row pitch',
          )
          text = replace_once(
              text,
              '                        std::min<uint32_t>(width, dst_pixel_stride),\n'
              '                        copy_image_buffer.imageExtent.height,',
              '                        std::min<uint32_t>(width, dst_available_width),\n'
              '                        copy_height,',
              'offset-aware typeless destination clamp',
          )
          write(path, text)

          # Eden attribution. Anchor only on semantic tokens, never whitespace.
          # [VS-EDEN-ATTRIBUTION7R3] This intentionally survives formatting changes
          # made by the inherited FIX7-R2 build-time patch.
          path = 'android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/SettingsSections.kt'
          text = read(path)
          eden_ui_anchor = 'SettingsNote(text = stringResource(R.string.settings_license_vitastation))'
          text = replace_once(
              text,
              eden_ui_anchor,
              eden_ui_anchor + '\n                  SettingsNote(text = stringResource(R.string.settings_license_eden))',
              'Eden license UI',
          )
          write(path, text)

          path = 'android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/SettingsSearch.kt'
          text = read(path)
          text = replace_once(
              text,
              'keywords = "license gpl mit bsd qualcomm lsfg vita3k"',
              'keywords = "license gpl mit bsd qualcomm lsfg vita3k eden"',
              'Eden license search',
          )
          write(path, text)

          path = 'android/app/src/main/res/values/strings.xml'
          text = read(path)
          eden_en_anchor = '<string name="settings_license_vitastation">VitaStation / Vita3K — GNU GPL v2</string>'
          text = replace_once(
              text,
              eden_en_anchor,
              '<string name="settings_license_vitastation">VitaStation / Vita3K — GNU GPL v2-or-later</string>\n'
              '              <string name="settings_license_eden">Eden emulator contributors — GNU GPL v3-or-later (compatibility/reference source: git.eden-emu.dev/eden-emu/eden)</string>',
              'Eden English attribution',
          )
          write(path, text)

          path = 'android/app/src/main/res/values-pt-rBR/strings.xml'
          text = read(path)
          eden_pt_anchor = '<string name="settings_license_vitastation">VitaStation / Vita3K — GNU GPL v2</string>'
          text = replace_once(
              text,
              eden_pt_anchor,
              '<string name="settings_license_vitastation">VitaStation / Vita3K — GNU GPL v2 ou posterior</string>\n'
              '              <string name="settings_license_eden">Colaboradores do emulador Eden — GNU GPL v3 ou posterior (fonte de compatibilidade/referência: git.eden-emu.dev/eden-emu/eden)</string>',
              'Eden PT-BR attribution',
          )
          write(path, text)

          print('[VS-FIX7-R3] Fractional-HD Surface Safety + Eden attribution applied')
          PY

      - name: FIX7-R3 regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def data(path):
              return Path(path).read_text(encoding='utf-8')

          def require(path, *markers):
              content = data(path)
              for marker in markers:
                  if marker not in content:
                      raise SystemExit(f'::error::FIX7-R3 gate missing in {path}: {marker}')

          require('android/app/build.gradle', 'versionCode = 48', 'versionName = "0.3.0-alpha4-fix7-r3"')
          require(
              'vita3k/renderer/src/vulkan/surface_cache.cpp',
              '[VS-FRACTIONAL-HD-SURFACE7R3]',
              'vs_scale_surface_interval_extent',
              'source_available_width',
              '[VS-FRACTIONAL-HD-ROW-PITCH7R3]',
              'scaled_row_bytes',
              'dst_available_width',
              '[VS-FEEDBACK-SNAPSHOT-SAMPLED7]',
              '[VS-TYPELESS-HD-STAGING]',
              'source_mutable=0',
          )
          require(
              'android/app/src/main/res/values/strings.xml',
              'VitaStation / Vita3K — GNU GPL v2-or-later',
              'Eden emulator contributors — GNU GPL v3-or-later',
          )
          require(
              'android/app/src/main/res/values-pt-rBR/strings.xml',
              'Colaboradores do emulador Eden — GNU GPL v3 ou posterior',
          )
          require(
              'android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/SettingsSections.kt',
              'settings_license_eden',
          )

          frozen = {
              'vita3k/renderer/src/vulkan/frame_generation.cpp': '1e7cc634f3308566b6ea3d972b73c55086f8f781',
              'vita3k/renderer/include/renderer/vulkan/surface_cache.h': 'c30ac772a497c59f93a9b5d27c3de1edeb20f451',
          }
          for path, wanted in frozen.items():
              got = subprocess.check_output(['git', 'hash-object', path], text=True).strip()
              if got != wanted:
                  raise SystemExit(f'::error::Frozen component changed: {path} expected={wanted} actual={got}')

          print('[VS-FIX7-R3] regression gates passed')
          print('[VS-FIX7-R3] FrameGen and FIX4 typeless staging header remain byte-identical')
          PY

      - name: Apply FIX8 Mega Update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          
          def read(path):
              return Path(path).read_text(encoding='utf-8')
          
          def write(path, text):
              Path(path).write_text(text, encoding='utf-8')
          
          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'::error::FIX8 {label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)
          
          def replace_first(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'::error::FIX8 {label}: anchor not found')
              return text.replace(old, new, 1)
          
          def function_span(text, marker):
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f'::error::FIX8 function marker missing: {marker}')
              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit(f'::error::FIX8 opening brace missing: {marker}')
              depth = 0
              in_string = False
              quote = ''
              escape = False
              for index in range(brace, len(text)):
                  ch = text[index]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == quote:
                          in_string = False
                      continue
                  if ch in ('"', "'"):
                      in_string = True
                      quote = ch
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          return start, index + 1
              raise SystemExit(f'::error::FIX8 closing brace missing: {marker}')
          
          def replace_function(text, marker, new_body):
              start, end = function_span(text, marker)
              return text[:start] + new_body + text[end:]
          
          # ---------------------------------------------------------------
          # Version identity.
          # ---------------------------------------------------------------
          path = 'android/app/build.gradle'
          text = read(path)
          text = replace_once(text, 'versionCode = 48', 'versionCode = 49', 'versionCode')
          text = replace_once(
              text,
              'versionName = "0.3.0-alpha4-fix7-r3"',
              'versionName = "0.3.0-alpha4-fix8"',
              'versionName',
          )
          write(path, text)
          
          # ---------------------------------------------------------------
          # Memory Mapping FIX8
          # Double Buffer does not enable MemState::use_page_table, so the
          # Gintama-stable Double Buffer path remains outside these changes.
          # ---------------------------------------------------------------
          path = 'vita3k/mem/src/mem.cpp'
          text = read(path)
          
          new_unprotect = r'''// [VS-MEMMAP-PROTECT8] Protect one translated host run.
          static void vs_apply_host_protection(MemState &state, uint8_t *target, const size_t size, const MemPerm perm) {
              if (!target || size == 0)
                  return;
          
              uint8_t *aligned_start = reinterpret_cast<uint8_t *>(
                  align_down(reinterpret_cast<uintptr_t>(target), state.host_page_size));
              uint8_t *aligned_end = reinterpret_cast<uint8_t *>(
                  align(reinterpret_cast<uintptr_t>(target + size), state.host_page_size));
              const size_t aligned_size = static_cast<size_t>(aligned_end - aligned_start);
          
          #ifdef _WIN32
              DWORD old_protect = 0;
              const DWORD host_perm = (perm == MemPerm::None)
                  ? PAGE_NOACCESS
                  : ((perm == MemPerm::ReadOnly) ? PAGE_READONLY : PAGE_READWRITE);
              const BOOL ret = VirtualProtect(aligned_start, aligned_size, host_perm, &old_protect);
              LOG_CRITICAL_IF(!ret, "VirtualProtect failed: {}", get_error_msg());
          #else
              const int host_perm = (perm == MemPerm::None)
                  ? PROT_NONE
                  : ((perm == MemPerm::ReadOnly) ? PROT_READ : (PROT_READ | PROT_WRITE));
              const int ret = mprotect(aligned_start, aligned_size, host_perm);
              LOG_CRITICAL_IF(ret == -1, "mprotect failed: {}", get_error_msg());
          #endif
          }
          
          // [VS-MEMMAP-PROTECT8] A guest range may cross separate translated buffers.
          // Group pages that share one translation base before changing host protection.
          static void vs_apply_guest_protection(MemState &state, Address addr, const uint32_t size, const MemPerm perm) {
              if (size == 0)
                  return;
          
              if (!state.use_page_table) {
                  vs_apply_host_protection(state, &state.memory[addr], size, perm);
                  return;
              }
          
              uint64_t cursor = addr;
              const uint64_t guest_end = static_cast<uint64_t>(addr) + size;
              while (cursor < guest_end) {
                  const uint64_t page_index = cursor / STANDARD_PAGE_SIZE;
                  uint8_t *const translation_base = state.page_table[page_index];
                  uint64_t run_end = std::min<uint64_t>((page_index + 1) * STANDARD_PAGE_SIZE, guest_end);
                  while (run_end < guest_end) {
            const uint64_t next_page = run_end / STANDARD_PAGE_SIZE;
            if (state.page_table[next_page] != translation_base)
                break;
            run_end = std::min<uint64_t>(run_end + STANDARD_PAGE_SIZE, guest_end);
                  }
                  vs_apply_host_protection(
            state,
            translation_base + cursor,
            static_cast<size_t>(run_end - cursor),
            perm);
                  cursor = run_end;
              }
          }
          
          void unprotect_inner(MemState &state, Address addr, uint32_t size) {
              vs_apply_guest_protection(state, addr, size, MemPerm::ReadWrite);
          }'''
          text = replace_function(text, 'void unprotect_inner(', new_unprotect)
          
          new_protect = r'''void protect_inner(MemState &state, Address addr, uint32_t size, const MemPerm perm) {
              vs_apply_guest_protection(state, addr, size, perm);
          }'''
          text = replace_function(text, 'void protect_inner(', new_protect)
          
          new_add_mapping = r'''void add_external_mapping(MemState &mem, Address addr, uint32_t size, uint8_t *addr_ptr) {
              if (!mem.use_page_table)
                  return;
              if ((size & (STANDARD_PAGE_SIZE - 1)) != 0 || addr_ptr == nullptr) {
                  LOG_ERROR("[VS-MEMMAP-HOSTPAGE8] invalid external mapping guest={} size={}", log_hex(addr), size);
                  return;
              }
          
              const uint32_t first_page = addr / STANDARD_PAGE_SIZE;
              const uint32_t page_count = size / STANDARD_PAGE_SIZE;
              uint8_t *const page_table_entry = addr_ptr - addr;
              uint8_t *const original_address = &mem.memory[addr];
          
              // Copy while all page-table entries still point to original Vita memory.
              for (uint32_t block = 0; block < page_count; ++block) {
