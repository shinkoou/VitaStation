name: VitaStation Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import Vita3K-Plus snapshot
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/nckstwrt/Vita3K-Plus.git || true
          git fetch upstream master
          git checkout upstream/master -- .

      - name: Keep VitaStation bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          cp .github/workflows/vitastation-bootstrap.yml /tmp/vitastation-bootstrap.yml
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp /tmp/vitastation-bootstrap.yml .github/workflows/vitastation-bootstrap.yml

      - name: Apply VitaStation Phase 01 selectable Grid
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          ROOT = Path("android/app/src/main/java/org/vita3k/emulator")

          def replace_once(path: Path, old: str, new: str, label: str):
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected exactly 1 match in {path}, found {count}"
                  )
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print(f"OK: {label}")

          # ---------------------------------------------------------------
          # AppsListViewModel.kt
          # Persist selected Library mode and expose explicit setter.
          # ---------------------------------------------------------------
          vm = ROOT / "ui/viewmodel/AppsListViewModel.kt"

          replace_once(
              vm,
              "import android.app.Application\n",
              "import android.app.Application\nimport android.content.Context\n",
              "AppsListViewModel import Context",
          )

          replace_once(
              vm,
              "import org.vita3k.emulator.data.ViewMode\n\nclass AppsListViewModel",
              """import org.vita3k.emulator.data.ViewMode

          private const val UI_PREFS_NAME = "vitastation_ui"
          private const val KEY_LIBRARY_VIEW_MODE = "library_view_mode"

          class AppsListViewModel""",
              "AppsListViewModel preference constants",
          )

          replace_once(
              vm,
              """    private fun qty(@PluralsRes id: Int, quantity: Int, vararg args: Any): String =
                  getApplication<Application>().resources.getQuantityString(id, quantity, *args)

          """,
              """    private fun qty(@PluralsRes id: Int, quantity: Int, vararg args: Any): String =
                  getApplication<Application>().resources.getQuantityString(id, quantity, *args)

              private val uiPreferences =
                  application.getSharedPreferences(UI_PREFS_NAME, Context.MODE_PRIVATE)

          """,
              "AppsListViewModel SharedPreferences",
          )

          replace_once(
              vm,
              "    var viewMode by mutableStateOf(ViewMode.LIST)\n",
              "    var viewMode by mutableStateOf(loadViewMode())\n",
              "AppsListViewModel restore view mode",
          )

          replace_once(
              vm,
              """    fun toggleViewMode() {
                  viewMode = if (viewMode == ViewMode.LIST) ViewMode.GRID else ViewMode.LIST
              }
          """,
              """    fun setViewMode(mode: ViewMode) {
                  if (viewMode == mode) return

                  viewMode = mode
                  uiPreferences.edit()
                      .putString(KEY_LIBRARY_VIEW_MODE, mode.name)
                      .apply()
              }

              fun toggleViewMode() {
                  setViewMode(if (viewMode == ViewMode.LIST) ViewMode.GRID else ViewMode.LIST)
              }

              private fun loadViewMode(): ViewMode {
                  val storedMode = uiPreferences.getString(
                      KEY_LIBRARY_VIEW_MODE,
                      ViewMode.LIST.name
                  )

                  return runCatching {
                      ViewMode.valueOf(storedMode ?: ViewMode.LIST.name)
                  }.getOrDefault(ViewMode.LIST)
              }
          """,
              "AppsListViewModel explicit/persistent view mode",
          )

          # ---------------------------------------------------------------
          # FilterSheet.kt
          # Explicit List/Grid choices.
          # ---------------------------------------------------------------
          filter_sheet = ROOT / "ui/screens/FilterSheet.kt"

          replace_once(
              filter_sheet,
              "    onViewModeToggle: () -> Unit,\n",
              "    onViewModeChanged: (ViewMode) -> Unit,\n",
              "FilterSheet callback",
          )

          replace_once(
              filter_sheet,
              "                    onClick = { if (viewMode != ViewMode.LIST) onViewModeToggle() },\n",
              "                    onClick = { onViewModeChanged(ViewMode.LIST) },\n",
              "FilterSheet LIST selection",
          )

          replace_once(
              filter_sheet,
              "                    onClick = { if (viewMode != ViewMode.GRID) onViewModeToggle() },\n",
              "                    onClick = { onViewModeChanged(ViewMode.GRID) },\n",
              "FilterSheet GRID selection",
          )

          # ---------------------------------------------------------------
          # AppsListScreen.kt
          # Explicit callback + visible buttons in Library toolbar.
          # FIX2: insertion anchors only to the unique Search action line,
          # avoiding brittle whitespace matching from FIX1.
          # ---------------------------------------------------------------
          screen = ROOT / "ui/screens/AppsListScreen.kt"

          replace_once(
              screen,
              "    onViewModeToggle: () -> Unit,\n",
              "    onViewModeChanged: (ViewMode) -> Unit,\n",
              "AppsListScreen callback",
          )

          search_action = """                            IconButton(onClick = { showSearchBar = true }) {
                                  Icon(Icons.Default.Search, contentDescription = stringResource(R.string.apps_list_cd_search))
                              }
          """

          view_buttons = """                            IconButton(onClick = { onViewModeChanged(ViewMode.LIST) }) {
                                  Icon(
                                      Icons.AutoMirrored.Filled.List,
                                      contentDescription = stringResource(R.string.filter_view_list),
                                      tint = if (viewMode == ViewMode.LIST)
                                          MaterialTheme.colorScheme.primary
                                      else
                                          MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              }
                              IconButton(onClick = { onViewModeChanged(ViewMode.GRID) }) {
                                  Icon(
                                      Icons.Default.GridView,
                                      contentDescription = stringResource(R.string.filter_view_grid),
                                      tint = if (viewMode == ViewMode.GRID)
                                          MaterialTheme.colorScheme.primary
                                      else
                                          MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              }
          """ + search_action

          replace_once(
              screen,
              search_action,
              view_buttons,
              "AppsListScreen visible List/Grid selector",
          )

          replace_once(
              screen,
              "            onViewModeToggle = onViewModeToggle,\n",
              "            onViewModeChanged = onViewModeChanged,\n",
              "AppsListScreen FilterSheet wiring",
          )

          # ---------------------------------------------------------------
          # AppNavigation.kt
          # Wire explicit selection to ViewModel.
          # ---------------------------------------------------------------
          nav = ROOT / "ui/navigation/AppNavigation.kt"

          replace_once(
              nav,
              "                onViewModeToggle = { appsListViewModel.toggleViewMode() },\n",
              "                onViewModeChanged = { mode -> appsListViewModel.setViewMode(mode) },\n",
              "AppNavigation view mode wiring",
          )

          print("VitaStation Phase 01 source changes applied successfully.")
          PY

          rm -f VitaStation-v0.1.0-Phase01-Selectable-Grid.patch

      - name: Validate source changes
        shell: bash
        run: |
          set -euo pipefail

          SCREEN="android/app/src/main/java/org/vita3k/emulator/ui/screens/AppsListScreen.kt"
          VM="android/app/src/main/java/org/vita3k/emulator/ui/viewmodel/AppsListViewModel.kt"
          FILTER="android/app/src/main/java/org/vita3k/emulator/ui/screens/FilterSheet.kt"
          NAV="android/app/src/main/java/org/vita3k/emulator/ui/navigation/AppNavigation.kt"

          grep -q 'onViewModeChanged(ViewMode.LIST)' "$SCREEN"
          grep -q 'onViewModeChanged(ViewMode.GRID)' "$SCREEN"
          grep -q 'KEY_LIBRARY_VIEW_MODE' "$VM"
          grep -q 'fun setViewMode(mode: ViewMode)' "$VM"
          grep -q 'onViewModeChanged(ViewMode.GRID)' "$FILTER"
          grep -q 'appsListViewModel.setViewMode(mode)' "$NAV"

          git diff --check
          git status --short

      - name: Commit VitaStation foundation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "VitaStation v0.1.0 Phase 01: import base and selectable Grid"
          git push origin HEAD:main
