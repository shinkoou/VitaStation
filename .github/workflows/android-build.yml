name: VitaStation Android APK - Alpha 4 FIX2 R1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30

jobs:
  android-build:
    name: Build VitaStation v0.3.0 Alpha 4 FIX2 R1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply Alpha 4 FIX2 payload + repair Gamepad Kotlin
        shell: bash
        run: |
          set -euo pipefail

          # Recover the exact FIX2 payload from the immutable Run #36 commit.
          # fetch-depth: 0 above guarantees the commit is available locally.
          ORIGINAL_FIX2_COMMIT="54a03697bb76f86fb7e1f1debe2c36b77fbb857f"
          git cat-file -e "${ORIGINAL_FIX2_COMMIT}^{commit}"
          git show "${ORIGINAL_FIX2_COMMIT}:.github/workflows/android-build.yml" \
            > /tmp/vs-original-fix2-workflow.yml

          python3 - <<'PY'
          import base64
          import gzip
          import re
          from pathlib import Path

          source_workflow = Path("/tmp/vs-original-fix2-workflow.yml")
          text = source_workflow.read_text(encoding="utf-8")
          match = re.search(
              r"printf '%s' '([A-Za-z0-9+/=]+)' "
              r"\| base64 --decode \| gzip --decompress "
              r"> /tmp/vs-alpha4-fix2\.py",
              text,
          )
          if not match:
              raise SystemExit(
                  "::error::Could not locate the embedded Alpha 4 FIX2 payload "
                  "inside android-build.yml."
              )

          payload = base64.b64decode(match.group(1), validate=True)
          script = gzip.decompress(payload)
          Path("/tmp/vs-alpha4-fix2.py").write_bytes(script)

          print(f"Recovered FIX2 payload: {len(script)} bytes")
          PY

          python3 -m py_compile /tmp/vs-alpha4-fix2.py
          python3 /tmp/vs-alpha4-fix2.py

          # FIX2-R1:
          # The payload generated invalid Kotlin:
          #   name="${device.name.orEmpty()}"
          # inside a normal quoted Kotlin string.
          # Remove only those inner quotes and leave the rest of the FIX2 intact.
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/java/org/vita3k/emulator/InputDeviceUtils.kt"
          )
          text = path.read_text(encoding="utf-8")

          broken = 'name="${device.name.orEmpty()}" '
          fixed = 'name=${device.name.orEmpty()} '

          count = text.count(broken)
          if count != 1:
              raise SystemExit(
                  f"::error::Expected exactly one malformed VS-PAD name field, "
                  f"found {count}. Payload/source may have changed."
              )

          text = text.replace(broken, fixed, 1)
          path.write_text(text, encoding="utf-8")

          print("FIX2-R1: repaired InputDeviceUtils.kt VS-PAD diagnostic string.")
          PY

          # Fail early if the exact syntax bug is still present.
          grep -Fq 'name=${device.name.orEmpty()}' \
            android/app/src/main/java/org/vita3k/emulator/InputDeviceUtils.kt

          if grep -Fq 'name="${device.name.orEmpty()}"' \
            android/app/src/main/java/org/vita3k/emulator/InputDeviceUtils.kt; then
            echo "::error::Broken VS-PAD Kotlin quoting is still present."
            exit 1
          fi

          git diff --check
          grep -q 'versionCode = 41' android/app/build.gradle
          grep -q 'versionName = "0.3.0-alpha4"' android/app/build.gradle
          grep -q '\[VS-TYPELESS-HD-DEFERRED\]' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q 'kEnableHdTypelessExperimental = false' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q 'is_same_image || unresolved_scene_write' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q '\[VS-FG-SOFT-RESET\]' vita3k/renderer/src/vulkan/frame_generation.cpp
          grep -q '\[VS-FG-TRANSITION\]' vita3k/renderer/src/vulkan/frame_generation.cpp
          grep -q '\[VS-FG-FPS-GATE\]' vita3k/renderer/src/vulkan/frame_generation.cpp
          ! grep -q 'reset_lsfg_context' vita3k/renderer/src/vulkan/frame_generation.cpp
          grep -q '\[VS-KERNEL-SYNC-FIX\]' vita3k/kernel/src/sync_primitives.cpp
          grep -q 'condvar->uid = uid' vita3k/kernel/src/sync_primitives.cpp
          grep -q 'VitaStation Touch UI 2.1' android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java
          grep -q 'VITASTATION_CYAN' android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java
          grep -q '\[VS-PAD\]' android/app/src/main/java/org/vita3k/emulator/InputDeviceUtils.kt
          grep -q '\[VS-PAD-AXIS\]' android/app/src/main/java/org/vita3k/emulator/Emulator.java
          grep -q '\[VS-PAD-KEY\]' android/app/src/main/java/org/vita3k/emulator/Emulator.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and Kotlin preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac \
            --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done

          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"

          keytool -list -v \
            -keystore "$SIGNING_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/vitastation-key-info.txt"

          actual_fingerprint="$(
            grep -m1 'SHA256:' "$RUNNER_TEMP/vitastation-key-info.txt" \
              | sed 's/.*SHA256: //' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"

          if [ "$actual_fingerprint" != "$VITASTATION_SIGNING_CERT_SHA256" ]; then
            echo "::error::Permanent signing certificate fingerprint mismatch."
            exit 1
          fi

          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build VitaStation v0.3.0 Alpha 4 FIX2 R1 signed APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify permanent APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/vitastation-android/app.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK" \
            | tee "$RUNNER_TEMP/vitastation-apksigner.txt"

          actual="$(
            grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/vitastation-apksigner.txt" \
              | sed 's/.*digest: //' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"

          if [ "$actual" != "$VITASTATION_SIGNING_CERT_SHA256" ]; then
            echo "::error::APK permanent signature mismatch."
            exit 1
          fi

      - name: Persist Alpha 4 FIX2 R1 source only after green signed build
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            android/app/build.gradle \
            android/app/src/main/java/org/vita3k/emulator/Emulator.java \
            android/app/src/main/java/org/vita3k/emulator/InputDeviceUtils.kt \
            android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java \
            android/app/src/main/res/values/integers.xml \
            vita3k/kernel/src/sync_primitives.cpp \
            vita3k/renderer/src/vulkan/frame_generation.cpp \
            vita3k/renderer/src/vulkan/surface_cache.cpp

          if git diff --cached --quiet; then
            echo "Alpha 4 FIX2 R1 source already persisted."
          else
            git commit -m "VitaStation v0.3.0 Alpha 4 FIX2 R1: repair pad diagnostics [skip ci]"
            git push origin HEAD:main
          fi

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="artifacts/vitastation-android/app.apk"
          DST="artifacts/vitastation-android/VitaStation-v0.3.0-Alpha4-FIX2-R1-Recovery-FG221-Kernel-TouchUI21-PadDiag-Signed.apk"
          test -f "$SRC"
          mv "$SRC" "$DST"
          ls -lh "$DST"

      - name: Upload VitaStation v0.3.0 Alpha 4 FIX2 R1 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.3.0-Alpha4-FIX2-R1-Recovery-FG221-Kernel-TouchUI21-PadDiag-Signed-Android
          path: artifacts/vitastation-android/VitaStation-v0.3.0-Alpha4-FIX2-R1-Recovery-FG221-Kernel-TouchUI21-PadDiag-Signed.apk
          if-no-files-found: error
