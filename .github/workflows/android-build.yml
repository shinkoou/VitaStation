name: VitaStation Gintama Surface Feedback Sync FIX24

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-build.yml

permissions:
  contents: read

concurrency:
  group: vitastation-gintama-fix24-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30
  PROBE_APK_NAME: VitaStation-v0.3.0-Alpha4-FIX24-FeedbackSync-Signed.apk

jobs:
  build-fix:
    name: Build FIX24 Feedback Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Reconstruct exact FIX21 runtime source
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin b9e7cfd66daf3791d51f8c5c3d2ea8ca4009044c || true
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess
          import urllib.request

          fix21_commit = 'b9e7cfd66daf3791d51f8c5c3d2ea8ca4009044c'
          try:
              workflow = subprocess.check_output(
                  ['git', 'show', f'{fix21_commit}:.github/workflows/android-build.yml'],
                  text=True,
              )
          except subprocess.CalledProcessError:
              print("[FIX24] git show failed, downloading raw file via HTTP...")
              url = f'https://raw.githubusercontent.com/shinkoou/VitaStation/{fix21_commit}/.github/workflows/android-build.yml'
              req = urllib.request.Request(url)
              with urllib.request.urlopen(req) as response:
                  workflow = response.read().decode('utf-8')

          start_marker = '      - name: Apply exact verified FIX7-R2 baseline from green Run 52\n'
          end_marker = '      - name: Set up Java 17\n'
          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('::error::FIX24 could not locate FIX21 patch-stack boundaries')

          section = workflow[start:end]
          step_matches = list(re.finditer(r'(?m)^      - name: (.+)$', section))
          if not step_matches:
              raise SystemExit('::error::FIX24 found no inherited FIX21 steps')

          github_env_path = Path(os.environ['GITHUB_ENV'])

          def refresh_env(base_env):
              if not github_env_path.exists():
                  return base_env
              lines = github_env_path.read_text(encoding='utf-8', errors='replace').splitlines()
              parsed = {}
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if '<<' in line and '=' not in line.split('<<', 1)[0]:
                      key, delimiter = line.split('<<', 1)
                      key = key.strip()
                      delimiter = delimiter.strip()
                      i += 1
                      values = []
                      while i < len(lines) and lines[i] != delimiter:
                          values.append(lines[i])
                          i += 1
                      parsed[key] = '\n'.join(values)
                  elif '=' in line:
                      key, value = line.split('=', 1)
                      if key:
                          parsed[key] = value
                  i += 1
              base_env.update(parsed)
              return base_env

          env = dict(os.environ)
          ran = 0
          for idx, match in enumerate(step_matches):
              block_start = match.start()
              block_end = step_matches[idx + 1].start() if idx + 1 < len(step_matches) else len(section)
              block = section[block_start:block_end]
              name = match.group(1).strip()

              literal = re.search(r'(?m)^        run:\s*\|\s*$', block)
              if literal:
                  raw = block[literal.end():]
                  script_lines = []
                  for line in raw.splitlines():
                      if line.startswith('          '):
                          script_lines.append(line[10:])
                      elif not line.strip():
                          script_lines.append('')
                      else:
                          break
                  script = '\n'.join(script_lines).rstrip() + '\n'
              else:
                  single = re.search(r'(?m)^        run:\s+(.+)$', block)
                  if not single:
                      continue
                  script = single.group(1).strip() + '\n'

              print(f'\n[FIX24] >>> inherited FIX21 step: {name}', flush=True)
              env = refresh_env(env)
              # Usando stdin para resolver [Errno 7] Argument list too long
              subprocess.run(
                  ['bash'],
                  input=script,
                  text=True,
                  cwd='.',
                  env=env,
                  check=True,
              )
              env = refresh_env(env)
              ran += 1

          if ran < 10:
              raise SystemExit(f'::error::FIX24 inherited suspiciously few FIX21 steps: {ran}')

          gradle = Path('android/app/build.gradle').read_text(encoding='utf-8')
          if 'versionCode = 66' not in gradle or '0.3.0-alpha4-fix21-lord-skin-diag-gintama-feedback-cap' not in gradle:
              raise SystemExit('::error::FIX24 runtime reconstruction did not reach expected version')

          print(f'[FIX24] exact FIX21 runtime patch stack reconstructed; inherited run steps={ran}')
          PY

      - name: Inject FIX26 Memory Barriers & Lord UBO Fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text = text.replace('versionCode = 66', 'versionCode = 71', 1)
          text = text.replace(
              'versionName = "0.3.0-alpha4-fix21-lord-skin-diag-gintama-feedback-cap"',
              'versionName = "0.3.0-alpha4-fix26-feedback-sync-lord-ubo"',
              1
          )
          path.write_text(text, encoding='utf-8')

          def once(file_path, a, b, label):
              p = Path(file_path)
              t = p.read_text(encoding="utf-8")
              n = t.count(a)
              if n != 1:
                  raise SystemExit(f"::error::FIX26 {label}: anchor count={n}")
              t = t.replace(a, b, 1)
              p.write_text(t, encoding="utf-8")

          once(
              "vita3k/renderer/src/vulkan/surface_cache.cpp",
              "namespace renderer::vulkan {\n",
              """namespace renderer::vulkan {

          // [VS-GINTAMA-FEEDBACK-SYNC26]
          static void barrier_render_to_transfer_read(vk::CommandBuffer cmd_buffer, vk::Image image) {
              const vk::ImageMemoryBarrier barrier{
                  .srcAccessMask = vk::AccessFlagBits::eColorAttachmentWrite | vk::AccessFlagBits::eShaderWrite,
                  .dstAccessMask = vk::AccessFlagBits::eTransferRead | vk::AccessFlagBits::eShaderRead,
                  .oldLayout = vk::ImageLayout::eGeneral,
                  .newLayout = vk::ImageLayout::eGeneral,
                  .srcQueueFamilyIndex = VK_QUEUE_FAMILY_IGNORED,
                  .dstQueueFamilyIndex = VK_QUEUE_FAMILY_IGNORED,
                  .image = image,
                  .subresourceRange = vkutil::color_subresource_range
              };
              cmd_buffer.pipelineBarrier(
                  vk::PipelineStageFlagBits::eColorAttachmentOutput | vk::PipelineStageFlagBits::eFragmentShader,
                  vk::PipelineStageFlagBits::eTransfer | vk::PipelineStageFlagBits::eFragmentShader,
                  vk::DependencyFlags(),
                  {}, {}, barrier);
          }
          """, "barrier helper injection"
          )

          once(
              "vita3k/renderer/src/vulkan/surface_cache.cpp",
              "context->stop_render_pass();",
              """context->stop_render_pass();
            
            // [VS-GINTAMA-FEEDBACK-SYNC26] - Safely explicit flush now that render pass is stopped
            barrier_render_to_transfer_read(cmd_buffer, info.texture.image);
          """, 
              "resolve barrier safe injection"
          )

          once(
              "vita3k/renderer/src/vulkan/surface_cache.cpp",
              "[VS-GINTAMA-STAGING19]",
              "[VS-GINTAMA-STAGING19] [VS-GINTAMA-FEEDBACK-SYNC26]",
              "marker injection"
          )

          once(
              "vita3k/kernel/src/sync_primitives.cpp",
              "            if (((++ownership_rewaits & 0xFFu) == 1u)) {",
              """            // [VS-LORD-DEADLOCK-BREAKER]
            if (ownership_rewaits > 1000) {
                LOG_ERROR("[VS-LORD-DEADLOCK-BREAKER] Forcing ownership transfer of mutex {} from {} to {}", mutex->uid, mutex->owner ? mutex->owner->id : 0, thread_id);
                mutex->owner = thread;
                res = SCE_KERNEL_OK;
                break;
            }
            if (((++ownership_rewaits & 0xFFu) == 1u)) {""",
              "kernel deadlock breaker injection"
          )

          # Injeção para o Lord of Apocalypse (Null Pointer UBO Fix)
          once(
              "vita3k/modules/SceGxm/SceGxm.cpp",
              "    const size_t size = (size_t)program->default_uniform_buffer_count * 4;\n    // data for the ring buffer must be 4 bytes aligned\n    context->state.vertex_ring_buffer_used = align(context->state.vertex_ring_buffer_used, 4);",
              """    size_t size = (size_t)program->default_uniform_buffer_count * 4;
    // [VS-LORD-UBO-NULL-FIX] Prevent returning 0x0 for stripped shaders that need skinning UBOs
    if (size == 0) {
        LOG_ERROR("[VS-LORD-UBO-NULL-FIX] Shader default_uniform_buffer_count is 0! Forcing 1024 bytes allocation to prevent Null Pointer memory write!");
        size = 1024;
    }
    // data for the ring buffer must be 4 bytes aligned
    context->state.vertex_ring_buffer_used = align(context->state.vertex_ring_buffer_used, 4);""",
              "ubo null pointer fix"
          )

          print("[FIX26] Memory barriers and Lord UBO Fix injected correctly")
          PY

      - name: FIX26 regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          gradle = Path('android/app/build.gradle').read_text(encoding='utf-8')
          if 'versionCode = 71' not in gradle:
              raise SystemExit('::error::FIX26 versionCode gate failed')
          if 'versionName = "0.3.0-alpha4-fix26-feedback-sync-lord-ubo"' not in gradle:
              raise SystemExit('::error::FIX26 versionName gate failed')

          surface = Path('vita3k/renderer/src/vulkan/surface_cache.cpp').read_text(encoding='utf-8')
          for required in (
              '[VS-GINTAMA-FEEDBACK-BOUNDARY14]',
              '[VS-GINTAMA-DRAWTIME17]',
              '[VS-GINTAMA-STAGING19]',
              '[VS-TYPELESS-HD-STAGING]',
              '[VS-UNCHARTED-TYPELESS-CACHE9]',
              '[VS-GINTAMA-FEEDBACK-SYNC26]',
          ):
              if required not in surface:
                  raise SystemExit(f'::error::FIX26 missing protected marker {required}')

          sync = Path('vita3k/kernel/src/sync_primitives.cpp').read_text(encoding='utf-8')
          if '[VS-LORD-DEADLOCK-BREAKER]' not in sync:
              raise SystemExit('::error::FIX26 missing Deadlock Breaker marker in kernel')
          
          gxm = Path('vita3k/modules/SceGxm/SceGxm.cpp').read_text(encoding='utf-8')
          if '[VS-LORD-UBO-NULL-FIX]' not in gxm:
              raise SystemExit('::error::FIX26 missing UBO Null Fix marker in GXM')

          for forbidden in (
              '[VS-GINTAMA-FEEDBACK-BARRIER15]',
              'gintama_feedback_outside_pass15',
              'gintama_to_transfer15',
          ):
              if forbidden in surface:
                  raise SystemExit(f'::error::FIX24 forbidden Gintama regression {forbidden}')

          pipeline = Path('vita3k/renderer/src/vulkan/pipeline_cache.cpp').read_text(encoding='utf-8')
          if '[VS-GINTAMA-OUTGOING16]' in pipeline or 'gintama_outgoing_transfer16' in pipeline:
              raise SystemExit('::error::FIX24 OUTGOING16 must remain removed')

          got = subprocess.check_output(
              ['git', 'hash-object', 'vita3k/renderer/src/vulkan/frame_generation.cpp'],
              text=True,
          ).strip()
          wanted = '1e7cc634f3308566b6ea3d972b73c55086f8f781'
          if got != wanted:
              raise SystemExit(f'::error::FIX24 FrameGen drift expected={wanted} actual={got}')

          print('[FIX24] All gates passed.')
          print('[FIX24] FrameGen, Uncharted R2 Typeless, FIX19 staging and signing base preserved.')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and JVM preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac \
            --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done
          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"
          keytool -list -v -keystore "$SIGNING_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/vitastation-keytool.txt"
          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed FIX24 APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify frozen R2 shader is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK='artifacts/vitastation-android/app.apk'
          TMP_SPV="$RUNNER_TEMP/fix24-packaged-reinterpret.spv"
          test -s "$APK"
          test -n "${FIX10R2_SPV_SHA256:-}"
          unzip -p "$APK" 'assets/shaders-builtin/vulkan/surface_cast_reinterpret.comp.spv' > "$TMP_SPV"
          test -s "$TMP_SPV"
          APK_SHA="$(sha256sum "$TMP_SPV" | awk '{print $1}')"
          if [[ "$APK_SHA" != "$FIX10R2_SPV_SHA256" ]]; then
            echo "::error::APK contains wrong Typeless SPIR-V expected=$FIX10R2_SPV_SHA256 actual=$APK_SHA"
            exit 1
          fi
          echo "[FIX24] APK contains verified Typeless SPIR-V $APK_SHA"

      - name: Verify permanent APK signature and frozen FrameGen
        shell: bash
        run: |
          set -euo pipefail
          APK='artifacts/vitastation-android/app.apk'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/vitastation-apksigner.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess

          report = Path(os.environ['RUNNER_TEMP']) / 'vitastation-apksigner.txt'
          content = report.read_text(encoding='utf-8', errors='replace')
          match = re.search(r'certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)', content)
          if not match:
              raise SystemExit('::error::apksigner certificate SHA-256 digest not found')
          actual = match.group(1).replace(':', '').lower()
          expected = os.environ['VITASTATION_SIGNING_CERT_SHA256'].lower()
          if actual != expected:
              raise SystemExit(f'::error::Signing certificate mismatch expected={expected} actual={actual}')

          got = subprocess.check_output(
              ['git', 'hash-object', 'vita3k/renderer/src/vulkan/frame_generation.cpp'],
              text=True,
          ).strip()
          wanted = '1e7cc634f3308566b6ea3d972b73c55086f8f781'
          if got != wanted:
              raise SystemExit(f'::error::FrameGen drift expected={wanted} actual={got}')

          print(f'[FIX24] permanent signing certificate verified: {actual}')
          print('[FIX24] FrameGen remained byte-identical')
          PY

      - name: Rename and hash FIX24 APK
        shell: bash
        run: |
          set -euo pipefail
          SRC='artifacts/vitastation-android/app.apk'
          DST="artifacts/vitastation-android/$PROBE_APK_NAME"
          test -s "$SRC"
          mv "$SRC" "$DST"
          sha256sum "$DST" | tee "artifacts/vitastation-android/$PROBE_APK_NAME.sha256"
          ls -lh "$DST"

      - name: Upload FIX24 APK
        uses: actions/upload-artifact@v4
        with:
          name: VitaStation-FIX24-FeedbackSync-Android-Signed
          path: |
            artifacts/vitastation-android/${{ env.PROBE_APK_NAME }}
            artifacts/vitastation-android/${{ env.PROBE_APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
