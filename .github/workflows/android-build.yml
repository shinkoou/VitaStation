name: VitaStation Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'vita3k/**'
      - 'data/**'
      - '.ci/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vcpkg.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

env:
  VCPKG_ROOT: /usr/local/share/vcpkg

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: vitastation-android-native-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            vitastation-android-native-

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        run: bash ./.ci/setup-android.sh

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Build VitaStation APK
        run: bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/vitastation-android/app.apk
          mv artifacts/vitastation-android/app.apk artifacts/vitastation-android/VitaStation-v0.1.0-Phase01.apk
          ls -lh artifacts/vitastation-android/

      - name: Upload VitaStation APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.1.0-Phase01-Android
          path: artifacts/vitastation-android/VitaStation-v0.1.0-Phase01.apk
          if-no-files-found: error
