name: VitaStation Gintama Surface Feedback Sync FIX24

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-build.yml

permissions:
  contents: read

concurrency:
  group: vitastation-gintama-fix24-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30
  PROBE_APK_NAME: VitaStation-v0.3.0-Alpha4-FIX24-FeedbackSync-Signed.apk

jobs:
  build-fix:
    name: Build FIX24 Feedback Sync
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Inject FIX24 Memory Barriers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          # 1. Update Gradle config
          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text = re.sub(r'versionCode = \d+', 'versionCode = 69', text, count=1)
          text = re.sub(r'versionName = "[^"]+"', 'versionName = "0.3.0-alpha4-fix24-feedback-sync"', text, count=1)
          path.write_text(text, encoding='utf-8')

          # 2. Inject structural FIX24 into surface_cache.cpp
          p = Path("vita3k/renderer/src/vulkan/surface_cache.cpp")
          t = p.read_text(encoding="utf-8")

          if "[VS-GINTAMA-FEEDBACK-SYNC24]" in t:
              print("[FIX24] Already applied.")
          else:
              def once(a, b, label):
                  global t
                  n = t.count(a)
                  if n != 1:
                      raise SystemExit(f"::error::FIX24 {label}: anchor count={n}")
                  t = t.replace(a, b, 1)

              # Inject the helper barrier function with YAML-safe string formatting
              cpp_code = (
                  "namespace renderer::vulkan {\n\n"
                  "// [VS-GINTAMA-FEEDBACK-SYNC24]\n"
                  "static void vs_barrier_flush_gmem(vk::CommandBuffer cmd_buffer, vk::Image image) {\n"
                  "    const vk::ImageMemoryBarrier barrier{\n"
                  "        .srcAccessMask = vk::AccessFlagBits::eColorAttachmentWrite | vk::AccessFlagBits::eShaderWrite,\n"
                  "        .dstAccessMask = vk::AccessFlagBits::eTransferRead | vk::AccessFlagBits::eShaderRead | vk::AccessFlagBits::eColorAttachmentRead,\n"
                  "        .oldLayout = vk::ImageLayout::eGeneral,\n"
                  "        .newLayout = vk::ImageLayout::eGeneral,\n"
                  "        .srcQueueFamilyIndex = VK_QUEUE_FAMILY_IGNORED,\n"
                  "        .dstQueueFamilyIndex = VK_QUEUE_FAMILY_IGNORED,\n"
                  "        .image = image,\n"
                  "        .subresourceRange = vkutil::color_subresource_range\n"
                  "    };\n"
                  "    cmd_buffer.pipelineBarrier(\n"
                  "        vk::PipelineStageFlagBits::eColorAttachmentOutput | vk::PipelineStageFlagBits::eFragmentShader,\n"
                  "        vk::PipelineStageFlagBits::eTransfer | vk::PipelineStageFlagBits::eFragmentShader | vk::PipelineStageFlagBits::eColorAttachmentOutput,\n"
                  "        vk::DependencyFlags(),\n"
                  "        {}, {}, barrier);\n"
                  "}\n"
              )
              
              once("namespace renderer::vulkan {\n", cpp_code, "barrier helper injection")

              # Auto-wrap resolves to flush GMEM safely
              count_resolve = len(re.findall(r'\.resolveImage\(', t))
              t = re.sub(
                  r'([a-zA-Z0-9_>\.-]+)\.resolveImage\(\s*([a-zA-Z0-9_>\.-]+)\s*,',
                  r'vs_barrier_flush_gmem(\1, \2);\n    \1.resolveImage(\2,',
                  t
              )
              
              # Add marker
              if "[VS-GINTAMA-STAGING19]" not in t:
                  t = "// [VS-GINTAMA-STAGING19] [VS-GINTAMA-FEEDBACK-SYNC24]\n" + t
              else:
                  t = t.replace("[VS-GINTAMA-STAGING19]", "[VS-GINTAMA-STAGING19] [VS-GINTAMA-FEEDBACK-SYNC24]", 1)

              p.write_text(t, encoding="utf-8")
              print(f"[FIX24] Auto-wrapped {count_resolve} resolves with GMEM flush barriers.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and JVM preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac \
            --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done
          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"
          keytool -list -v -keystore "$SIGNING_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/vitastation-keytool.txt"
          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed FIX24 APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Rename and hash FIX24 APK
        shell: bash
        run: |
          set -euo pipefail
          SRC='artifacts/vitastation-android/app.apk'
          DST="artifacts/vitastation-android/$PROBE_APK_NAME"
          test -s "$SRC"
          mv "$SRC" "$DST"
          sha256sum "$DST" | tee "artifacts/vitastation-android/$PROBE_APK_NAME.sha256"
          ls -lh "$DST"

      - name: Upload FIX24 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-FIX24-FeedbackSync-Android-Signed
          path: |
            artifacts/vitastation-android/${{ env.PROBE_APK_NAME }}
            artifacts/vitastation-android/${{ env.PROBE_APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
