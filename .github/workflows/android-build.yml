name: VitaStation Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'vita3k/**'
      - 'data/**'
      - '.ci/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vcpkg.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

env:
  VCPKG_ROOT: /usr/local/share/vcpkg

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Repair Phase01 Kotlin viewMode clash
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/java/org/vita3k/emulator/ui/viewmodel/"
              "AppsListViewModel.kt"
          )
          text = path.read_text(encoding="utf-8")

          already_fixed = (
              "private var _viewMode by mutableStateOf(loadViewMode())" in text
              and "val viewMode: ViewMode" in text
              and "fun setViewMode(mode: ViewMode)" in text
          )

          if already_fixed:
              print("Phase01 Kotlin setter clash is already repaired.")
          else:
              old_property = """    var viewMode by mutableStateOf(loadViewMode())
                  private set
          """
              new_property = """    private var _viewMode by mutableStateOf(loadViewMode())
              val viewMode: ViewMode
                  get() = _viewMode
          """

              if text.count(old_property) != 1:
                  raise SystemExit(
                      "Could not find the expected viewMode property exactly once."
                  )
              text = text.replace(old_property, new_property, 1)

              replacements = [
                  (
                      "        if (viewMode == mode) return\n",
                      "        if (_viewMode == mode) return\n",
                  ),
                  (
                      "        viewMode = mode\n",
                      "        _viewMode = mode\n",
                  ),
                  (
                      "        setViewMode(if (viewMode == ViewMode.LIST) ViewMode.GRID else ViewMode.LIST)\n",
                      "        setViewMode(if (_viewMode == ViewMode.LIST) ViewMode.GRID else ViewMode.LIST)\n",
                  ),
              ]

              for old, new in replacements:
                  if text.count(old) != 1:
                      raise SystemExit(
                          f"Expected exactly one occurrence of: {old.strip()}"
                      )
                  text = text.replace(old, new, 1)

              path.write_text(text, encoding="utf-8")
              print("Repaired Phase01 Kotlin setter clash.")

          final = path.read_text(encoding="utf-8")

          if "    var viewMode by mutableStateOf(loadViewMode())" in final:
              raise SystemExit("Old mutable viewMode property still exists.")
          if "private var _viewMode by mutableStateOf(loadViewMode())" not in final:
              raise SystemExit("Backing _viewMode state was not created.")
          if "fun setViewMode(mode: ViewMode)" not in final:
              raise SystemExit("Public setViewMode API is missing.")

          print("Phase01 Kotlin repair validation passed.")
          PY

          git diff --check

      - name: Persist source repair
        shell: bash
        run: |
          set -euo pipefail

          TARGET="android/app/src/main/java/org/vita3k/emulator/ui/viewmodel/AppsListViewModel.kt"

          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add "$TARGET"

          if git diff --cached --quiet; then
            echo "Source repair already committed."
          else
            git commit -m "Fix Phase 01 view mode JVM setter clash"
            git push origin HEAD:main
          fi

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: vitastation-android-native-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            vitastation-android-native-

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        run: bash ./.ci/setup-android.sh

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Build VitaStation APK
        run: bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/vitastation-android/app.apk
          mv artifacts/vitastation-android/app.apk \
            artifacts/vitastation-android/VitaStation-v0.1.0-Phase01.apk
          ls -lh artifacts/vitastation-android/

      - name: Upload VitaStation APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.1.0-Phase01-Android
          path: artifacts/vitastation-android/VitaStation-v0.1.0-Phase01.apk
          if-no-files-found: error
