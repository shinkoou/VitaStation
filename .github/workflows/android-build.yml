name: VitaStation Android Build (FIX21 Base + New Fixes)

"on":
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-build.yml

permissions:
  contents: read

concurrency:
  group: vitastation-build-fixed
  cancel-in-progress: true

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30

jobs:
  build:
    name: Build Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Reconstruct exact FIX21 runtime source from verified parent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          FIX21_WORKFLOW_COMMIT = "b9e7cfd66daf3791d51f8c5c3d2ea8ca4009044c"
          workflow = subprocess.check_output(
              ["git", "show", f"{FIX21_WORKFLOW_COMMIT}:.github/workflows/android-build.yml"],
              text=True,
          )

          start_marker = "      - name: Apply exact verified FIX7-R2 baseline from green Run 52"
          end_marker = "      - name: Set up Java 17"

          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit("::error::FIX21 parent reconstruction boundary failed")

          section = workflow[start:end]
          step_matches = list(re.finditer(r"(?m)^      - name: (.+)$", section))

          github_env_path = Path(os.environ["GITHUB_ENV"])

          def refresh_env(base_env):
              if not github_env_path.exists(): return base_env
              lines = github_env_path.read_text(encoding="utf-8", errors="replace").splitlines()
              parsed = {}
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if "<<" in line and "=" not in line.split("<<", 1)[0]:
                      key, delimiter = line.split("<<", 1)
                      key, delimiter = key.strip(), delimiter.strip()
                      i += 1
                      values = []
                      while i < len(lines) and lines[i] != delimiter:
                          values.append(lines[i]); i += 1
                      parsed[key] = "\n".join(values)
                  elif "=" in line:
                      key, value = line.split("=", 1)
                      if key: parsed[key] = value
                  i += 1
              base_env.update(parsed)
              return base_env

          env = dict(os.environ)
          for idx, match in enumerate(step_matches):
              block_start = match.start()
              block_end = step_matches[idx + 1].start() if idx + 1 < len(step_matches) else len(section)
              block = section[block_start:block_end]

              literal = re.search(r"(?m)^        run:\s*\|\s*$", block)
              if literal:
                  raw = block[literal.end():]
                  script_lines = []
                  for line in raw.splitlines():
                      if line.startswith("          "): script_lines.append(line[10:])
                      elif not line.strip(): script_lines.append("")
                      else: break
                  script = "\n".join(script_lines).rstrip() + "\n"
              else:
                  single = re.search(r"(?m)^        run:\s+(.+)$", block)
                  if not single: continue
                  script = single.group(1).strip() + "\n"

              env = refresh_env(env)
              subprocess.run(["bash", "-c", script], cwd=".", env=env, check=True)
              env = refresh_env(env)

          print("[VS-FIX21] Base reconstructed successfully.")
          PY

      - name: Apply New Fixes (LORD and GINTAMA)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # --- LORD Fix: Normalize U8 attributes ---
          path_lord = Path("vita3k/shader/src/spirv_recompiler.cpp")
          text_lord = path_lord.read_text(encoding="utf-8")
          if "convert_to_float(b, utils, var, dest.type, false)" in text_lord:
              text_lord = text_lord.replace("convert_to_float(b, utils, var, dest.type, false)",
                                            "convert_to_float(b, utils, var, dest.type, true)")
              path_lord.write_text(text_lord, encoding="utf-8")
              print("[FIX] LORD skinning normalization applied.")

          # --- GINTAMA Fix: Attachment Feedback Loop ---
          # 1. FeatureState
          path_state = Path("vita3k/features/include/features/state.h")
          text_state = path_state.read_text(encoding="utf-8")
          if "support_attachment_feedback" not in text_state:
              text_state = text_state.replace("bool use_texture_viewport = false; ///< Are we using texture viewports in the shader",
                                              "bool use_texture_viewport = false; ///< Are we using texture viewports in the shader\n    bool support_attachment_feedback = false; ///< Is the attachment feedback loop layout extension supported?")
              path_state.write_text(text_state, encoding="utf-8")
              print("[FIX] Gintama: FeatureState updated.")

          # 2. Renderer (Extensions and Device Creation)
          path_rend = Path("vita3k/renderer/src/vulkan/renderer.cpp")
          text_rend = path_rend.read_text(encoding="utf-8")

          # Add extension to map
          if '"VK_EXT_attachment_feedback_loop_layout"' not in text_rend:
              text_rend = text_rend.replace('{ "VK_EXT_FragmentShaderInterlockExtensionName", &support_shader_interlock },',
                                              '{ "VK_EXT_FragmentShaderInterlockExtensionName", &support_shader_interlock },\n            { "VK_EXT_attachment_feedback_loop_layout", &support_attachment_feedback },')

          # Add feature check
          if "support_attachment_feedback" not in text_rend:
              # Insert after shader_interlock check
              marker = "features.support_shader_interlock = support_shader_interlock;"
              if marker in text_rend:
                  insertion = "\n        if (support_attachment_feedback) {\n            auto props = physical_device.getFeatures2KHR<vk::PhysicalDeviceFeatures2, vk::PhysicalDeviceAttachmentFeedbackLoopLayoutFeaturesEXT>();\n            support_attachment_feedback = static_cast<bool>(props.get<vk::PhysicalDeviceAttachmentFeedbackLoopLayoutFeaturesEXT>().attachmentFeedbackLoopLayout);\n            features.support_attachment_feedback = support_attachment_feedback;\n        }"
                  text_rend = text_rend.replace(marker, marker + insertion)

          # Update StructureChain
          if "vk::PhysicalDeviceAttachmentFeedbackLoopLayoutFeaturesEXT" not in text_rend:
              text_rend = text_rend.replace("vk::PhysicalDeviceFragmentShaderInterlockFeaturesEXT,",
                                              "vk::PhysicalDeviceFragmentShaderInterlockFeaturesEXT,\n            vk::PhysicalDeviceAttachmentFeedbackLoopLayoutFeaturesEXT,")
              text_rend = text_rend.replace(".fragmentShaderSampleInterlock = VK_TRUE },",
                                              ".fragmentShaderSampleInterlock = VK_TRUE },\n                vk::PhysicalDeviceAttachmentFeedbackLoopLayoutFeaturesEXT{\n                    .attachmentFeedbackLoopLayout = VK_TRUE },")
              text_rend = text_rend.replace("if (!support_shader_interlock)",
                                              "if (!support_shader_interlock)\n        if (!support_attachment_feedback)\n            device_info.unlink<vk::PhysicalDeviceAttachmentFeedbackLoopLayoutFeaturesEXT>();")
              # Fix the unlink logic properly
              text_rend = text_rend.replace("if (!support_shader_interlock)\n            device_info.unlink<vk::PhysicalDeviceFragmentShaderInterlockFeaturesEXT>();",
                                              "if (!support_shader_interlock)\n            device_info.unlink<vk::PhysicalDeviceFragmentShaderInterlockFeaturesEXT>();\n        if (!support_attachment_feedback)\n            device_info.unlink<vk::PhysicalDeviceAttachmentFeedbackLoopLayoutFeaturesEXT>();")

          path_rend.write_text(text_rend, encoding="utf-8")
          print("[FIX] Gintama: Renderer updated.")

          # 3. Surface Cache (Barriers and Layouts)
          path_surf = Path("vita3k/renderer/src/vulkan/surface_cache.cpp")
          text_surf = path_surf.read_text(encoding="utf-8")

          # Update Barrier Layouts
          text_surf = text_surf.replace(".oldLayout = vk::ImageLayout::eGeneral,\n                .newLayout = vk::ImageLayout::eGeneral,",
                                         ".oldLayout = state.features.support_attachment_feedback ? vk::ImageLayout::eAttachmentFeedbackLoopOptimalEXT : vk::ImageLayout::eGeneral,\n                .newLayout = state.features.support_attachment_feedback ? vk::ImageLayout::eAttachmentFeedbackLoopOptimalEXT : vk::ImageLayout::eGeneral,")

          # Update copyImage
          text_surf = text_surf.replace("cmd_buffer.copyImage(info.texture.image, vk::ImageLayout::eGeneral, casted->texture.image, vk::ImageLayout::eTransferDstOptimal, image_copy);",
                                         "cmd_buffer.copyImage(info.texture.image, state.features.support_attachment_feedback ? vk::ImageLayout::eAttachmentFeedbackLoopOptimalEXT : vk::ImageLayout::eGeneral, casted->texture.image, vk::ImageLayout::eTransferDstOptimal, image_copy);")

          # Update copyImageToBuffer
          text_surf = text_surf.replace("cmd_buffer.copyImageToBuffer(\n                    info.texture.image,\n                    vk::ImageLayout::eGeneral,\n                    info.reinterpret_staging_buffer->buffer,",
                                         "cmd_buffer.copyImageToBuffer(\n                    info.texture.image,\n                    state.features.support_attachment_feedback ? vk::ImageLayout::eAttachmentFeedbackLoopOptimalEXT : vk::ImageLayout::eGeneral,\n                    info.reinterpret_staging_buffer->buffer,")

          path_surf.write_text(text_surf, encoding="utf-8")
          print("[FIX] Gintama: SurfaceCache updated.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and JVM preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac \
            --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done

          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"

          keytool -list -v \
            -keystore "$SIGNING_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/vitastation-keytool.txt"

          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify APK exists and hash it
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/vitastation-android/app.apk"
          test -s "$APK"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$APK")"

          echo "APK_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "APK=$APK"
          echo "APK_SIZE=$SIZE"
          echo "APK_SHA256=$SHA"

      - name: Verify permanent APK signature and frozen FrameGen
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/vitastation-android/app.apk"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f -name apksigner | sort -V | tail -n 1
          )"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK" | tee "$RUNNER_TEMP/vitastation-apksigner.txt"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          report = Path(os.environ["RUNNER_TEMP"]) / "vitastation-apksigner.txt"
          content = report.read_text(
              encoding="utf-8", errors="replace"
          )

          match = re.search(
              r"certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)",
              content,
          )
          if not match:
              raise SystemExit(
                  "::error::apksigner certificate SHA-256 digest not found"
              )

          actual = match.group(1).replace(":", "").lower()
          expected = os.environ[
              "VITASTATION_SIGNING_CERT_SHA256"
          ].lower()

          if actual != expected:
              raise SystemExit(
                  f"::error::Signing certificate mismatch "
                  f"expected={expected} actual={actual}"
              )

          got = subprocess.check_output(
              [
                  "git",
                  "hash-object",
                  "vita3k/renderer/src/vulkan/frame_generation.cpp",
              ],
              text=True,
          ).strip()

          wanted = "1e7cc634f3308566b6ea3d972b73c55086f8f781"
          if got != wanted:
              raise SystemExit(
                  f"::error::FrameGen drift expected={wanted} actual={got}"
              )

          print(
              f"signing certificate verified: {actual}"
          )
          print(
              f"FrameGen frozen hash verified: {got}"
          )
          PY

      - name: Package APK
        shell: bash
        run: |
          set -euo pipefail

          APK="artifacts/vitastation-android/app.apk"
          OUT="artifacts/VitaStation-Fixed-Signed.apk"

          cp "$APK" "$OUT"
          test -s "$OUT"

          SHA="$(sha256sum "$OUT" | awk '{print $1}')"
          SIZE="$(stat -c '%s' "$OUT")"

          echo "packaged=$OUT"
          echo "packaged_size=$SIZE"
          echo "packaged_sha256=$SHA"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VitaStation-Fixed-Signed
          path: artifacts/VitaStation-Fixed-Signed.apk
          if-no-files-found: error
          retention-days: 14
