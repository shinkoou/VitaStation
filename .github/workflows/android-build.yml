# VitaStation Alpha 4 FIX10 TYPELESS HD
# Replays the exact verified FIX9 workflow patch stack, then applies only the
# PCSA00029 dual-layout Typeless delta. Gintama sync and FrameGen are protected.

name: VitaStation Android APK - Alpha 4 FIX10 TYPELESS HD

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build-fix10.yml'

permissions:
  contents: read

concurrency:
  group: vitastation-android-fix10-typeless-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30
  FIX10_APK_NAME: VitaStation-v0.3.0-Alpha4-FIX10-TypelessHD-Uncharted-ProtectedGintama-StableFG-Signed.apk

jobs:
  android-build:
    name: Build VitaStation v0.3.0 Alpha 4 FIX10 TYPELESS HD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Replay exact verified FIX9 protected stack
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          workflow_path = Path('.github/workflows/android-build.yml')
          raw_bytes = workflow_path.read_bytes()
          actual_sha256 = hashlib.sha256(raw_bytes).hexdigest()
          expected_sha256 = '0c469d9a55d0f5cd090f9f8c7658746d8740d59eeb8adab0191ce9914f449334'
          if actual_sha256 != expected_sha256:
              raise SystemExit(
                  f'::error::FIX10 verified FIX9 workflow mismatch expected={expected_sha256} actual={actual_sha256}')
          workflow = raw_bytes.decode('utf-8')

          def embedded_python(step_name: str) -> str:
              marker = f'      - name: {step_name}\n'
              step = workflow.find(marker)
              if step < 0:
                  raise SystemExit(f'::error::FIX10 source step not found: {step_name}')
              begin_marker = "          python3 - <<'PY'\n"
              begin = workflow.find(begin_marker, step)
              if begin < 0:
                  raise SystemExit(f'::error::FIX10 Python block not found: {step_name}')
              # Never cross into the next workflow step if a named block unexpectedly changes.
              next_step = workflow.find('\n      - name:', step + len(marker))
              end = workflow.find('\n          PY', begin + len(begin_marker))
              if end < 0 or (next_step >= 0 and end > next_step):
                  raise SystemExit(f'::error::FIX10 Python terminator invalid: {step_name}')
              begin += len(begin_marker)
              raw = workflow[begin:end]
              lines = raw.splitlines()
              return '\n'.join(line[10:] if line.startswith('          ') else line for line in lines)

          verified_steps = (
              'Apply exact verified FIX7-R2 baseline from green Run 52',
              'Apply FIX7-R3 Fractional-HD and Eden delta',
              'FIX7-R3 regression gates',
              'Apply FIX8 Mega Update',
              'FIX8 Mega regression gates',
              'Apply FIX9 protected renderer touch and accelerate delta',
              'FIX9 protected regression gates',
          )

          for step_name in verified_steps:
              code = embedded_python(step_name)
              compile(code, f'<FIX10 replay: {step_name}>', 'exec')
              exec(code, {'__name__': '__main__'})
              print(f'[VS-FIX10-REPLAY] verified step complete: {step_name}')

          print('[VS-FIX10-REPLAY] exact FIX9 PROTECTED source state reconstructed')
          PY

      - name: Apply FIX10 Uncharted mature Typeless 64-to-32 delta
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, content):
              Path(path).write_text(content, encoding='utf-8')

          def replace_once(content, old, new, label):
              count = content.count(old)
              if count != 1:
                  raise SystemExit(f'::error::FIX10 {label}: expected one anchor, found {count}')
              return content.replace(old, new, 1)

          def git_hash(path):
              return subprocess.check_output(['git', 'hash-object', path], text=True).strip()

          # Gintama's stable synchronization and FrameGen are immutable for this renderer delta.
          protected_before = {
              'gintama_sync': git_hash('vita3k/kernel/src/sync_primitives.cpp'),
              'framegen': git_hash('vita3k/renderer/src/vulkan/frame_generation.cpp'),
          }

          # FIX10 version.
          path = 'android/app/build.gradle'
          content = read(path)
          content = replace_once(content, 'versionCode = 50', 'versionCode = 51', 'versionCode')
          content = replace_once(content, 'versionName = "0.3.0-alpha4-fix9"', 'versionName = "0.3.0-alpha4-fix10"', 'versionName')
          write(path, content)

          # Add an explicit mode. Mode 0 preserves the legacy VitaStation algorithm byte-for-byte
          # for every non-Uncharted consumer. Mode 1 is packed word0/word1 interleave. Mode 2 is
          # the +4-byte phase view where every output texel selects the same 32-bit half.
          path = 'vita3k/renderer/include/renderer/vulkan/surface_cache.h'
          content = read(path)
          content = replace_once(
              content,
              '''    uint32_t ratio;\n    uint32_t start_word;\n};''',
              '''    uint32_t ratio;\n    uint32_t start_word;\n    uint32_t mode; // [VS-UNCHARTED-TYPELESS-MODE10] 0 legacy, 1 interleave, 2 fixed half\n};''',
              'reinterpret push mode')
          write(path, content)

          # Hybrid shader: keep the pre-FIX10 linear global-word path as mode 0, and expose
          # the mature Vita3K-Plus consumer layouts only when the caller explicitly selects them.
          path = 'vita3k/shaders-builtin/vulkan/surface_cast_reinterpret.comp'
          content = read(path)
          content = replace_once(
              content,
              '''    uint ratio;\n    uint start_word;\n} pc;''',
              '''    uint ratio;\n    uint start_word;\n    uint mode; // [VS-UNCHARTED-TYPELESS-MODE10]\n} pc;''',
              'shader push mode')
          old_shader = '''    uint global_word = pc.start_word + dst.y * words_per_row + dst.x;\n    uint source_row = global_word / words_per_row;\n    uint word_in_row = global_word % words_per_row;\n    if (source_row >= pc.scaled_store_h) {\n        imageStore(out_img, ivec2(dst), uvec4(0u));\n        return;\n    }\n\n    uint source_x = word_in_row / pc.ratio;\n    uint lane = word_in_row % pc.ratio;\n    uvec2 raw = texelFetch(store_img, ivec2(source_x, source_row), 0).xy;\n    uint value = lane == 0u ? raw.x : raw.y;\n'''
          new_shader = '''    uint source_row = dst.y;\n    uint source_x = 0u;\n    uint lane = 0u;\n\n    if (pc.mode == 1u) { // [VS-UNCHARTED-TYPELESS-MODE10] packed interleave\n        source_x = dst.x / pc.ratio;\n        lane = dst.x % pc.ratio;\n    } else if (pc.mode == 2u) { // +4-byte phase view: word[half] from every store texel\n        source_x = dst.x;\n        lane = pc.start_word;\n    } else {\n        // Legacy VitaStation behavior for every other title. Do not globalize FIX10.\n        uint global_word = pc.start_word + dst.y * words_per_row + dst.x;\n        source_row = global_word / words_per_row;\n        uint word_in_row = global_word % words_per_row;\n        source_x = word_in_row / pc.ratio;\n        lane = word_in_row % pc.ratio;\n    }\n\n    if (source_row >= pc.scaled_store_h || source_x >= pc.scaled_store_w || lane >= pc.ratio) {\n        imageStore(out_img, ivec2(dst), uvec4(0u));\n        return;\n    }\n\n    uvec2 raw = texelFetch(store_img, ivec2(source_x, source_row), 0).xy;\n    uint value = lane == 0u ? raw.x : raw.y;\n'''
          content = replace_once(content, old_shader, new_shader, 'shader dual-mode body')
          write(path, content)

          # Select the mature layout using facts observed in the real PCSA00029 FIX9 log:
          #  raw +0 : output width is 2x stored width -> packed/interleaved words.
          #  raw +4 : output width equals stored width -> a separate phase view of word1.
          # Anything that does not exactly match these shapes falls back to legacy mode 0.
          path = 'vita3k/renderer/src/vulkan/surface_cache.cpp'
          content = read(path)
          half_anchor = '''                const uint32_t half_index =\n                    sub_texel_byte / bytes_per_pixel_requested;\n'''
          half_new = half_anchor + '''\n                uint32_t typeless_mode = 0u;\n                if (state.app_title_id == "PCSA00029") { // [VS-UNCHARTED-TYPELESS-MODE10]\n                    const bool packed_interleave =\n                        native_byte_offset == 0u\n                        && width == info.texture.width * ratio;\n                    const bool phase_half_view =\n                        native_byte_offset == 4u\n                        && width == info.texture.width\n                        && half_index == 1u;\n                    if (packed_interleave)\n                        typeless_mode = 1u;\n                    else if (phase_half_view)\n                        typeless_mode = 2u;\n                }\n'''
          content = replace_once(content, half_anchor, half_new, 'Uncharted mode selection')
          content = replace_once(
              content,
              '''                    .ratio = ratio,\n                    .start_word = half_index\n                };''',
              '''                    .ratio = ratio,\n                    .start_word = half_index,\n                    .mode = typeless_mode\n                };''',
              'push mode value')
          content = replace_once(
              content,
              '''"[VS-TYPELESS-HD] raw_offset={} start_word={} ratio={} size={}x{} scale={} staging=1",\n                        native_byte_offset,\n                        half_index,\n                        ratio,\n                        width,\n                        height,\n                        state.res_multiplier);''',
              '''"[VS-TYPELESS-HD] raw_offset={} start_word={} ratio={} mode={} size={}x{} scale={} staging=1",\n                        native_byte_offset,\n                        half_index,\n                        ratio,\n                        typeless_mode,\n                        width,\n                        height,\n                        state.res_multiplier);''',
              'Typeless mode diagnostic')
          write(path, content)

          # Hard protection: this FIX10 step must not touch the proven Gintama sync or FrameGen.
          if git_hash('vita3k/kernel/src/sync_primitives.cpp') != protected_before['gintama_sync']:
              raise SystemExit('::error::FIX10 touched Gintama kernel sync baseline')
          if git_hash('vita3k/renderer/src/vulkan/frame_generation.cpp') != protected_before['framegen']:
              raise SystemExit('::error::FIX10 touched frozen FrameGen')

          print('[VS-FIX10] Uncharted dual-layout Typeless delta applied')
          print('[VS-FIX10] mode=1 packed interleave; mode=2 +4 fixed-half; non-PCSA00029 remains legacy')
          PY

      - name: FIX10 protected regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def data(path):
              return Path(path).read_text(encoding='utf-8')

          def require(path, *markers):
              content = data(path)
              for marker in markers:
                  if marker not in content:
                      raise SystemExit(f'::error::FIX10 gate missing in {path}: {marker}')

          require('android/app/build.gradle', 'versionCode = 51', 'versionName = "0.3.0-alpha4-fix10"')
          require('vita3k/renderer/include/renderer/vulkan/surface_cache.h', '[VS-UNCHARTED-TYPELESS-CACHE9]', '[VS-UNCHARTED-TYPELESS-MODE10]', 'uint32_t mode;')
          require('vita3k/shaders-builtin/vulkan/surface_cast_reinterpret.comp', '[VS-UNCHARTED-TYPELESS-MODE10]', 'pc.mode == 1u', 'pc.mode == 2u', 'Legacy VitaStation behavior')
          require('vita3k/renderer/src/vulkan/surface_cache.cpp', '[VS-UNCHARTED-TYPELESS-ORIGIN9]', '[VS-UNCHARTED-TYPELESS-CACHE9]', '[VS-UNCHARTED-TYPELESS-MODE10]', 'state.app_title_id == "PCSA00029"', 'packed_interleave', 'phase_half_view', '.mode = typeless_mode')
          require('vita3k/kernel/src/sync_primitives.cpp', '[VS-KERNEL-WAIT-DOMAIN7]', '[VS-KERNEL-OWNERSHIP-WAIT]', '[VS-LWMUTEX-WORKAREA]')

          framegen = subprocess.check_output(['git','hash-object','vita3k/renderer/src/vulkan/frame_generation.cpp'], text=True).strip()
          wanted = '1e7cc634f3308566b6ea3d972b73c55086f8f781'
          if framegen != wanted:
              raise SystemExit(f'::error::FIX10 FrameGen drift expected={wanted} actual={framegen}')

          # Bootstrap is permanently forbidden from the active build route.
          workflow = data('.github/workflows/android-build.yml')
          forbidden_bootstrap = 'vitastation-' + 'bootstrap.yml'
          if forbidden_bootstrap in workflow:
              raise SystemExit('::error::FIX10 forbidden Bootstrap workflow reference found in active workflow')

          print('[VS-FIX10] protected regression gates passed')
          print('[VS-FIX10] Gintama sync + FrameGen preserved; Uncharted dual-mode path remains PCSA00029-only')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and JVM preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac \
            --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done
          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"
          keytool -list -v -keystore "$SIGNING_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/vitastation-keytool.txt"
          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed VitaStation FIX10 APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify permanent APK signature and frozen FrameGen
        shell: bash
        run: |
          set -euo pipefail
          APK='artifacts/vitastation-android/app.apk'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/vitastation-apksigner.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess
          report = Path(os.environ['RUNNER_TEMP']) / 'vitastation-apksigner.txt'
          content = report.read_text(encoding='utf-8', errors='replace')
          match = re.search(r'certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)', content)
          if not match:
              raise SystemExit('::error::apksigner certificate SHA-256 digest not found')
          actual = match.group(1).replace(':', '').lower()
          expected = os.environ['VITASTATION_SIGNING_CERT_SHA256'].lower()
          if actual != expected:
              raise SystemExit(f'::error::Signing certificate mismatch expected={expected} actual={actual}')
          got = subprocess.check_output(['git', 'hash-object', 'vita3k/renderer/src/vulkan/frame_generation.cpp'], text=True).strip()
          wanted = '1e7cc634f3308566b6ea3d972b73c55086f8f781'
          if got != wanted:
              raise SystemExit(f'::error::FrameGen drift expected={wanted} actual={got}')
          print(f'[VS-FIX10] permanent signing certificate verified: {actual}')
          print('[VS-FIX10] FrameGen remained byte-identical')
          PY

      - name: Rename and hash FIX10 APK
        shell: bash
        run: |
          set -euo pipefail
          SRC='artifacts/vitastation-android/app.apk'
          DST="artifacts/vitastation-android/$FIX10_APK_NAME"
          test -s "$SRC"
          mv "$SRC" "$DST"
          sha256sum "$DST" | tee "artifacts/vitastation-android/$FIX10_APK_NAME.sha256"
          ls -lh "$DST"

      - name: Upload VitaStation FIX10 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.3.0-Alpha4-FIX10-TypelessHD-Android-Signed
          path: |
            artifacts/vitastation-android/${{ env.FIX10_APK_NAME }}
            artifacts/vitastation-android/${{ env.FIX10_APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
