name: VitaStation Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'vita3k/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

env:
  VCPKG_ROOT: /usr/local/share/vcpkg

jobs:
  android-build:
    name: Build VitaStation Phase02D FIX1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Fix Phase02D MainActivity diagnostic string
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/java/org/vita3k/emulator/MainActivity.kt")
          text = path.read_text(encoding="utf-8")

          broken = 'sdk=${Build.VERSION.SDK_INT}\n"'
          fixed = 'sdk=${Build.VERSION.SDK_INT}\\n"'

          if broken in text:
              text = text.replace(broken, fixed, 1)
              path.write_text(text, encoding="utf-8")
              print("OK: repaired diagnostic newline string.")
          elif fixed in text:
              print("OK: diagnostic string already fixed.")
          else:
              raise SystemExit("Could not find the expected Phase02D diagnostic string.")

          final = path.read_text(encoding="utf-8")
          if broken in final:
              raise SystemExit("Validation failed: raw newline still inside Kotlin string.")
          if fixed not in final:
              raise SystemExit("Validation failed: escaped newline was not written.")
          PY
          git diff --check

      - name: Persist Phase02D FIX1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/src/main/java/org/vita3k/emulator/MainActivity.kt
          if git diff --cached --quiet; then
            echo "Phase02D FIX1 already applied."
          else
            git commit -m "VitaStation v0.2.3 Phase02D FIX1: fix session diagnostics string"
            git push origin HEAD:main
          fi

      - name: Restore stable VitaStation dev signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: vitastation-dev-debug-keystore-v1

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: vitastation-android-native-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            vitastation-android-native-

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        run: bash ./.ci/setup-android.sh

      - name: Kotlin compile preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew :app:compileReldebugKotlin --stacktrace

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Build VitaStation Phase02D FIX1 APK
        run: bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/vitastation-android/app.apk
          mv artifacts/vitastation-android/app.apk \
            artifacts/vitastation-android/VitaStation-v0.2.3-Phase02D-FIX1.apk
          ls -lh artifacts/vitastation-android/

      - name: Upload VitaStation Phase02D FIX1 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.2.3-Phase02D-FIX1-Android
          path: artifacts/vitastation-android/VitaStation-v0.2.3-Phase02D-FIX1.apk
          if-no-files-found: error
