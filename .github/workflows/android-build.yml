name: VitaStation Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30

jobs:
  android-build:
    name: Build VitaStation v0.3.0 Alpha 3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply v0.3.0 Alpha 3 Mega Update
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/vs-alpha3.py
          python3 /tmp/vs-alpha3.py

          git diff --check
          grep -q 'versionName = "0.3.0-alpha3"' android/app/build.gradle
          grep -q 'versionCode = 39' android/app/build.gradle
          grep -q 'pending_write_regions' vita3k/renderer/include/renderer/vulkan/surface_cache.h
          grep -q '\[VS-SURFACE-REGION\]' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q '\[VS-GPU-METRIC\]' android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java
          grep -q '\[VS-EXIT-ANDROID\]' android/app/src/main/java/org/vita3k/emulator/Emulator.java

          if grep -R -q 'VS-TYPELESS-NATIVE\|native_store_texture\|native_cast_texture'               vita3k/renderer/include/renderer/vulkan/surface_cache.h               vita3k/renderer/src/vulkan/surface_cache.cpp; then
            echo "::error::Alpha 2 Native Typeless regression path is still present."
            exit 1
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and Kotlin preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew             :app:mergeReleaseResources             :app:compileReleaseKotlin             --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done

          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"

          keytool -list -v             -keystore "$SIGNING_FILE"             -storepass "$STORE_PASSWORD"             -alias "$KEY_ALIAS" > "$RUNNER_TEMP/vitastation-key-info.txt"

          actual_fingerprint="$(
            grep -m1 'SHA256:' "$RUNNER_TEMP/vitastation-key-info.txt"               | sed 's/.*SHA256: //'               | tr -d ':'               | tr '[:upper:]' '[:lower:]'
          )"

          test "$actual_fingerprint" = "$VITASTATION_SIGNING_CERT_SHA256"

          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build VitaStation v0.3.0 Alpha 3 signed APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify permanent APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/vitastation-android/app.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"             | tee "$RUNNER_TEMP/vitastation-apksigner.txt"

          actual="$(
            grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/vitastation-apksigner.txt"               | sed 's/.*digest: //'               | tr -d ':'               | tr '[:upper:]' '[:lower:]'
          )"

          test "$actual" = "$VITASTATION_SIGNING_CERT_SHA256"

      - name: Persist Alpha 3 source only after green signed build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"

          git add             android/app/build.gradle             android/app/src/main/java/org/vita3k/emulator/Emulator.java             android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java             vita3k/renderer/include/renderer/vulkan/surface_cache.h             vita3k/renderer/src/vulkan/surface_cache.cpp             vita3k/renderer/src/vulkan/scene.cpp

          if git diff --cached --quiet; then
            echo "Alpha 3 source already persisted."
          else
            git commit -m "VitaStation v0.3.0 Alpha 3: renderer recovery + region deps + GPU telemetry + exit controller [skip ci]"
            git push origin HEAD:main
          fi

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="artifacts/vitastation-android/app.apk"
          DST="artifacts/vitastation-android/VitaStation-v0.3.0-Alpha3-RendererRecovery-RegionDeps-GPU-Exit-FG21-Signed.apk"
          test -f "$SRC"
          mv "$SRC" "$DST"
          ls -lh "$DST"

      - name: Upload VitaStation v0.3.0 Alpha 3 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.3.0-Alpha3-RendererRecovery-RegionDeps-GPU-Exit-FG21-Signed-Android
          path: artifacts/vitastation-android/VitaStation-v0.3.0-Alpha3-RendererRecovery-RegionDeps-GPU-Exit-FG21-Signed.apk
          if-no-files-found: error
