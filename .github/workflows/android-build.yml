name: VitaStation Android APK - Alpha 4 FIX3 Stage A

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30

jobs:
  android-build:
    name: Build VitaStation v0.3.0 Alpha 4 FIX3 Stage A
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply FIX3 Stage A - stable FrameGen, GPU HUD and Touch UI
        shell: bash
        run: |
          set -euo pipefail

          STABLE_FG_COMMIT="1198f481ed25c932d269ad97525d2217c511bd9a"
          FG_PATH="vita3k/renderer/src/vulkan/frame_generation.cpp"

          git cat-file -e "${STABLE_FG_COMMIT}^{commit}"
          git show "${STABLE_FG_COMMIT}:${FG_PATH}" > "${FG_PATH}"

          python3 - <<'PY'
          from pathlib import Path
          import re

          gradle = Path('android/app/build.gradle')
          text = gradle.read_text(encoding='utf-8')
          text, n1 = re.subn(r'versionCode = \d+', 'versionCode = 42', text, count=1)
          text, n2 = re.subn(r'versionName = "[^"]+"', 'versionName = "0.3.0-alpha4-fix3a"', text, count=1)
          if n1 != 1 or n2 != 1:
              raise SystemExit('::error::Could not update FIX3 Stage A version metadata')
          gradle.write_text(text, encoding='utf-8')

          hud = Path('android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java')
          text = hud.read_text(encoding='utf-8')
          pattern = re.compile(r'    private Float readGpuUsage\(\) \{.*?\n    \}\n\n    private void logGpuMetric', re.S)
          replacement = r'''    private Float readGpuUsage() {
              Float zeroCandidate = null;
              String zeroSource = null;

              // VitaStation FIX3: query Qualcomm KGSL gpubusy first.
              try {
                  final String source = "/sys/class/kgsl/kgsl-3d0/gpubusy";
                  String text = readText(source);
                  if (text != null) {
                      String[] parts = text.trim().split("\\s+");
                      if (parts.length >= 2) {
                          float busy = Float.parseFloat(parts[0]);
                          float total = Float.parseFloat(parts[1]);
                          if (total > 0f) {
                              float value = clamp((busy / total) * 100f);
                              if (value > 0.1f) {
                                  logGpuMetric(source, "OK", value);
                                  return value;
                              }
                              zeroCandidate = value;
                              zeroSource = source;
                          }
                      }
                  }
              } catch (Throwable ignored) {
              }

              for (String path : new String[]{
                      "/sys/class/kgsl/kgsl-3d0/gpu_busy_percentage",
                      "/sys/class/kgsl/kgsl-3d0/devfreq/gpu_load",
                      "/sys/class/kgsl/kgsl-3d0/devfreq/load",
                      "/sys/class/kgsl/kgsl-3d0/devfreq/utilization",
                      "/sys/class/kgsl/kgsl-3d0/devfreq/busy_percent"}) {
                  Float value = readSinglePercent(path);
                  if (value != null) {
                      if (value > 0.1f) {
                          logGpuMetric(path, "OK", value);
                          return value;
                      }
                      if (zeroCandidate == null) {
                          zeroCandidate = value;
                          zeroSource = path;
                      }
                  }
              }

              try {
                  File devfreq = new File("/sys/class/devfreq");
                  File[] devices = devfreq.listFiles();
                  if (devices != null) {
                      for (File device : devices) {
                          String descriptor = device.getName().toLowerCase(Locale.ROOT);
                          try {
                              descriptor += " " + device.getCanonicalPath().toLowerCase(Locale.ROOT);
                          } catch (Throwable ignored) {
                          }

                          if (!descriptor.contains("gpu")
                                  && !descriptor.contains("mali")
                                  && !descriptor.contains("kgsl")
                                  && !descriptor.contains("3d0")) {
                              continue;
                          }

                          for (String leaf : new String[]{"load", "utilization", "busy_percent", "gpu_load"}) {
                              String path = new File(device, leaf).getAbsolutePath();
                              Float value = readSinglePercent(path);
                              if (value != null) {
                                  if (value > 0.1f) {
                                      logGpuMetric(path, "OK", value);
                                      return value;
                                  }
                                  if (zeroCandidate == null) {
                                      zeroCandidate = value;
                                      zeroSource = path;
                                  }
                              }
                          }
                      }
                  }
              } catch (Throwable ignored) {
              }

              if (zeroCandidate != null) {
                  logGpuMetric(zeroSource == null ? "zero-candidate" : zeroSource, "ZERO", zeroCandidate);
                  return zeroCandidate;
              }

              logGpuMetric("none", "UNAVAILABLE", null);
              return null;
          }

          private void logGpuMetric'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('::error::Could not patch PerformanceHudView.readGpuUsage')
          hud.write_text(text, encoding='utf-8')

          overlay = Path('android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java')
          text = overlay.read_text(encoding='utf-8')
          text = text.replace('VitaStation Touch UI 2.1: smaller art, generous hitboxes and a neon',
                              'VitaStation Touch UI 3.0 Stage A: compact electric-blue art, generous hitboxes and a')
          text = text.replace('private final static float OVERLAY_ACTIVE_ALPHA = 0.72f;',
                              'private final static float OVERLAY_ACTIVE_ALPHA = 0.64f; // [VS-TOUCH-UI3]')
          text = text.replace('private final static float OVERLAY_IDLE_ALPHA = 0.24f;',
                              'private final static float OVERLAY_IDLE_ALPHA = 0.18f;')
          text = text.replace('private final static int OVERLAY_HIT_SLOP_DP = 16;',
                              'private final static int OVERLAY_HIT_SLOP_DP = 20;')
          text = text.replace('private final static int VITASTATION_CYAN = Color.rgb(61, 220, 255);',
                              'private final static int VITASTATION_CYAN = Color.rgb(41, 182, 255);')

          tint_pattern = re.compile(r'  private static int tintForControl\(int legacyId\)\n  \{.*?\n  \}\n\n  private static Bitmap tintBitmap', re.S)
          tint_replacement = '''  private static int tintForControl(int legacyId)
          {
            // Touch UI 3.0 Stage A uses one electric-blue accent.
            return VITASTATION_CYAN;
          }

          private static Bitmap tintBitmap'''
          text, tint_count = tint_pattern.subn(tint_replacement, text, count=1)
          if tint_count != 1:
              raise SystemExit('::error::Could not patch Touch UI tint policy')

          text = text.replace('float scale = 0.13f;', 'float scale = 0.115f;', 1)
          text = text.replace('scale = 0.20f;', 'scale = 0.17f;', 1)
          text = text.replace('scale = 0.09f;', 'scale = 0.075f;', 1)
          text = text.replace('float scale = 0.29f;', 'float scale = 0.245f;', 1)
          text = text.replace('float scale = 0.235f;', 'float scale = 0.205f;', 1)
          overlay.write_text(text, encoding='utf-8')
          PY

          git diff --check

          grep -q 'versionCode = 42' android/app/build.gradle
          grep -q 'versionName = "0.3.0-alpha4-fix3a"' android/app/build.gradle
          grep -q '#include <lsfg_3_1p.hpp>' vita3k/renderer/src/vulkan/frame_generation.cpp
          grep -q 'kWarmupFrames = 60' vita3k/renderer/src/vulkan/frame_generation.cpp
          ! grep -q '\[VS-FG-TRANSITION\]' vita3k/renderer/src/vulkan/frame_generation.cpp
          ! grep -q '\[VS-FG-FPS-GATE\]' vita3k/renderer/src/vulkan/frame_generation.cpp
          grep -q '\[VS-KERNEL-SYNC-FIX\]' vita3k/kernel/src/sync_primitives.cpp
          grep -q 'condvar->uid = uid' vita3k/kernel/src/sync_primitives.cpp
          grep -q 'kEnableHdTypelessExperimental = false' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q '\[VS-TOUCH-UI3\]' android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java
          grep -q 'source = "/sys/class/kgsl/kgsl-3d0/gpubusy"' android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and JVM preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac \
            --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done

          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"

          keytool -list -v \
            -keystore "$SIGNING_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            > "$RUNNER_TEMP/vitastation-key-info.txt"

          actual_fingerprint="$(
            grep -m1 'SHA256:' "$RUNNER_TEMP/vitastation-key-info.txt" \
              | sed 's/.*SHA256: //' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          test "$actual_fingerprint" = "$VITASTATION_SIGNING_CERT_SHA256"

          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed VitaStation FIX3 Stage A APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify permanent APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/vitastation-android/app.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" \
            | tee "$RUNNER_TEMP/vitastation-apksigner.txt"

          actual="$(
            grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/vitastation-apksigner.txt" \
              | sed 's/.*digest: //' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          test "$actual" = "$VITASTATION_SIGNING_CERT_SHA256"

      - name: Persist FIX3 Stage A source only after green signed build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            android/app/build.gradle \
            android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java \
            android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java \
            vita3k/renderer/src/vulkan/frame_generation.cpp

          if git diff --cached --quiet; then
            echo "FIX3 Stage A source already persisted."
          else
            git commit -m "VitaStation v0.3.0 Alpha4 FIX3 Stage A: stable FrameGen baseline [skip ci]"
            git push origin HEAD:main
          fi

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="artifacts/vitastation-android/app.apk"
          DST="artifacts/vitastation-android/VitaStation-v0.3.0-Alpha4-FIX3A-StableFrameGen-GPUHUD-TouchUI3-Signed.apk"
          test -f "$SRC"
          mv "$SRC" "$DST"
          ls -lh "$DST"

      - name: Upload VitaStation FIX3 Stage A APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.3.0-Alpha4-FIX3A-StableFrameGen-GPUHUD-TouchUI3-Signed-Android
          path: artifacts/vitastation-android/VitaStation-v0.3.0-Alpha4-FIX3A-StableFrameGen-GPUHUD-TouchUI3-Signed.apk
          if-no-files-found: error
