name: VitaStation Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30

jobs:
  android-build:
    name: Build VitaStation v0.3.0 Alpha 4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply v0.3.0 Alpha 4 Correctness + Compatibility Surge
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/vs-alpha4.py
          python3 -m py_compile /tmp/vs-alpha4.py
          python3 /tmp/vs-alpha4.py

          git diff --check
          grep -q 'versionCode = 40' android/app/build.gradle
          grep -q 'versionName = "0.3.0-alpha4"' android/app/build.gradle
          grep -q '\[VS-TYPELESS-HD\]' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q 'is_same_image || unresolved_scene_write' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q 'ImageLayout::StorageImage' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q '\[VS-FG-STATIC\]' vita3k/renderer/src/vulkan/frame_generation.cpp
          grep -q '\[VS-FG-RESET\]' vita3k/renderer/src/vulkan/frame_generation.cpp
          grep -q '\[VS-FG-REPRIME\]' vita3k/renderer/src/vulkan/frame_generation.cpp
          grep -q '\[VS-EXIT-NATIVE\]' vita3k/app/src/app_init.cpp
          grep -q '\[VS-KERNEL-SYNC\]' vita3k/modules/SceKernelThreadMgr/SceThreadmgr.cpp
          grep -q 'OVERLAY_TIME_BEFORE_DIM_MS' android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java
          grep -q 'Alignment.BottomCenter' android/app/src/main/java/org/vita3k/emulator/ui/components/OverlayEditorPalette.kt

          test "$(stat -c %s vita3k/renderer/shaders-builtin/vulkan/surface_cast_reinterpret.comp.spv)" = "2928"
          echo 'b71ef6e93523e45fe337e25c4b59237421f9f59b3c0418a0851b962bfcc32e02  vita3k/renderer/shaders-builtin/vulkan/surface_cast_reinterpret.comp.spv' | sha256sum -c -

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and Kotlin preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew             :app:mergeReleaseResources             :app:compileReleaseKotlin             --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done

          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"

          keytool -list -v             -keystore "$SIGNING_FILE"             -storepass "$STORE_PASSWORD"             -alias "$KEY_ALIAS"             > "$RUNNER_TEMP/vitastation-key-info.txt"

          actual_fingerprint="$(
            grep -m1 'SHA256:' "$RUNNER_TEMP/vitastation-key-info.txt"               | sed 's/.*SHA256: //'               | tr -d ':'               | tr '[:upper:]' '[:lower:]'
          )"

          if [ "$actual_fingerprint" != "$VITASTATION_SIGNING_CERT_SHA256" ]; then
            echo "::error::Permanent signing certificate fingerprint mismatch."
            exit 1
          fi

          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build VitaStation v0.3.0 Alpha 4 signed APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify permanent APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/vitastation-android/app.apk"
          test -f "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"

          "$APKSIGNER" verify --verbose --print-certs "$APK"             | tee "$RUNNER_TEMP/vitastation-apksigner.txt"

          actual="$(
            grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/vitastation-apksigner.txt"               | sed 's/.*digest: //'               | tr -d ':'               | tr '[:upper:]' '[:lower:]'
          )"

          if [ "$actual" != "$VITASTATION_SIGNING_CERT_SHA256" ]; then
            echo "::error::APK permanent signature mismatch."
            exit 1
          fi

      - name: Persist Alpha 4 source only after green signed build
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"

          git add             android/app/build.gradle             android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java             android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableJoystick.java             android/app/src/main/java/org/vita3k/emulator/ui/components/OverlayEditorPalette.kt             vita3k/app/src/app_init.cpp             vita3k/modules/SceKernelThreadMgr/SceThreadmgr.cpp             vita3k/renderer/include/renderer/vulkan/surface_cache.h             vita3k/renderer/src/vulkan/surface_cache.cpp             vita3k/renderer/src/vulkan/frame_generation.cpp             vita3k/renderer/shaders-builtin/vulkan/surface_cast_reinterpret.comp             vita3k/renderer/shaders-builtin/vulkan/surface_cast_reinterpret.comp.spv

          if git diff --cached --quiet; then
            echo "Alpha 4 source already persisted."
          else
            git commit -m "VitaStation v0.3.0 Alpha 4: correctness compatibility surge [skip ci]"
            git push origin HEAD:main
          fi

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="artifacts/vitastation-android/app.apk"
          DST="artifacts/vitastation-android/VitaStation-v0.3.0-Alpha4-Correctness-Surge-HDTypeless-FG22-TouchUI2-Signed.apk"
          test -f "$SRC"
          mv "$SRC" "$DST"
          ls -lh "$DST"

      - name: Upload VitaStation v0.3.0 Alpha 4 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.3.0-Alpha4-Correctness-Surge-HDTypeless-FG22-TouchUI2-Signed-Android
          path: artifacts/vitastation-android/VitaStation-v0.3.0-Alpha4-Correctness-Surge-HDTypeless-FG22-TouchUI2-Signed.apk
          if-no-files-found: error
