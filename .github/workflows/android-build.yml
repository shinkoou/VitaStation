name: VitaStation Android APK - Alpha 4 FIX4

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build-fix4.yml'

permissions:
  contents: write

concurrency:
  group: vitastation-android-fix4-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30

jobs:
  android-build:
    name: Build VitaStation v0.3.0 Alpha 4 FIX4
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Guard healthy FIX3B1 source baseline
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            ["vita3k/renderer/src/vulkan/frame_generation.cpp"]="1e7cc634f3308566b6ea3d972b73c55086f8f781"
            ["vita3k/kernel/src/sync_primitives.cpp"]="e5728d3438991a9e75163facb7cb59bb8cd736b5"
            ["vita3k/renderer/src/vulkan/surface_cache.cpp"]="af699b6ac184e7c9a88a96720cef10285bf6e22b"
            ["vita3k/renderer/include/renderer/vulkan/surface_cache.h"]="c5b608e0e7b733b971bb11228e2c93b96979c666"
            ["android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java"]="46d705d4c6882528f7ac9aa4a8c06f2c2a3634af"
            ["android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableButton.java"]="96a6f642d6a1b73f4b7e9a7f54430c59343fe922"
            ["android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableDpad.java"]="39fa7673f7fc9647cb51078d1493b2cf2e181feb"
            ["android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableJoystick.java"]="6d17b256b88684e9612e2ab789c9aabb387c83a1"
            ["android/app/src/main/res/values/integers.xml"]="a4098388fd1a3a60f5322c6c85e392bdc7faee16"
          )
          for path in "${!expected[@]}"; do
            actual="$(git hash-object "$path")"
            if [ "$actual" != "${expected[$path]}" ]; then
              echo "::error::Baseline drift at $path expected=${expected[$path]} actual=$actual"
              exit 1
            fi
          done
          echo "[VS-FIX4] healthy source baseline verified"

