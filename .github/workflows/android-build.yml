name: VitaStation Android APK - Alpha 4 FIX5 R2

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

concurrency:
  group: vitastation-android-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30
  FIX5_TOUCH_ZIP_SHA256: 260593a80e13773ebd838d1d84d3a1c0328e90a0afd49a8673b5cd6a43b16d9d

jobs:
  android-build:
    name: Build VitaStation v0.3.0 Alpha 4 FIX5 R2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Guard FIX4 R2 main baseline and freeze FrameGen
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected=(
            ["android/app/build.gradle"]="9fb4f7671a361cf1da47615c1d49e3f095e05554"
            ["vita3k/kernel/include/kernel/sync_primitives.h"]="374667a5669084119db676b58ad61bd33699280f"
            ["vita3k/kernel/src/sync_primitives.cpp"]="15306a51313a8e29404dda26dcd37fb20674d5ad"
            ["vita3k/modules/SceLibKernel/SceLibKernel.cpp"]="cceae26752fae55193d50f4f407e26af083081b9"
            ["vita3k/modules/SceKernelThreadMgr/SceThreadmgr.cpp"]="1cd88212ec6a94685faed7122c0dc0bc3783c3af"
            ["vita3k/renderer/src/vulkan/surface_cache.cpp"]="5052ce61aa0d5c0aaf47702fd602920477f1a117"
            ["vita3k/renderer/include/renderer/vulkan/surface_cache.h"]="c30ac772a497c59f93a9b5d27c3de1edeb20f451"
            ["vita3k/renderer/src/vulkan/context.cpp"]="1d4cfe111377f9b55428b4190dbb4ea33df978c2"
            ["vita3k/renderer/src/vulkan/scene.cpp"]="c841e9adda4640aeddd884a145774db073046981"
            ["vita3k/renderer/src/vulkan/frame_generation.cpp"]="1e7cc634f3308566b6ea3d972b73c55086f8f781"
            ["android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java"]="7600155dd62a8b074bd8d1dbe68d2811171eaa16"
            ["android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java"]="fbc345e9d952ddf121191aae278bb5725d3ceb0b"
            ["android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableButton.java"]="78558a3a4a88eb57bfe3e455afc802ded6b09580"
            ["android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableDpad.java"]="1a33847c7b155ac9158358f1eb151b7ff954e61f"
            ["android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableJoystick.java"]="320923e3cd7843644bc35feef76b8ae4cd30feca"
          )
          for path in "${!expected[@]}"; do
            actual="$(git hash-object "$path")"
            if [ "$actual" != "${expected[$path]}" ]; then
              echo "::error::FIX5 baseline drift at $path expected=${expected[$path]} actual=$actual"
              exit 1
            fi
          done
          historical_hud="$(git show 1198f481ed25c932d269ad97525d2217c511bd9a:android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java | git hash-object --stdin)"
          test "$historical_hud" = "6bcb7746a8c5158eff704ea89753e8ac7cca00e7"
          echo "[VS-FIX5] FIX4 R2 source baseline + historical GPU reader verified"
          echo "[VS-FIX5] FrameGen frozen at 1e7cc634f3308566b6ea3d972b73c55086f8f781"

      - name: Inventory every mutex unlock callsite before patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path("vita3k")
          specs = {
              "mutex_unlock": (re.compile(r"\bmutex_unlock\s*\("), 5),
              "mutex_unlock_impl": (re.compile(r"\bmutex_unlock_impl\s*\("), 3),
          }

          for symbol, (pattern, expected) in specs.items():
              sites = []
              for path in root.rglob("*"):
                  if path.suffix not in {".cpp", ".h", ".hpp"}:
                      continue
                  try:
                      lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
                  except OSError:
                      continue
                  for line_no, line in enumerate(lines, 1):
                      if pattern.search(line):
                          sites.append(f"{path}:{line_no}:{line.strip()}")

              print(f"[VS-FIX5] {symbol}: {len(sites)} occurrence(s)")
              for site in sites:
                  print(site)

              if len(sites) != expected:
                  print(
                      f"::error::Expected exactly {expected} {symbol} occurrences on FIX4 R2, got {len(sites)}",
                      file=sys.stderr,
                  )
                  sys.exit(1)

          print("[VS-FIX5] all mutex unlock callsites inventoried")
          PY

