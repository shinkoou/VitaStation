name: VitaStation Gintama Turnip GMEM vs SYSMEM Probe22

"on":
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/gintama-driver-compare.yml

permissions:
  contents: read

concurrency:
  group: vitastation-gintama-driver-compare-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30

jobs:
  build-probe:
    name: Turnip TU_DEBUG=${{ matrix.turnip_mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        turnip_mode:
          - sysmem
          - gmem
    env:
      TURNIP_MODE: ${{ matrix.turnip_mode }}
      PROBE_APK_NAME: VitaStation-v0.3.0-Alpha4-PROBE22-Turnip-${{ matrix.turnip_mode }}-Signed.apk

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Reconstruct exact FIX21 runtime source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re
          import subprocess

          workflow_path = Path('.github/workflows/android-build.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          start_marker = '      - name: Apply exact verified FIX7-R2 baseline from green Run 52\n'
          end_marker = '      - name: Set up Java 17\n'
          start = workflow.find(start_marker)
          end = workflow.find(end_marker, start)
          if start < 0 or end < 0 or end <= start:
              raise SystemExit('::error::PROBE22 could not locate FIX21 patch-stack boundaries')

          section = workflow[start:end]
          step_matches = list(re.finditer(r'(?m)^      - name: (.+)$', section))
          if not step_matches:
              raise SystemExit('::error::PROBE22 found no inherited FIX21 steps')

          github_env_path = Path(os.environ['GITHUB_ENV'])

          def refresh_env(base_env):
              if not github_env_path.exists():
                  return base_env
              lines = github_env_path.read_text(encoding='utf-8', errors='replace').splitlines()
              parsed = {}
              i = 0
              while i < len(lines):
                  line = lines[i]
                  if '<<' in line and '=' not in line.split('<<', 1)[0]:
                      key, delimiter = line.split('<<', 1)
                      key = key.strip()
                      delimiter = delimiter.strip()
                      i += 1
                      values = []
                      while i < len(lines) and lines[i] != delimiter:
                          values.append(lines[i])
                          i += 1
                      parsed[key] = '\n'.join(values)
                  elif '=' in line:
                      key, value = line.split('=', 1)
                      if key:
                          parsed[key] = value
                  i += 1
              base_env.update(parsed)
              return base_env

          env = dict(os.environ)
          ran = 0
          for idx, match in enumerate(step_matches):
              block_start = match.start()
              block_end = step_matches[idx + 1].start() if idx + 1 < len(step_matches) else len(section)
              block = section[block_start:block_end]
              name = match.group(1).strip()

              literal = re.search(r'(?m)^        run:\s*\|\s*$', block)
              if literal:
                  raw = block[literal.end():]
                  script_lines = []
                  for line in raw.splitlines():
                      if line.startswith('          '):
                          script_lines.append(line[10:])
                      elif not line.strip():
                          script_lines.append('')
                      else:
                          break
                  script = '\n'.join(script_lines).rstrip() + '\n'
              else:
                  single = re.search(r'(?m)^        run:\s+(.+)$', block)
                  if not single:
                      continue
                  script = single.group(1).strip() + '\n'

              print(f'\n[PROBE22] >>> inherited FIX21 step: {name}', flush=True)
              env = refresh_env(env)
              subprocess.run(
                  ['bash', '-c', script],
                  cwd='.',
                  env=env,
                  check=True,
              )
              env = refresh_env(env)
              ran += 1

          if ran < 10:
              raise SystemExit(f'::error::PROBE22 inherited suspiciously few FIX21 steps: {ran}')

          gradle = Path('android/app/build.gradle').read_text(encoding='utf-8')
          if 'versionCode = 66' not in gradle or '0.3.0-alpha4-fix21-lord-skin-diag-gintama-feedback-cap' not in gradle:
              raise SystemExit('::error::PROBE22 FIX21 reconstruction did not reach expected version')

          print(f'[PROBE22] exact FIX21 runtime patch stack reconstructed; inherited run steps={ran}')
          PY

      - name: Apply Turnip render-mode probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          mode = os.environ['TURNIP_MODE'].strip().lower()
          if mode not in {'sysmem', 'gmem'}:
              raise SystemExit(f'::error::PROBE22 invalid TURNIP_MODE={mode!r}')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'::error::PROBE22 {label}: expected one anchor, found {count}')
              return text.replace(old, new, 1)

          # Distinguish this probe from FIX21 without touching package identity/signing.
          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text, 'versionCode = 66', 'versionCode = 67', 'versionCode')
          text = replace_once(
              text,
              'versionName = "0.3.0-alpha4-fix21-lord-skin-diag-gintama-feedback-cap"',
              f'versionName = "0.3.0-alpha4-probe22-turnip-{mode}"',
              'versionName',
          )
          path.write_text(text, encoding='utf-8')

          # TU_DEBUG is consumed by Mesa Turnip. Qualcomm's proprietary Vulkan
          # implementation ignores this variable, so the proprietary-driver path
          # remains behaviorally equivalent to FIX21. Set it before Vita3K/native
          # libraries initialize so the custom Turnip driver sees it on load.
          path = Path('android/app/src/main/java/org/vita3k/emulator/Vita3KApplication.kt')
          text = path.read_text(encoding='utf-8')
          if 'import android.system.Os\n' not in text:
              text = replace_once(
                  text,
                  'import android.app.Application\n',
                  'import android.app.Application\nimport android.system.Os\n',
                  'android.system.Os import',
              )
          text = replace_once(
              text,
              '        System.loadLibrary("Vita3K")',
              f'        Os.setenv("TU_DEBUG", "{mode}", true) // [VS-GINTAMA-TU-MODE22]\n'
              '        System.loadLibrary("Vita3K")',
              'TU_DEBUG injection',
          )
          path.write_text(text, encoding='utf-8')

          print(f'[VS-GINTAMA-TU-MODE22] build forces Turnip TU_DEBUG={mode}')
          print('[VS-GINTAMA-TU-MODE22] proprietary Qualcomm path is not driver-name patched')
          PY

      - name: Probe22 regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os
          import subprocess

          mode = os.environ['TURNIP_MODE'].strip().lower()

          gradle = Path('android/app/build.gradle').read_text(encoding='utf-8')
          if 'versionCode = 67' not in gradle:
              raise SystemExit('::error::PROBE22 versionCode gate failed')
          if f'versionName = "0.3.0-alpha4-probe22-turnip-{mode}"' not in gradle:
              raise SystemExit('::error::PROBE22 versionName gate failed')

          app = Path('android/app/src/main/java/org/vita3k/emulator/Vita3KApplication.kt').read_text(encoding='utf-8')
          expected = f'Os.setenv("TU_DEBUG", "{mode}", true) // [VS-GINTAMA-TU-MODE22]'
          if expected not in app:
              raise SystemExit('::error::PROBE22 TU_DEBUG injection missing')
          if app.find(expected) > app.find('System.loadLibrary("Vita3K")'):
              raise SystemExit('::error::PROBE22 TU_DEBUG must be set before native library load')

          surface = Path('vita3k/renderer/src/vulkan/surface_cache.cpp').read_text(encoding='utf-8')
          for required in (
              '[VS-GINTAMA-FEEDBACK-BOUNDARY14]',
              '[VS-GINTAMA-DRAWTIME17]',
              '[VS-GINTAMA-STAGING19]',
              '[VS-TYPELESS-HD-STAGING]',
              '[VS-UNCHARTED-TYPELESS-CACHE9]',
          ):
              if required not in surface:
                  raise SystemExit(f'::error::PROBE22 missing protected marker {required}')
          for forbidden in (
              '[VS-GINTAMA-FEEDBACK-BARRIER15]',
              'gintama_feedback_outside_pass15',
              'gintama_to_transfer15',
          ):
              if forbidden in surface:
                  raise SystemExit(f'::error::PROBE22 forbidden Gintama regression {forbidden}')

          pipeline = Path('vita3k/renderer/src/vulkan/pipeline_cache.cpp').read_text(encoding='utf-8')
          if '[VS-GINTAMA-OUTGOING16]' in pipeline or 'gintama_outgoing_transfer16' in pipeline:
              raise SystemExit('::error::PROBE22 OUTGOING16 must remain removed')

          got = subprocess.check_output(
              ['git', 'hash-object', 'vita3k/renderer/src/vulkan/frame_generation.cpp'],
              text=True,
          ).strip()
          wanted = '1e7cc634f3308566b6ea3d972b73c55086f8f781'
          if got != wanted:
              raise SystemExit(f'::error::PROBE22 FrameGen drift expected={wanted} actual={got}')

          print(f'[PROBE22] gates passed for TU_DEBUG={mode}')
          print('[PROBE22] FrameGen, Uncharted R2 Typeless, FIX19 staging and signing base preserved')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and JVM preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac \
            --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done
          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"
          keytool -list -v -keystore "$SIGNING_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/vitastation-keytool.txt"
          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed Probe22 APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify frozen R2 shader is packaged
        shell: bash
        run: |
          set -euo pipefail
          APK='artifacts/vitastation-android/app.apk'
          TMP_SPV="$RUNNER_TEMP/probe22-packaged-reinterpret.spv"
          test -s "$APK"
          test -n "${FIX10R2_SPV_SHA256:-}"
          unzip -p "$APK" 'assets/shaders-builtin/vulkan/surface_cast_reinterpret.comp.spv' > "$TMP_SPV"
          test -s "$TMP_SPV"
          APK_SHA="$(sha256sum "$TMP_SPV" | awk '{print $1}')"
          if [[ "$APK_SHA" != "$FIX10R2_SPV_SHA256" ]]; then
            echo "::error::APK contains wrong Typeless SPIR-V expected=$FIX10R2_SPV_SHA256 actual=$APK_SHA"
            exit 1
          fi
          echo "[PROBE22] APK contains verified Typeless SPIR-V $APK_SHA"

      - name: Verify permanent APK signature and frozen FrameGen
        shell: bash
        run: |
          set -euo pipefail
          APK='artifacts/vitastation-android/app.apk'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/vitastation-apksigner.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess

          report = Path(os.environ['RUNNER_TEMP']) / 'vitastation-apksigner.txt'
          content = report.read_text(encoding='utf-8', errors='replace')
          match = re.search(r'certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)', content)
          if not match:
              raise SystemExit('::error::apksigner certificate SHA-256 digest not found')
          actual = match.group(1).replace(':', '').lower()
          expected = os.environ['VITASTATION_SIGNING_CERT_SHA256'].lower()
          if actual != expected:
              raise SystemExit(f'::error::Signing certificate mismatch expected={expected} actual={actual}')

          got = subprocess.check_output(
              ['git', 'hash-object', 'vita3k/renderer/src/vulkan/frame_generation.cpp'],
              text=True,
          ).strip()
          wanted = '1e7cc634f3308566b6ea3d972b73c55086f8f781'
          if got != wanted:
              raise SystemExit(f'::error::FrameGen drift expected={wanted} actual={got}')

          print(f'[PROBE22] permanent signing certificate verified: {actual}')
          print('[PROBE22] FrameGen remained byte-identical')
          PY

      - name: Rename and hash Probe22 APK
        shell: bash
        run: |
          set -euo pipefail
          SRC='artifacts/vitastation-android/app.apk'
          DST="artifacts/vitastation-android/$PROBE_APK_NAME"
          test -s "$SRC"
          mv "$SRC" "$DST"
          sha256sum "$DST" | tee "artifacts/vitastation-android/$PROBE_APK_NAME.sha256"
          ls -lh "$DST"

      - name: Upload Probe22 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-PROBE22-Turnip-${{ matrix.turnip_mode }}-Android-Signed
          path: |
            artifacts/vitastation-android/${{ env.PROBE_APK_NAME }}
            artifacts/vitastation-android/${{ env.PROBE_APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14
