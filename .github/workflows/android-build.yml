name: VitaStation Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-build.yml']

permissions:
  contents: write

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30

jobs:
  android-build:
    name: Build VitaStation v0.2.11 Phase04B-FIX2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply Phase04B-FIX2 in CI workspace
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/vs-fix2.py
          python3 /tmp/vs-fix2.py
          git diff --check
          grep -q 'versionName = "0.2.11"' android/app/build.gradle
          grep -q '\[VS-TEXADDR\]' vita3k/modules/SceGxm/SceGxm.cpp
          grep -q '\[VS-SURFACE-READ\]' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q '\[VS-EXIT\]' vita3k/app/src/session_controller.cpp

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false
      - uses: android-actions/setup-android@v4
      - name: Set up Android build environment
        run: bash ./.ci/setup-android.sh
      - uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            test -n "${!name:-}" || { echo "::error::Missing signing secret: $name"; exit 1; }
          done
          SIGNING_FILE="$RUNNER_TEMP/vitastation-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"
          keytool -list -v -keystore "$SIGNING_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/key.txt"
          actual="$(grep -m1 'SHA256:' "$RUNNER_TEMP/key.txt" | sed 's/.*SHA256: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$VITASTATION_SIGNING_CERT_SHA256"
          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed v0.2.11
        run: bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify signature
        shell: bash
        run: |
          set -euo pipefail
          APK=artifacts/vitastation-android/app.apk
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner.txt"
          actual="$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner.txt" | sed 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$VITASTATION_SIGNING_CERT_SHA256"

      - name: Persist source only after green signed build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add android/app/build.gradle \
            android/app/src/main/java/org/vita3k/emulator/ui/screens/InitialSetupScreen.kt \
            vita3k/modules/SceGxm/SceGxm.cpp \
            vita3k/renderer/src/vulkan/surface_cache.cpp \
            vita3k/app/src/session_controller.cpp
          if ! git diff --cached --quiet; then
            git commit -m "VitaStation v0.2.11 Phase04B-FIX2: texture/surface/exit diagnostics + compact setup [skip ci]"
            git push origin HEAD:main
          fi

      - name: Rename APK
        run: mv artifacts/vitastation-android/app.apk artifacts/vitastation-android/VitaStation-v0.2.11-Phase04B-FIX2-TexAddr-Surface-Exit-Compact-Signed.apk
      - uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.2.11-Phase04B-FIX2-Signed-Android
          path: artifacts/vitastation-android/VitaStation-v0.2.11-Phase04B-FIX2-TexAddr-Surface-Exit-Compact-Signed.apk
          if-no-files-found: error
