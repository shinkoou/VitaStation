name: VitaStation Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'vita3k/**'
      - 'data/**'
      - '.ci/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vcpkg.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

env:
  VCPKG_ROOT: /usr/local/share/vcpkg

jobs:
  android-build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Verify Phase01 viewMode fix
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "android/app/src/main/java/org/vita3k/emulator/ui/viewmodel/"
              "AppsListViewModel.kt"
          )
          text = path.read_text(encoding="utf-8")

          if "private var _viewMode by mutableStateOf(loadViewMode())" not in text:
              raise SystemExit("Phase01 backing _viewMode state is missing.")
          if "val viewMode: ViewMode" not in text:
              raise SystemExit("Phase01 public viewMode getter is missing.")
          if "fun setViewMode(mode: ViewMode)" not in text:
              raise SystemExit("Phase01 setViewMode API is missing.")

          print("Phase01 viewMode fix is present.")
          PY

      - name: Finalize VitaStation updater hotfix
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path("android/app/src/main/java/org/vita3k/emulator")

          screen = root / "ui/screens/AppsListScreen.kt"
          nav = root / "ui/navigation/AppNavigation.kt"
          vm = root / "ui/viewmodel/AppsListViewModel.kt"

          # --------------------------------------------------------------
          # AppsListScreen.kt
          # --------------------------------------------------------------
          text = screen.read_text(encoding="utf-8")

          # Remove any leftover updater icon import.
          text = text.replace(
              "import androidx.compose.material.icons.filled.SystemUpdate\n",
              "",
          )

          # Remove BOTH possible function parameters named onCheckForUpdates:
          # AppsListScreen(...) and AppsListOverflowMenu(...).
          text = text.replace(
              "    onCheckForUpdates: () -> Unit,\n",
              "",
          )

          # Remove the leftover AppsListOverflowMenu call argument.
          # Flexible indentation avoids the whitespace bug from FIX1.
          call_pattern = re.compile(
              r"(?m)^[ \t]*onCheckForUpdates = \{\n"
              r"^[ \t]*showOverflowMenu = false\n"
              r"^[ \t]*onCheckForUpdates\(\)\n"
              r"^[ \t]*\},\n"
          )
          text, call_count = call_pattern.subn("", text)

          # Remove the actual "Check for Updates" DropdownMenuItem if it is
          # still present. It may already be gone from the previous hotfix.
          menu_pattern = re.compile(
              r"(?ms)^[ \t]*DropdownMenuItem\(\n"
              r"[ \t]*text = \{ Text\(stringResource\(R\.string\.apps_list_menu_check_updates\)\) \},\n"
              r".*?"
              r"[ \t]*onClick = onCheckForUpdates\n"
              r"[ \t]*\)\n"
          )
          text, menu_count = menu_pattern.subn("", text)

          screen.write_text(text, encoding="utf-8")

          # --------------------------------------------------------------
          # AppNavigation.kt
          # --------------------------------------------------------------
          nav_text = nav.read_text(encoding="utf-8")

          nav_line = (
              "                onCheckForUpdates = "
              "{ appsListViewModel.checkForUpdates() },\n"
          )
          nav_text = nav_text.replace(nav_line, "")
          nav.write_text(nav_text, encoding="utf-8")

          # --------------------------------------------------------------
          # Validate ViewModel updater is already neutralized.
          # --------------------------------------------------------------
          vm_text = vm.read_text(encoding="utf-8")

          if "startUpdateCheckIfEnabled()" in vm_text:
              raise SystemExit(
                  "Automatic startup updater call still exists in AppsListViewModel."
              )
          if "private fun startUpdateCheckIfEnabled()" in vm_text:
              raise SystemExit(
                  "Automatic startup updater helper still exists in AppsListViewModel."
              )
          if "AppRepository.checkForUpdates(" in vm_text:
              raise SystemExit(
                  "Upstream Vita3K update request still exists in AppsListViewModel."
              )

          # --------------------------------------------------------------
          # Final compile-safety validation.
          # --------------------------------------------------------------
          final_screen = screen.read_text(encoding="utf-8")
          final_nav = nav.read_text(encoding="utf-8")

          if "onCheckForUpdates" in final_screen:
              raise SystemExit(
                  "AppsListScreen still contains an onCheckForUpdates reference."
              )
          if "onCheckForUpdates =" in final_nav:
              raise SystemExit(
                  "AppNavigation still passes onCheckForUpdates."
              )
          if "Icons.Default.SystemUpdate" in final_screen:
              raise SystemExit("Updater icon reference still exists.")
          if "apps_list_menu_check_updates" in final_screen:
              raise SystemExit("Updater menu item still exists.")

          print(
              "Updater wiring finalized. "
              f"Removed call blocks: {call_count}; menu blocks: {menu_count}."
          )
          print("Compile-safety validation passed.")
          PY

          git diff --check

      - name: Persist updater compile fix
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            android/app/src/main/java/org/vita3k/emulator/ui/screens/AppsListScreen.kt \
            android/app/src/main/java/org/vita3k/emulator/ui/navigation/AppNavigation.kt

          if git diff --cached --quiet; then
            echo "Updater compile fix already committed."
          else
            git commit -m "VitaStation: finish updater removal wiring"
            git push origin HEAD:main
          fi

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: vitastation-android-native-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            vitastation-android-native-

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        run: bash ./.ci/setup-android.sh

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Build VitaStation APK
        run: bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/vitastation-android/app.apk
          mv artifacts/vitastation-android/app.apk \
            artifacts/vitastation-android/VitaStation-v0.1.0-Phase01-Hotfix1-FIX2.apk
          ls -lh artifacts/vitastation-android/

      - name: Upload VitaStation APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.1.0-Phase01-Hotfix1-FIX2-Android
          path: artifacts/vitastation-android/VitaStation-v0.1.0-Phase01-Hotfix1-FIX2.apk
          if-no-files-found: error
