          TOUCH_B64
          base64 --decode "$RUNNER_TEMP/fix5-touch.b64" > "$RUNNER_TEMP/fix5-touch.zip"
          actual="$(sha256sum "$RUNNER_TEMP/fix5-touch.zip" | awk '{print $1}')"
          test "$actual" = "$FIX5_TOUCH_ZIP_SHA256"
          unzip -t "$RUNNER_TEMP/fix5-touch.zip" >/dev/null
          unzip -o "$RUNNER_TEMP/fix5-touch.zip" -d android/app/src/main/res/drawable/ >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          import struct
          files = """button_circle.png button_circle_pressed.png button_cross.png button_cross_pressed.png
          button_hide.png button_hide_pressed.png button_l.png button_l_pressed.png button_l2.png button_l2_pressed.png
          button_l3.png button_l3_pressed.png button_ps.png button_ps_pressed.png button_r.png button_r_pressed.png
          button_r2.png button_r2_pressed.png button_r3.png button_r3_pressed.png button_select.png button_select_pressed.png
          button_square.png button_square_pressed.png button_start.png button_start_pressed.png button_touch_b.png button_touch_f.png
          button_triangle.png button_triangle_pressed.png dpad_idle.png dpad_up.png dpad_up_left.png
          joystick.png joystick_pressed.png joystick_range.png""".split()
          if len(files) != 36:
              raise SystemExit(f"::error::FIX5 touch manifest should contain 36 files, got {len(files)}")
          root = Path("android/app/src/main/res/drawable")
          sig = b"\x89PNG\r\n\x1a\n"
          for name in files:
              data = (root / name).read_bytes()
              if not data.startswith(sig) or len(data) < 1024:
                  raise SystemExit(f"::error::invalid FIX5 PNG: {name}")
              width, height = struct.unpack('>II', data[16:24])
              if width <= 0 or height <= 0:
                  raise SystemExit(f"::error::invalid FIX5 PNG dimensions: {name}")
          print(f"[VS-TOUCH-PNG5] validated {len(files)} PNG assets")
          PY

