# VitaStation Alpha 4 FIX7
# Upload this file as .github/workflows/android-build.yml
# One consolidated build: Gintama thread-domain waits, Uncharted surface sync + feedback visibility,
# Lord of Apocalypse GXM/thread/event compatibility, reference-matched PNG touch migration,
# live Qualcomm GPU delta HUD, and Licenses/HACKs UI.
# FrameGen and FIX4 typeless staging remain frozen.

name: VitaStation Android APK - Alpha 4 FIX7

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'

# Keep the same non-persisting behavior as the current FIX5 workflow.
permissions:
  contents: read

concurrency:
  group: vitastation-android-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30
  FIX7_APK_NAME: VitaStation-v0.3.0-Alpha4-FIX7-KernelDomain-UnchartedSync-LordBoot-ReferenceTouch-GPUDelta-Licenses-Hacks-StableFG-Signed.apk

jobs:
  android-build:
    name: Build VitaStation v0.3.0 Alpha 4 FIX7
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Guard exact FIX5 persisted source baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          expected = {
              "android/app/build.gradle": "bc0cdadb0534811e247ead58a99b15849af6dc55",
              "vita3k/kernel/include/kernel/sync_primitives.h": "8374d328a1444cfc234ccc19fcd6a0cb5b40adba",
              "vita3k/kernel/src/sync_primitives.cpp": "aa1fe323958a459c4ad3199311dffbd280f02a9c",
              "vita3k/modules/SceLibKernel/SceLibKernel.cpp": "5a57eb1d2b1fc73a70af885e45845a5a2950eb5e",
              "vita3k/modules/SceKernelThreadMgr/SceThreadmgr.cpp": "9acdc564bae446ba5539870dc6e93874bfc714ab",
              "vita3k/modules/SceGxm/SceGxm.cpp": "d64a4b47475776cee9622b8cf309be489be45e6b",
              "vita3k/renderer/src/vulkan/surface_cache.cpp": "c62b44481dad44e954014827c8dae821cc93aee8",
              "vita3k/renderer/include/renderer/vulkan/surface_cache.h": "c30ac772a497c59f93a9b5d27c3de1edeb20f451",
              "vita3k/renderer/src/vulkan/frame_generation.cpp": "1e7cc634f3308566b6ea3d972b73c55086f8f781",
              "vita3k/app/src/app_init.cpp": "254aef8f8e0f079de7f5f65f5ade4b273b64c817",
              "android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java": "4932515f2720cd668211983ea584d83f38efbdae",
              "android/app/src/main/java/org/vita3k/emulator/overlay/OverlayStore.kt": "4a3ac6052860ad7604062421c2269a17f0d2efa2",
              "android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java": "7f7f95221e9176c71789ad93468510561b7ca11e",
              "android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/SettingsModels.kt": "f6928b7ce542b7a1bf1376771310174b61b2311e",
              "android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/SettingsRoute.kt": "a542183abd2546b51ace8cc18338afc2a9aef055",
              "android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/SettingsSections.kt": "1e73051c5a928cba0192ea8fd32ed943e57432bf",
              "android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/SettingsSearch.kt": "65dfe3992df70aec58e83ddb766e8bd81a0b47a1",
              "android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/EmulationPauseMenu.kt": "f03bbe9e83217a647f4d9520ae694662b020e52e",
              "android/app/src/main/res/values/integers.xml": "c6f6f03378b1033fa204d9bd27c78a64116be492",
              "android/app/src/main/res/values/strings.xml": "77d7c8a3ea1487dc00f27c211b7874615e92c34f",
              "android/app/src/main/res/values-pt-rBR/strings.xml": "c326c02c71d1468949246483284982b253943ebd",
          }

          for path, wanted in expected.items():
              p = Path(path)
              if not p.is_file():
                  raise SystemExit(f"::error::Missing persisted FIX5 source file: {path}")
              got = subprocess.check_output(["git", "hash-object", path], text=True).strip()
              if got != wanted:
                  raise SystemExit(
                      f"::error::FIX7 source baseline drift at {path}: expected={wanted} actual={got}"
                  )

          gradle = Path("android/app/build.gradle").read_text(encoding="utf-8")
          for anchor in ('versionCode = 45', 'versionName = "0.3.0-alpha4-fix5"'):
              if anchor not in gradle:
                  raise SystemExit(f"::error::FIX5 persisted version anchor missing: {anchor}")

          print("[VS-FIX7] exact persisted FIX5 source baseline verified")
          print("[VS-FIX7] main workflow-only commits do not affect source guard")
          PY

      - name: Apply one consolidated FIX7 source patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"::error::{label}: expected one anchor, found {count}")
              return text.replace(old, new, 1)

          def replace_exact_count(text, old, new, wanted, label):
              count = text.count(old)
              if count != wanted:
                  raise SystemExit(f"::error::{label}: expected {wanted} anchors, found {count}")
              return text.replace(old, new)

          def function_span(text, marker):
              start = text.find(marker)
              if start < 0:
                  raise SystemExit(f"::error::function marker not found: {marker}")
              brace = text.find("{", start)
              if brace < 0:
                  raise SystemExit(f"::error::opening brace not found: {marker}")
              depth = 0
              for index in range(brace, len(text)):
                  ch = text[index]
                  if ch == "{":
                      depth += 1
                  elif ch == "}":
                      depth -= 1
                      if depth == 0:
                          return start, index + 1
              raise SystemExit(f"::error::closing brace not found: {marker}")

          def replace_in_function(text, marker, old, new, label):
              start, end = function_span(text, marker)
              body = text[start:end]
              body = replace_once(body, old, new, label)
              return text[:start] + body + text[end:]

          def replace_function(text, marker, new_body):
              start, end = function_span(text, marker)
              return text[:start] + new_body + text[end:]

          def append_xml_strings(text, block, label):
              if block.strip().splitlines()[0].strip() in text:
                  raise SystemExit(f"::error::{label}: strings already present")
              return replace_once(text, "</resources>", block + "\n</resources>", label)

          # ---------------------------------------------------------------
          # Version 47 / Alpha 4 FIX7
          # ---------------------------------------------------------------
          path = "android/app/build.gradle"
          text = read(path)
          text = replace_once(text, "versionCode = 45", "versionCode = 47", "versionCode")
          text = replace_once(
              text,
              'versionName = "0.3.0-alpha4-fix5"',
              'versionName = "0.3.0-alpha4-fix7"',
              "versionName",
          )
          write(path, text)

          # ---------------------------------------------------------------
          # Gintama PCSG01073: wait on ThreadState::status_cond with the mutex
          # that actually protects ThreadState::status. The primitive lock is
          # dropped before the wait and reacquired before queue inspection.
          # This preserves primitive->thread ordering on timeout/wake races.
          # ---------------------------------------------------------------
          path = "vita3k/kernel/src/sync_primitives.cpp"
          text = read(path)
          new_handle_timeout = r'''inline static int handle_timeout(KernelState &kernel, const ThreadStatePtr &thread, std::unique_lock<std::mutex> &thread_lock,
              std::unique_lock<std::mutex> &primitive_lock, WaitingThreadQueuePtr &queue,
              const ThreadDataQueueInterator<WaitingThreadData> &data_it, const char *export_name,
              SceUInt *const timeout) {
              // [VS-KERNEL-WAIT-DOMAIN7]
              // ThreadState::status and status_cond belong to thread->mutex. Waiting on
              // the primitive mutex can miss/observe status changes in the wrong domain.
              // Drop the primitive while sleeping, then restore primitive->thread order
              // before resolving a timeout race and touching the primitive wait queue.
              const auto start = std::chrono::steady_clock::now();
              const SceUInt requested_timeout = timeout ? *timeout : 0;
              bool awakened = false;

              primitive_lock.unlock();
              thread_lock.lock();

              if (timeout) {
                  if (requested_timeout > 0) {
                      awakened = thread->status_cond.wait_for(
                          thread_lock,
                          std::chrono::microseconds{ requested_timeout },
                          [&] { return thread->status == ThreadStatus::run; });
                  } else {
                      awakened = thread->status == ThreadStatus::run;
                  }
              } else {
                  thread->status_cond.wait(thread_lock, [&] {
                      return thread->status == ThreadStatus::run;
                  });
                  awakened = true;
              }

              thread_lock.unlock();
              primitive_lock.lock();

              if (!timeout)
                  return SCE_KERNEL_OK;

              if (!awakened) {
                  // A signal can win immediately after wait_for reports timeout. Recheck
                  // only after restoring primitive->thread ordering. If still waiting,
                  // this path owns cancellation of its queue entry.
                  thread_lock.lock();
                  const bool signal_won_race = thread->status == ThreadStatus::run;
                  if (!signal_won_race)
                      thread->update_status(ThreadStatus::run, ThreadStatus::wait);
                  thread_lock.unlock();

                  if (!signal_won_race) {
                      const auto queued = queue->find(thread);
                      if (queued != queue->end())
                          queue->erase(queued);
                      *timeout = 0;
                      return RET_ERROR(SCE_KERNEL_ERROR_WAIT_TIMEOUT);
                  }
              }

              const auto elapsed = static_cast<uint64_t>(std::chrono::duration_cast<std::chrono::microseconds>(
                  std::chrono::steady_clock::now() - start).count());
              *timeout = elapsed >= requested_timeout
                  ? 0
                  : static_cast<SceUInt>(requested_timeout - elapsed);
              return SCE_KERNEL_OK;
          }'''
          text = replace_function(text, "inline static int handle_timeout(", new_handle_timeout)

          # Lord: simple events must be erased from the same table used by create/find.
          text = replace_in_function(
              text,
              "SceInt32 simple_event_delete(",
              "        kernel.eventflags.erase(event_id);",
              "        // [VS-SIMPLE-EVENT-LIFECYCLE7]\n        kernel.simple_events.erase(event_id);",
              "simple-event UID table",
          )
          write(path, text)

          # ---------------------------------------------------------------
          # Lord of Apocalypse PCSG00008: callback waits remain waits, and its
          # legacy zero-sized thread-info request receives the current ABI only
          # for this title. Other titles still reject nonsensical tiny sizes.
          # ---------------------------------------------------------------
          path = "vita3k/modules/SceKernelThreadMgr/SceThreadmgr.cpp"
          text = read(path)
          if "#include <io/state.h>" not in text:
              text = replace_once(
                  text,
                  "#include <kernel/types.h>\n",
                  "#include <kernel/types.h>\n#include <io/state.h>\n",
                  "ThreadMgr io state include",
              )
          text = replace_once(
              text,
              "    return simple_event_waitorpoll(emuenv.kernel, export_name, thread_id, event_id, bit_pattern, result_pattern, user_data, timeout, false);",
              "    // [VS-EVENT-CB-WAIT7] Callback variant remains a blocking wait.\n"
              "    return simple_event_waitorpoll(emuenv.kernel, export_name, thread_id, event_id, bit_pattern, result_pattern, user_data, timeout, true);",
              "Lord event CB wait",
          )
          new_thread_info = r'''EXPORT(SceInt32, _sceKernelGetThreadInfo, SceUID threadId, Ptr<SceKernelThreadInfo> pInfo) {
              TRACY_FUNC(_sceKernelGetThreadInfo, threadId, pInfo);
              STUBBED("STUB");

              const SceUID resolved_thread_id = threadId ? threadId : thread_id;
              const ThreadStatePtr thread = emuenv.kernel.get_thread(resolved_thread_id);
              if (!thread)
                  return RET_ERROR(SCE_KERNEL_ERROR_UNKNOWN_THREAD_ID);

              SceKernelThreadInfo *info = pInfo.get(emuenv.mem);
              if (!info)
                  return RET_ERROR(SCE_KERNEL_ERROR_ILLEGAL_ADDR);

              // [VS-THREADINFO-ABI7] Size-versioned compatibility. LORD of APOCALYPSE
              // sends a zero legacy size in this path; scope the zero->current fallback
              // to PCSG00008 rather than weakening validation for every title.
              const SceSize requested_size = info->size;
              SceSize effective_size = requested_size;
              if (effective_size == 0 && emuenv.io.app_path == "PCSG00008")
                  effective_size = static_cast<SceSize>(sizeof(SceKernelThreadInfo));
              if (effective_size < sizeof(SceSize))
                  return RET_ERROR(SCE_KERNEL_ERROR_INVALID_ARGUMENT_SIZE);

              SceKernelThreadInfo compat_info{};
              compat_info.size = effective_size;
              strncpy(compat_info.name, thread->name.c_str(), KERNELOBJECT_MAX_NAME_LENGTH);
              compat_info.stack = Ptr<void>(thread->stack.get());
              compat_info.stackSize = thread->stack_size;
              compat_info.initPriority = thread->priority;
              compat_info.currentPriority = thread->priority;
              compat_info.initCpuAffinityMask = thread->affinity_mask;
              compat_info.currentCpuAffinityMask = thread->affinity_mask;
              compat_info.entry = SceKernelThreadEntry(thread->entry_point);
              if (thread->status == ThreadStatus::dormant)
                  compat_info.exitStatus = thread->returned_value;

              const SceSize copy_size = effective_size < sizeof(compat_info)
                  ? effective_size
                  : static_cast<SceSize>(sizeof(compat_info));
              memcpy(info, &compat_info, copy_size);
              return SCE_KERNEL_OK;
          }'''
          text = replace_function(text, "EXPORT(SceInt32, _sceKernelGetThreadInfo,", new_thread_info)
          write(path, text)

          # ---------------------------------------------------------------
          # Lord GXM: its second immediate-context create currently returns
          # ALREADY_INITIALIZED, leaving the caller's context null. Rebind that
          # caller to the already-live immediate context for PCSG00008 only.
          # Keep a narrow null-finish safety net too.
          # ---------------------------------------------------------------
          path = "vita3k/modules/SceGxm/SceGxm.cpp"
          text = read(path)
          text = replace_in_function(
              text,
              "EXPORT(int, sceGxmCreateContext,",
              "    if (emuenv.gxm.immediate_context != 0) {\n"
              "        return RET_ERROR(SCE_GXM_ERROR_ALREADY_INITIALIZED);\n"
              "    }",
              "    if (emuenv.gxm.immediate_context != 0) {\n"
              "        if (emuenv.io.app_path == \"PCSG00008\") {\n"
              "            SceGxmContext *existing = Ptr<SceGxmContext>(emuenv.gxm.immediate_context).get(emuenv.mem);\n"
              "            if (existing) {\n"
              "                *context = Ptr<SceGxmContext>(emuenv.gxm.immediate_context);\n"
              "                LOG_WARN(\"[VS-GXM-CONTEXT-REUSE7] PCSG00008 rebound duplicate create to {}\",\n"
              "                    log_hex(emuenv.gxm.immediate_context));\n"
              "                return 0;\n"
              "            }\n"
              "        }\n"
              "        return RET_ERROR(SCE_GXM_ERROR_ALREADY_INITIALIZED);\n"
              "    }",
              "Lord immediate GXM context reuse",
          )
          text = replace_in_function(
              text,
              "EXPORT(int, sceGxmFinish,",
              "    if (!context)\n        return RET_ERROR(SCE_GXM_ERROR_INVALID_THREAD);",
              "    if (!context) {\n"
              "        if (emuenv.io.app_path != \"PCSG00008\" || emuenv.gxm.immediate_context == 0)\n"
              "            return RET_ERROR(SCE_GXM_ERROR_INVALID_POINTER);\n"
              "        context = Ptr<SceGxmContext>(emuenv.gxm.immediate_context).get(emuenv.mem);\n"
              "        if (!context)\n"
              "            return RET_ERROR(SCE_GXM_ERROR_INVALID_POINTER);\n"
              "        LOG_WARN(\"[VS-GXM-FINISH-RECOVER7] PCSG00008 recovered null finish with {}\",\n"
              "            log_hex(emuenv.gxm.immediate_context));\n"
              "    }",
              "Lord null finish fallback",
          )
          write(path, text)

          # ---------------------------------------------------------------
          # Uncharted PCSA00029: user config has disable-surface-sync=true,
          # which bypasses the Vulkan surface cache synchronization paths.
          # Force synchronization ON for this title at renderer application time.
          # ---------------------------------------------------------------
          path = "vita3k/app/src/app_init.cpp"
          text = read(path)
          old_sync = "    r.set_surface_sync_state(cc.disable_surface_sync);"
          new_sync = (
              "    // [VS-UNCHARTED-SURFACE-SYNC7] PCSA00029 uses framebuffer feedback; "
              "do not bypass surface sync.\n"
              "    const bool vs_disable_surface_sync = emuenv.io.app_path == \"PCSA00029\"\n"
              "        ? false\n"
              "        : cc.disable_surface_sync;\n"
              "    r.set_surface_sync_state(vs_disable_surface_sync);"
          )
          text = replace_exact_count(text, old_sync, new_sync, 2, "Uncharted renderer surface sync")
          write(path, text)

          path = "vita3k/renderer/src/vulkan/surface_cache.cpp"
          text = read(path)
          text = replace_once(
              text,
              "        casted->texture.transition_to(\n"
              "            cmd_buffer, vkutil::ImageLayout::ColorAttachmentReadWrite);",
              "        // [VS-FEEDBACK-SNAPSHOT-SAMPLED7] Feedback snapshot is sampled after resolve.\n"
              "        casted->texture.transition_to(\n"
              "            cmd_buffer, vkutil::ImageLayout::SampledImage);",
              "Uncharted sampled feedback snapshot",
          )
          write(path, text)

          # ---------------------------------------------------------------
          # Qualcomm/Adreno HUD: gpubusy is a pair of counters on many KGSL
          # kernels. A lifetime busy/total ratio can sit at a fixed value. Use
          # interval deltas when monotonic, then fall back safely.
          # ---------------------------------------------------------------
          path = "android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java"
          text = read(path)
          text = replace_once(
              text,
              "    private long lastSlowUpdateMs;",
              "    private long lastSlowUpdateMs;\n"
              "    // [VS-GPU-DELTA7] Previous KGSL counters for interval utilization.\n"
              "    private long previousGpuBusy = -1L;\n"
              "    private long previousGpuTotal = -1L;",
              "GPU delta fields",
          )
          gpu_start, gpu_end = function_span(text, "    private Float readGpuUsage()")
          new_gpu = r'''    private Float readGpuUsage() {
              // [VS-GPU-DELTA7] Prefer KGSL gpubusy and compute utilization over the
              // interval between HUD samples instead of a process-lifetime ratio.
              try {
                  String raw = readText("/sys/class/kgsl/kgsl-3d0/gpubusy");
                  if (raw != null) {
                      String[] parts = raw.trim().split("\\s+");
                      if (parts.length >= 2) {
                          long busy = Long.parseLong(parts[0]);
                          long total = Long.parseLong(parts[1]);
                          Float value = null;

                          if (previousGpuBusy >= 0L && previousGpuTotal >= 0L
                                  && busy >= previousGpuBusy && total >= previousGpuTotal) {
                              long deltaBusy = busy - previousGpuBusy;
                              long deltaTotal = total - previousGpuTotal;
                              if (deltaTotal > 0L) {
                                  value = clamp((deltaBusy * 100f) / deltaTotal);
                              }
                          }

                          previousGpuBusy = busy;
                          previousGpuTotal = total;

                          if (value != null) return value;
                          if (total > 0L) return clamp((busy * 100f) / total);
                      }
                  }
              } catch (Throwable ignored) {}

              Float direct = readSinglePercent("/sys/class/kgsl/kgsl-3d0/gpu_busy_percentage");
              if (direct != null) return direct;

              try {
                  File devfreq = new File("/sys/class/devfreq");
                  File[] devices = devfreq.listFiles();
                  if (devices != null) {
                      for (File device : devices) {
                          String name = device.getName().toLowerCase(Locale.ROOT);
                          if (!name.contains("gpu") && !name.contains("mali")) continue;
                          for (String leaf : new String[]{"load", "utilization", "busy_percent"}) {
                              Float value = readSinglePercent(new File(device, leaf).getAbsolutePath());
                              if (value != null) return value;
                          }
                      }
                  }
              } catch (Throwable ignored) {}
              return null;
          }'''
          text = text[:gpu_start] + new_gpu + text[gpu_end:]
          write(path, text)

          # ---------------------------------------------------------------
          # Touch: reference-matched geometry from the supplied 1536x766 PNG.
          # Preserve exact current active/idle opacity and authored PNG pixels.
          # Remove Engine4 post-resize geometry so image scale is authoritative.
          # ---------------------------------------------------------------
          path = "android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java"
          text = read(path)
          text = replace_once(text, "    float scale = 0.115f;", "    float scale = 0.138f; // [VS-TOUCH-REFERENCE7] face max edge ~106/766", "face scale")
          text = replace_once(
              text,
              "    if(legacyId == ButtonType.TRIGGER_L\n"
              "            || legacyId == ButtonType.TRIGGER_R\n"
              "            || legacyId == ButtonType.TRIGGER_L2\n"
              "            || legacyId == ButtonType.TRIGGER_R2\n"
              "            || legacyId == ButtonType.BUTTON_START\n"
              "            || legacyId == ButtonType.BUTTON_SELECT)\n"
              "      scale = 0.17f;\n"
              "    else if(legacyId == ButtonType.BUTTON_TOUCH_SWITCH\n"
              "            || legacyId == ButtonType.BUTTON_PS\n"
              "            || legacyId == ButtonType.BUTTON_TOUCH_HIDE)\n"
              "      scale = 0.075f;",
              "    if(legacyId == ButtonType.TRIGGER_L || legacyId == ButtonType.TRIGGER_R)\n"
              "      scale = 0.312f; // [VS-TOUCH-REFERENCE7] shoulder width ~239/766\n"
              "    else if(legacyId == ButtonType.BUTTON_START || legacyId == ButtonType.BUTTON_SELECT)\n"
              "      scale = 0.300f; // [VS-TOUCH-REFERENCE7] Start/Select width ~229/766\n"
              "    else if(legacyId == ButtonType.TRIGGER_L2 || legacyId == ButtonType.TRIGGER_R2)\n"
              "      scale = 0.17f;\n"
              "    else if(legacyId == ButtonType.BUTTON_PS)\n"
              "      scale = 0.146f; // [VS-TOUCH-REFERENCE7] PS max edge ~112/766\n"
              "    else if(legacyId == ButtonType.BUTTON_TOUCH_SWITCH\n"
              "            || legacyId == ButtonType.BUTTON_TOUCH_HIDE)\n"
              "      scale = 0.075f;",
              "reference button scale classes",
          )
          text = replace_once(text, "    float scale = 0.245f;", "    float scale = 0.366f; // [VS-TOUCH-REFERENCE7] D-pad footprint ~280/766", "D-pad scale")
          text = replace_once(text, "    float scale = 0.205f;", "    float scale = 0.308f; // [VS-TOUCH-REFERENCE7] analog max edge ~236/766", "joystick scale")
          text = replace_once(
              text,
              "    overlayDrawable.setSize(\n"
              "            vsButtonWidth(legacyId, layoutBounds, globalScale),\n"
              "            vsButtonHeight(legacyId, layoutBounds, globalScale));\n",
              "    // [VS-TOUCH-PNG-AUTHORITY7] Bitmap dimensions are the visual bounds.\n",
              "remove compact button sizing",
          )
          text = replace_once(
              text,
              "    final int dpadSize = vsDpadSize(layoutBounds, globalScale);\n"
              "    overlayDrawable.setSize(dpadSize, dpadSize);\n",
              "    // [VS-TOUCH-PNG-AUTHORITY7] Keep authored D-pad bitmap footprint.\n",
              "remove compact dpad sizing",
          )
          text = replace_once(
              text,
              "    int outerSize = vsJoystickSize(layoutBounds, globalScale);",
              "    // [VS-TOUCH-PNG-AUTHORITY7] Scaled outer PNG defines analog footprint.\n"
              "    int outerSize = bitmapOuter.getWidth();",
              "remove compact analog sizing",
          )
          write(path, text)

