# VitaStation Alpha 4 FIX5 continuation workflow
# Upload/rename this file to: .github/workflows/android-build.yml
# IMPORTANT: this workflow intentionally DOES NOT run vitastation-bootstrap.yml.
# It builds the FIX5 source already persisted on main and hard-gates the critical fixes.

name: VitaStation Android APK - Alpha 4 FIX5 Final

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

concurrency:
  group: vitastation-android-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30
  FIX5_APK_NAME: VitaStation-v0.3.0-Alpha4-FIX5-KernelWorkarea-BlackAtlas-PNGTouch-GPU026-StableFG-Signed.apk

jobs:
  android-build:
    name: Build VitaStation v0.3.0 Alpha 4 FIX5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Guard persisted FIX5 baseline and frozen FrameGen
        shell: bash
        run: |
          set -euo pipefail

          # Critical source objects from the persisted FIX5 main baseline.
          declare -A expected=(
            ["android/app/build.gradle"]="bc0cdadb0534811e247ead58a99b15849af6dc55"
            ["vita3k/kernel/include/kernel/sync_primitives.h"]="8374d328a1444cfc234ccc19fcd6a0cb5b40adba"
            ["vita3k/kernel/src/sync_primitives.cpp"]="aa1fe323958a459c4ad3199311dffbd280f02a9c"
            ["vita3k/modules/SceLibKernel/SceLibKernel.cpp"]="5a57eb1d2b1fc73a70af885e45845a5a2950eb5e"
            ["vita3k/modules/SceKernelThreadMgr/SceThreadmgr.cpp"]="9acdc564bae446ba5539870dc6e93874bfc714ab"
            ["vita3k/renderer/src/vulkan/surface_cache.cpp"]="c62b44481dad44e954014827c8dae821cc93aee8"
            ["vita3k/renderer/src/vulkan/frame_generation.cpp"]="1e7cc634f3308566b6ea3d972b73c55086f8f781"
            ["android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java"]="7f7f95221e9176c71789ad93468510561b7ca11e"
            ["android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java"]="4932515f2720cd668211983ea584d83f38efbdae"
          )

          for path in "${!expected[@]}"; do
            test -f "$path" || { echo "::error::Missing FIX5 source: $path"; exit 1; }
            actual="$(git hash-object "$path")"
            if [ "$actual" != "${expected[$path]}" ]; then
              echo "::error::FIX5 baseline drift at $path expected=${expected[$path]} actual=$actual"
              exit 1
            fi
          done

          # Version gate.
          grep -Fq 'versionCode = 45' android/app/build.gradle
          grep -Fq 'versionName = "0.3.0-alpha4-fix5"' android/app/build.gradle

          # FrameGen is frozen. FIX5 must not touch it.
          test "$(git hash-object vita3k/renderer/src/vulkan/frame_generation.cpp)" = \
            "1e7cc634f3308566b6ea3d972b73c55086f8f781"

          echo "[VS-FIX5] persisted source baseline verified"
          echo "[VS-FIX5] FrameGen frozen and bit-identical"

      - name: Gate Kernel Sync 4.0 LwMutex workarea coherence
        shell: bash
        run: |
          set -euo pipefail
          CPP='vita3k/kernel/src/sync_primitives.cpp'
          HDR='vita3k/kernel/include/kernel/sync_primitives.h'

          grep -Fq '[VS-LWMUTEX-WORKAREA]' "$CPP"
          grep -Fq 'inline static int mutex_unlock_impl(KernelState &kernel, MemState &mem' "$CPP"
          grep -Fq 'int mutex_unlock(KernelState &kernel, MemState &mem' "$CPP"
          grep -Fq 'SceKernelLwMutexWork *work = mutex->workarea.get(mem);' "$CPP"
          grep -Fq 'work->lockCount = mutex->lock_count;' "$CPP"
          grep -Fq 'work->owner = mutex->owner ? mutex->owner->id : 0;' "$CPP"
          grep -Fq 'mutex->lock_count = waiting_lock_count;' "$CPP"
          grep -Fq 'mutex->owner = waiting_thread;' "$CPP"
          grep -Fq 'sync_lw_workarea();' "$CPP"
          grep -Fq 'mutex_unlock_impl(kernel, mem, export_name, thread_id, 1, condvar->associated_mutex, weight)' "$CPP"

          # FIX2 timeout reacquire and FIX4 ownership wake guard remain present.
          grep -Fq '[VS-KERNEL-SYNC-FIX]' "$CPP"
          grep -Fq '[VS-KERNEL-OWNERSHIP-WAIT]' "$CPP"

          # Header and exported callsites must carry MemState too.
          grep -Eq 'mutex_unlock\([^;]*MemState[[:space:]]*&mem' "$HDR" || \
            grep -Fq 'MemState &mem' "$HDR"
          grep -Fq 'emuenv.mem' vita3k/modules/SceLibKernel/SceLibKernel.cpp
          grep -Fq 'emuenv.mem' vita3k/modules/SceKernelThreadMgr/SceThreadmgr.cpp

          echo "[VS-FIX5] Kernel Sync 4.0 gates passed"

      - name: Gate Uncharted feedback resolve and HD Typeless staging
        shell: bash
        run: |
          set -euo pipefail
          SRC='vita3k/renderer/src/vulkan/surface_cache.cpp'
          HDR='vita3k/renderer/include/renderer/vulkan/surface_cache.h'

          # Black-atlas / framebuffer feedback: generation equality may not bypass a required late resolve.
          grep -Fq '[VS-FEEDBACK-CACHE]' "$SRC"
          grep -Fq 'const bool needs_late_resolve = is_same_image || unresolved_scene_write;' "$SRC"
          grep -Fq 'if (!needs_late_resolve && casted->source_generation == source_generation)' "$SRC"

          # FIX4 isolated HD Typeless staging stays intact.
          grep -Fq '[VS-TYPELESS-HD-STAGING]' "$SRC"
          grep -Fq 'source_mutable=0' "$SRC"
          grep -Fq '[VS-TYPELESS-STAGING]' "$HDR"
          grep -Fq 'start_word' "$HDR"
          if grep -q 'reinterpret_store_view' "$SRC" "$HDR"; then
            echo "::error::Global mutable64/old reinterpret_store_view regression detected"
            exit 1
          fi

          echo "[VS-FIX5] framebuffer feedback + Typeless staging gates passed"

      - name: Gate historical GPU reader and PNG touch path
        shell: bash
        run: |
          set -euo pipefail
          HUD='android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java'
          OVERLAY='android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java'
          DRAWABLE='android/app/src/main/res/drawable'

          # Known-good v0.2.6 GPU reader. No fake zero state machine.
          grep -Fq '[VS-GPU-HUD-HISTORICAL]' "$HUD"
          grep -Fq '/sys/class/kgsl/kgsl-3d0/gpu_busy_percentage' "$HUD"
          grep -Fq '/sys/class/kgsl/kgsl-3d0/gpubusy' "$HUD"
          grep -Fq 'File devfreq = new File("/sys/class/devfreq")' "$HUD"
          if grep -Eq 'zeroCandidate|previousGpuBusy|GPU_DELTA|PRIMED' "$HUD"; then
            echo "::error::Old GPU zero/delta heuristic survived FIX5"
            exit 1
          fi

          # PNG art is the normal visual path; hitbox/input backend remains unchanged.
          grep -Fq '[VS-TOUCH-PNG5]' "$OVERLAY"
          grep -Fq 'button.draw(canvas);' "$OVERLAY"
          grep -Fq 'dpad.draw(canvas);' "$OVERLAY"
          grep -Fq 'joystick.draw(canvas);' "$OVERLAY"
          grep -Fq 'OVERLAY_ACTIVE_ALPHA = 0.42f' "$OVERLAY"
          grep -Fq 'OVERLAY_IDLE_ALPHA = 0.22f' "$OVERLAY"
          grep -Fq 'setButton(' "$OVERLAY"
          grep -Fq 'setAxis(' "$OVERLAY"

          # Runtime tint must not destroy the authored neon/white PNG pixels.
          if grep -Eq 'PorterDuffColorFilter|PorterDuff\.Mode\.MULTIPLY|tintBitmap\(' "$OVERLAY"; then
            echo "::error::Destructive runtime PNG tint detected"
            exit 1
          fi

          # Core reference-derived PNGs must exist in resources.
          for png in \
            button_cross.png button_cross_pressed.png \
            button_circle.png button_circle_pressed.png \
            button_square.png button_square_pressed.png \
            button_triangle.png button_triangle_pressed.png \
            button_l.png button_l_pressed.png \
            button_r.png button_r_pressed.png \
            button_select.png button_select_pressed.png \
            button_start.png button_start_pressed.png \
            button_ps.png button_ps_pressed.png \
            dpad_idle.png dpad_up.png dpad_up_left.png \
            joystick_range.png joystick.png joystick_pressed.png; do
            test -s "$DRAWABLE/$png" || { echo "::error::Missing FIX5 touch PNG: $png"; exit 1; }
          done

          grep -Fq 'value * 1.62f' android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableButton.java
          grep -Fq 'value * 1.62f' android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableDpad.java
          grep -Fq 'value * 1.62f' android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableJoystick.java

          echo "[VS-FIX5] GPU026 + PNG touch gates passed"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and JVM preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac \
            --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done

          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"
          keytool -list -v \
            -keystore "$SIGNING_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > "$RUNNER_TEMP/vitastation-keytool.txt"

          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed VitaStation FIX5 APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify APK signature and frozen FrameGen
        shell: bash
        run: |
          set -euo pipefail
          APK='artifacts/vitastation-android/app.apk'
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/vitastation-apksigner.txt"

          actual="$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/vitastation-apksigner.txt" \
            | sed 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$actual" != "$VITASTATION_SIGNING_CERT_SHA256" ]; then
            echo "::error::Signing certificate mismatch expected=$VITASTATION_SIGNING_CERT_SHA256 actual=$actual"
            exit 1
          fi

          test "$(git hash-object vita3k/renderer/src/vulkan/frame_generation.cpp)" = \
            "1e7cc634f3308566b6ea3d972b73c55086f8f781"

          echo "[VS-FIX5] signature and FrameGen verification passed"

      - name: Rename and hash FIX5 APK
        shell: bash
        run: |
          set -euo pipefail
          SRC='artifacts/vitastation-android/app.apk'
          DST="artifacts/vitastation-android/$FIX5_APK_NAME"
          test -s "$SRC"
          mv "$SRC" "$DST"
          sha256sum "$DST" | tee "artifacts/vitastation-android/$FIX5_APK_NAME.sha256"
          ls -lh "$DST"

      - name: Upload VitaStation FIX5 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.3.0-Alpha4-FIX5-Android-Signed
          path: |
            artifacts/vitastation-android/${{ env.FIX5_APK_NAME }}
            artifacts/vitastation-android/${{ env.FIX5_APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
