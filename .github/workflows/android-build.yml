name: VitaStation Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'vita3k/**'
      - 'external/lsfg-vk-android'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

env:
  VCPKG_ROOT: /usr/local/share/vcpkg

jobs:
  android-build:
    name: Build VitaStation Phase03B LSFG 2X
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply VitaStation v0.2.5 Phase03B
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/vitastation-phase03b.py
          python3 /tmp/vitastation-phase03b.py
          git diff --check

      - name: Restore stable VitaStation dev signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: vitastation-dev-debug-keystore-v1

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: vitastation-android-native-lsfg-${{ hashFiles('CMakeLists.txt', 'vita3k/CMakeLists.txt', 'external/lsfg-vk-android/framegen/CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            vitastation-android-native-lsfg-
            vitastation-android-native-

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        run: bash ./.ci/setup-android.sh

      - name: Kotlin compile preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew :app:compileReldebugKotlin --stacktrace

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Build VitaStation Phase03B APK
        run: bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Persist Phase03B only after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"

          git add android vita3k

          if git diff --cached --quiet; then
            echo "Phase03B source already applied."
          else
            git commit -m "VitaStation v0.2.5 Phase03B: direct LSFG 2x and firmware UI polish"
            git push origin HEAD:main
          fi

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/vitastation-android/app.apk
          mv artifacts/vitastation-android/app.apk             artifacts/vitastation-android/VitaStation-v0.2.5-Phase03B-LSFG-2X.apk
          ls -lh artifacts/vitastation-android/

      - name: Upload VitaStation Phase03B APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.2.5-Phase03B-LSFG-2X-Android
          path: artifacts/vitastation-android/VitaStation-v0.2.5-Phase03B-LSFG-2X.apk
          if-no-files-found: error
