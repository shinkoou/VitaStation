      - name: FIX7 integrated source gates and regression audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          def text(path):
              return Path(path).read_text(encoding="utf-8")

          def require(path, *markers):
              data = text(path)
              for marker in markers:
                  if marker not in data:
                      raise SystemExit(f"::error::FIX7 gate missing in {path}: {marker}")

          def forbid(path, *markers):
              data = text(path)
              for marker in markers:
                  if marker in data:
                      raise SystemExit(f"::error::Forbidden regression in {path}: {marker}")

          require("android/app/build.gradle", "versionCode = 47", 'versionName = "0.3.0-alpha4-fix7"')

          require(
              "vita3k/kernel/src/sync_primitives.cpp",
              "[VS-KERNEL-WAIT-DOMAIN7]",
              "primitive_lock.unlock();",
              "thread->status_cond.wait_for(",
              "thread_lock,",
              "primitive_lock.lock();",
              "queue->find(thread)",
              "[VS-SIMPLE-EVENT-LIFECYCLE7]",
              "kernel.simple_events.erase(event_id);",
              "[VS-KERNEL-SYNC-FIX]",
              "[VS-KERNEL-OWNERSHIP-WAIT]",
              "[VS-LWMUTEX-WORKAREA]",
          )
          forbid("vita3k/kernel/src/sync_primitives.cpp", "[VS-EVENT-UID-MISS6]")

          require(
              "vita3k/modules/SceKernelThreadMgr/SceThreadmgr.cpp",
              "#include <io/state.h>",
              "[VS-EVENT-CB-WAIT7]",
              "[VS-THREADINFO-ABI7]",
              'emuenv.io.app_path == "PCSG00008"',
          )
          require(
              "vita3k/modules/SceGxm/SceGxm.cpp",
              "[VS-GXM-CONTEXT-REUSE7]",
              "[VS-GXM-FINISH-RECOVER7]",
              'emuenv.io.app_path == "PCSG00008"',
          )

          require(
              "vita3k/app/src/app_init.cpp",
              "[VS-UNCHARTED-SURFACE-SYNC7]",
              'emuenv.io.app_path == "PCSA00029"',
              "r.set_surface_sync_state(vs_disable_surface_sync);",
          )
          if text("vita3k/app/src/app_init.cpp").count("[VS-UNCHARTED-SURFACE-SYNC7]") != 2:
              raise SystemExit("::error::Uncharted surface-sync override must cover both renderer config paths")

          require(
              "vita3k/renderer/src/vulkan/surface_cache.cpp",
              "[VS-FEEDBACK-CACHE]",
              "const bool needs_late_resolve = is_same_image || unresolved_scene_write;",
              "[VS-FEEDBACK-SNAPSHOT-SAMPLED7]",
              "cmd_buffer, vkutil::ImageLayout::SampledImage);",
              "[VS-TYPELESS-HD-STAGING]",
              "source_mutable=0",
          )
          forbid("vita3k/renderer/src/vulkan/surface_cache.cpp", "reinterpret_store_view")
          require("vita3k/renderer/include/renderer/vulkan/surface_cache.h", "[VS-TYPELESS-STAGING]", "start_word")

          hud = "android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java"
          require(hud, "[VS-GPU-DELTA7]", "deltaBusy", "deltaTotal", "previousGpuBusy", "previousGpuTotal")

          overlay = "android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java"
          require(
              overlay,
              "[VS-TOUCH-PNG5]",
              "[VS-TOUCH-REFERENCE7]",
              "[VS-TOUCH-PNG-AUTHORITY7]",
              "button.draw(canvas);",
              "dpad.draw(canvas);",
              "joystick.draw(canvas);",
              "OVERLAY_ACTIVE_ALPHA = 0.42f",
              "OVERLAY_IDLE_ALPHA = 0.22f",
              "float scale = 0.138f;",
              "scale = 0.312f;",
              "scale = 0.300f;",
              "float scale = 0.366f;",
              "float scale = 0.308f;",
              "int outerSize = bitmapOuter.getWidth();",
          )
          forbid(
              overlay,
              "PorterDuffColorFilter",
              "PorterDuff.Mode.MULTIPLY",
              "tintBitmap(",
              "overlayDrawable.setSize(\n            vsButtonWidth",
              "final int dpadSize = vsDpadSize",
              "int outerSize = vsJoystickSize",
          )
          require(
              "android/app/src/main/java/org/vita3k/emulator/overlay/OverlayStore.kt",
              "[VS-TOUCH-LAYOUT-MIGRATION7]",
              "CURRENT_LAYOUT_SCHEMA_VERSION = 7",
              "migrateReferenceLayoutIfNeeded(context, prefs)",
          )
          ints = text("android/app/src/main/res/values/integers.xml")
          expected_positions = {
              "BUTTON_CROSS_X": 747, "BUTTON_CROSS_Y": 521,
              "BUTTON_CIRCLE_X": 811, "BUTTON_CIRCLE_Y": 407,
              "BUTTON_SQUARE_X": 684, "BUTTON_SQUARE_Y": 407,
              "BUTTON_TRIANGLE_X": 747, "BUTTON_TRIANGLE_Y": 290,
              "BUTTON_SELECT_X": 126, "BUTTON_SELECT_Y": 705,
              "BUTTON_START_X": 721, "BUTTON_START_Y": 702,
              "BUTTON_PS_X": 464, "BUTTON_PS_Y": 625,
              "DPAD_UP_X": 119, "DPAD_UP_Y": 295,
              "STICK_LEFT_X": 282, "STICK_LEFT_Y": 516,
              "STICK_RIGHT_X": 565, "STICK_RIGHT_Y": 516,
              "TRIGGER_L_X": 146, "TRIGGER_L_Y": 155,
              "TRIGGER_R_X": 695, "TRIGGER_R_Y": 157,
          }
          for name, value in expected_positions.items():
              marker = f'<integer name="{name}">{value}</integer>'
              if marker not in ints:
                  raise SystemExit(f"::error::reference touch coordinate missing: {marker}")

          for path in (
              "android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/SettingsModels.kt",
              "android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/SettingsRoute.kt",
              "android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/SettingsSections.kt",
