name: VitaStation Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'vita3k/**'
      - 'external/lsfg-vk-android'
      - '.gitmodules'
      - 'THIRD_PARTY_NOTICES/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  LSFG_ANDROID_COMMIT: 3e89e5439a98f55d5acb003d20039426ab24e69c

jobs:
  android-build:
    name: Build VitaStation Phase03A LSFG Foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Add and pin lsfg-vk-android
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -e external/lsfg-vk-android/.git ]; then
            if [ -e external/lsfg-vk-android ]; then
              rm -rf external/lsfg-vk-android
            fi
            git submodule add -b release               https://github.com/FrankBarretta/lsfg-vk-android.git               external/lsfg-vk-android
          fi

          git -C external/lsfg-vk-android fetch origin release
          git -C external/lsfg-vk-android checkout "$LSFG_ANDROID_COMMIT"
          git submodule update --init --recursive external/lsfg-vk-android

          test -f external/lsfg-vk-android/framegen/CMakeLists.txt
          test -f external/lsfg-vk-android/LICENSE.md
          echo "Pinned lsfg-vk-android: $(git -C external/lsfg-vk-android rev-parse HEAD)"

      - name: Apply VitaStation v0.2.4 Phase03A
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/vitastation-phase03a.py
          python3 /tmp/vitastation-phase03a.py
          git diff --check

      - name: Persist Phase03A source and LSFG submodule
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"

          git add             .gitmodules             external/lsfg-vk-android             android             vita3k             THIRD_PARTY_NOTICES

          if git diff --cached --quiet; then
            echo "Phase03A source is already up to date."
          else
            git commit -m "VitaStation v0.2.4 Phase03A: LSFG Android foundation"
            git push origin HEAD:main
          fi

      - name: Restore stable VitaStation dev signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: vitastation-dev-debug-keystore-v1

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: vitastation-android-native-lsfg-${{ hashFiles('CMakeLists.txt', 'vita3k/CMakeLists.txt', 'external/lsfg-vk-android/framegen/CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            vitastation-android-native-lsfg-
            vitastation-android-native-

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        run: bash ./.ci/setup-android.sh

      - name: Kotlin compile preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew :app:compileReldebugKotlin --stacktrace

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Build VitaStation Phase03A APK
        run: bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/vitastation-android/app.apk
          mv artifacts/vitastation-android/app.apk             artifacts/vitastation-android/VitaStation-v0.2.4-Phase03A-LSFG-Foundation.apk
          ls -lh artifacts/vitastation-android/

      - name: Upload VitaStation Phase03A APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.2.4-Phase03A-LSFG-Foundation-Android
          path: artifacts/vitastation-android/VitaStation-v0.2.4-Phase03A-LSFG-Foundation.apk
          if-no-files-found: error
