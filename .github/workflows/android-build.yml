          require('vita3k/android/jni/input_overlay.cpp', 'InputOverlay_setFastForward', '[VS-ACCELERATE9]')
          forbid('vita3k/modules/SceAvPlayer/SceAvPlayer.cpp', '[VS-SKIP-CUTSCENE8]', 'skip_cutscene_if_requested')
          require('android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java', '[VS-TOUCH-GRID9]', 'OVERLAY_MASK_ACCELERATE = 32', 'BUTTON_ACCELERATE = 1025', 'setFastForward(boolean active)')
          require('android/app/src/main/java/org/vita3k/emulator/overlay/OverlayConfig.kt', 'accelerateVisible', 'OVERLAY_MASK_ACCELERATE')
          require('android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/OverlaySettings.kt', 'settings_controls_accelerate', 'withAccelerateVisible')
          require('android/app/src/main/java/org/vita3k/emulator/ui/components/OverlayEditorPalette.kt', '[VS-TOUCH-GRID9]', 'emulation_controls_grid', 'emulation_controls_snap')
          require('android/app/src/main/res/values/strings.xml', 'Accelerate the game', 'Show Accelerate button')
          require('android/app/src/main/res/values-pt-rBR/strings.xml', 'Acelerar o jogo', 'Mostrar botão Acelerar')
          settings = data('android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/SettingsSections.kt')
          # One FPS-Hack control is expected in HACKs. Its help entry legitimately repeats
          # the title resource, so counting the title string produces a false failure.
          fps_toggle_count = settings.count('checked = cfg.fpsHack')
          if fps_toggle_count != 1:
              raise SystemExit(f'::error::FIX9 FPS Hack toggle count expected=1 actual={fps_toggle_count}')
          hacks_pos = settings.find('private fun HacksSettingsSection(')
          fps_pos = settings.find('checked = cfg.fpsHack')
          if hacks_pos < 0 or fps_pos < hacks_pos:
              raise SystemExit('::error::FIX9 FPS Hack toggle is not inside HACKs')
          for name in ('button_cross.png','button_circle.png','button_square.png','button_triangle.png','button_accelerate.png'):
              p = Path('android/app/src/main/res/drawable') / name
              if not p.is_file() or p.stat().st_size < 4096:
                  raise SystemExit(f'::error::FIX9 missing/full-glow PNG asset: {p}')
          framegen = subprocess.check_output(['git','hash-object','vita3k/renderer/src/vulkan/frame_generation.cpp'], text=True).strip()
          if framegen != '1e7cc634f3308566b6ea3d972b73c55086f8f781':
              raise SystemExit(f'::error::FIX9 FrameGen drift actual={framegen}')
          pause = data('android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/EmulationPauseMenu.kt')
          if pause.rstrip().endswith('@Composable'):
              raise SystemExit('::error::FIX9 orphan @Composable')
          print('[VS-FIX9] protected regression gates passed')
          print('[VS-FIX9] Gintama sync + FrameGen preserved; Uncharted change hard-gated to PCSA00029')
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and JVM preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac \
            --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done
          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"
          keytool -list -v -keystore "$SIGNING_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/vitastation-keytool.txt"
          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed VitaStation FIX9 APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify permanent APK signature and frozen FrameGen
        shell: bash
        run: |
          set -euo pipefail
          APK='artifacts/vitastation-android/app.apk'
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/vitastation-apksigner.txt"
          python3 - <<'PY'
          from pathlib import Path
          import os, re, subprocess
          report = Path(os.environ['RUNNER_TEMP']) / 'vitastation-apksigner.txt'
          content = report.read_text(encoding='utf-8', errors='replace')
          match = re.search(r'certificate SHA-256 digest:\s*([0-9A-Fa-f:]+)', content)
          if not match:
              raise SystemExit('::error::apksigner certificate SHA-256 digest not found')
          actual = match.group(1).replace(':', '').lower()
          expected = os.environ['VITASTATION_SIGNING_CERT_SHA256'].lower()
          if actual != expected:
              raise SystemExit(f'::error::Signing certificate mismatch expected={expected} actual={actual}')
          got = subprocess.check_output(['git', 'hash-object', 'vita3k/renderer/src/vulkan/frame_generation.cpp'], text=True).strip()
          wanted = '1e7cc634f3308566b6ea3d972b73c55086f8f781'
          if got != wanted:
              raise SystemExit(f'::error::FrameGen drift expected={wanted} actual={got}')
          print(f'[VS-FIX9] permanent signing certificate verified: {actual}')
          print('[VS-FIX9] FrameGen remained byte-identical')
          PY

      - name: Rename and hash FIX9 APK
        shell: bash
        run: |
          set -euo pipefail
          SRC='artifacts/vitastation-android/app.apk'
          DST="artifacts/vitastation-android/$FIX9_APK_NAME"
          test -s "$SRC"
          mv "$SRC" "$DST"
          sha256sum "$DST" | tee "artifacts/vitastation-android/$FIX9_APK_NAME.sha256"
          ls -lh "$DST"

      - name: Upload VitaStation FIX9 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.3.0-Alpha4-FIX9-Protected-Android-Signed
          path: |
            artifacts/vitastation-android/${{ env.FIX9_APK_NAME }}
            artifacts/vitastation-android/${{ env.FIX9_APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 30
