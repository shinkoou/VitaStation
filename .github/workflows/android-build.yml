name: VitaStation Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'vita3k/**'
      - 'data/**'
      - '.ci/**'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'vcpkg.json'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

env:
  VCPKG_ROOT: /usr/local/share/vcpkg

jobs:
  android-build:
    name: Build VitaStation Phase02B
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply VitaStation Phase02A identity and UI
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path
          import base64
          import re

          ICON_B64 = """"""

          root = Path("android/app/src/main")
          java_root = root / "java/org/vita3k/emulator"

          build_gradle = Path("android/app/build.gradle")
          settings_gradle = Path("android/settings.gradle")
          strings = root / "res/values/strings.xml"
          theme = java_root / "ui/theme/Theme.kt"
          screen = java_root / "ui/screens/AppsListScreen.kt"
          vm = java_root / "ui/viewmodel/AppsListViewModel.kt"
          icon = root / "res/mipmap/ic_launcher.png"

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count == 0 and new in text:
                  print(f"Already applied: {label}")
                  return text
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              print(f"Applied: {label}")
              return text.replace(old, new, 1)

          # ----------------------------------------------------------
          # 1) Android identity
          # Keep the internal namespace/package untouched for now.
          # Only the installable applicationId becomes VitaStation.
          # ----------------------------------------------------------
          text = build_gradle.read_text(encoding="utf-8")

          if 'applicationId = "org.vitastation.emulator"' not in text:
              text = replace_once(
                  text,
                  'applicationId = "org.vita3k.emulator"',
                  'applicationId = "org.vitastation.emulator"',
                  "VitaStation applicationId",
              )

          text, n = re.subn(
              r'(?m)^(\s*)versionCode\s*=\s*\d+\s*$',
              r'\1versionCode = 22',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"versionCode: expected 1 match, found {n}")

          text, n = re.subn(
              r'(?m)^(\s*)versionName\s*=\s*"[^"]+"\s*$',
              r'\1versionName = "0.2.0"',
              text,
              count=1,
          )
          if n != 1:
              raise SystemExit(f"versionName: expected 1 match, found {n}")

          build_gradle.write_text(text, encoding="utf-8")

          text = settings_gradle.read_text(encoding="utf-8")
          if 'rootProject.name = "VitaStation"' not in text:
              text = replace_once(
                  text,
                  'rootProject.name = "Vita3K"',
                  'rootProject.name = "VitaStation"',
                  "Gradle project name",
              )
          settings_gradle.write_text(text, encoding="utf-8")

          # ----------------------------------------------------------
          # 2) Visible branding
          # ----------------------------------------------------------
          text = strings.read_text(encoding="utf-8")

          replacements = {
              "app_name": "VitaStation",
              "apps_list_app_title": "VitaStation",
              "initial_setup_welcome_title": "Welcome to VitaStation",
              "initial_setup_welcome_body": (
                  "VitaStation is an Android-focused PlayStation Vita emulator project "
                  "based on Vita3K-Plus and Vita3K. It focuses on a modern Android "
                  "interface, performance, compatibility, and upstream-friendly development."
              ),
              "initial_setup_piracy_notice": (
                  "VitaStation does not condone piracy. You must dump your own games."
              ),
              "about_legal_notice": (
                  "VitaStation does not condone piracy. You must dump your own games."
              ),
              "settings_restart_in_progress_message": (
                  "Please wait while VitaStation restarts the game."
              ),
          }

          for name, value in replacements.items():
              pattern = re.compile(
                  rf'(<string name="{re.escape(name)}">)(.*?)(</string>)',
                  re.S,
              )
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(
                      f"string {name}: expected 1 resource, found {len(matches)}"
                  )
              text = pattern.sub(
                  lambda m, v=value: m.group(1) + v + m.group(3),
                  text,
                  count=1,
              )

          strings.write_text(text, encoding="utf-8")

          # ----------------------------------------------------------
          # 3) VitaStation version in Library header
          # ----------------------------------------------------------
          text = vm.read_text(encoding="utf-8")

          if "import org.vita3k.emulator.BuildConfig\n" not in text:
              text = replace_once(
                  text,
                  "import org.vita3k.emulator.R\n",
                  "import org.vita3k.emulator.R\nimport org.vita3k.emulator.BuildConfig\n",
                  "BuildConfig import",
              )

          if 'appVersion = "${BuildConfig.VERSION_NAME}-${BuildConfig.VERSION_CODE}"' not in text:
              text = replace_once(
                  text,
                  "            appVersion = AppRepository.getAppVersion()\n",
                  '            appVersion = "${BuildConfig.VERSION_NAME}-${BuildConfig.VERSION_CODE}"\n',
                  "VitaStation displayed version",
              )

          vm.write_text(text, encoding="utf-8")

          # ----------------------------------------------------------
          # 4) VitaStation AMOLED + cyan/violet Material 3 theme
          # ----------------------------------------------------------
          theme.write_text(
          """package org.vita3k.emulator.ui.theme

          import android.app.Activity
          import android.os.Build
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.DisposableEffect
          import androidx.compose.runtime.SideEffect
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.graphics.toArgb
          import androidx.compose.ui.platform.LocalView
          import androidx.compose.ui.window.DialogWindowProvider
          import androidx.core.view.WindowInsetsControllerCompat

          private val AppBackgroundColor = Color(0xFF070A14)
          private val AppTopBarColor = Color(0xFF0D1326)

          private val AppColorScheme = darkColorScheme(
              primary = Color(0xFF59D8FF),
              onPrimary = Color(0xFF001F2A),
              primaryContainer = Color(0xFF123C54),
              onPrimaryContainer = Color(0xFFC7F2FF),
              secondary = Color(0xFF8B5CF6),
              onSecondary = Color(0xFF180D33),
              secondaryContainer = Color(0xFF2A1D4F),
              onSecondaryContainer = Color(0xFFE7DDFF),
              tertiary = Color(0xFFD946EF),
              onTertiary = Color(0xFF2D0034),
              background = AppBackgroundColor,
              onBackground = Color(0xFFF7FAFF),
              surface = AppTopBarColor,
              onSurface = Color(0xFFF7FAFF),
              surfaceVariant = Color(0xFF17213A),
              onSurfaceVariant = Color(0xFF95A3BC),
              surfaceContainerHigh = Color(0xFF11182A),
              surfaceContainerHighest = Color(0xFF17213A),
              outline = Color(0xFF24314B),
              outlineVariant = Color(0xFF1B2942),
              error = Color(0xFFFF6B7A),
              onError = Color(0xFF300008)
          )

          @Composable
          @Suppress("DEPRECATION")
          fun Vita3KTheme(
              content: @Composable () -> Unit
          ) {
              val view = LocalView.current
              if (!view.isInEditMode) {
                  val transparentSystemBar = Color.Transparent.toArgb()
                  SideEffect {
                      val window = (view.context as? Activity)?.window ?: return@SideEffect
                      window.statusBarColor = transparentSystemBar
                      window.navigationBarColor = transparentSystemBar
                      WindowInsetsControllerCompat(window, view).apply {
                          isAppearanceLightStatusBars = false
                          isAppearanceLightNavigationBars = false
                      }
                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                          window.isStatusBarContrastEnforced = false
                          window.isNavigationBarContrastEnforced = false
                      }
                  }
              }

              MaterialTheme(
                  colorScheme = AppColorScheme,
                  content = content
              )
          }

          const val SCRIM_ALPHA = 0.46f

          @Composable
          fun ApplyDialogDim() {
              val view = LocalView.current
              if (!view.isInEditMode) {
                  DisposableEffect(Unit) {
                      val provider = (view as? DialogWindowProvider)
                          ?: (view.parent as? DialogWindowProvider)
                      provider?.window?.setDimAmount(SCRIM_ALPHA)
                      onDispose {}
                  }
              }
          }
          """.replace("\n          ", "\n").lstrip(),
              encoding="utf-8",
          )

          # ----------------------------------------------------------
          # 5) Library Grid polish, scoped to the exact composables.
          # Avoid brittle multi-line whitespace matching.
          # ----------------------------------------------------------
          text = screen.read_text(encoding="utf-8")

          grid_start = text.find("private fun AppsGridView(")
          grid_end = text.find("@OptIn(ExperimentalFoundationApi::class)", grid_start)
          if grid_start < 0 or grid_end < 0:
              raise SystemExit("Could not isolate AppsGridView.")
          grid = text[grid_start:grid_end]

          grid = replace_once(
              grid,
              "GridCells.Adaptive(minSize = 120.dp)",
              "GridCells.Adaptive(minSize = 148.dp)",
              "Grid adaptive size",
          )
          grid = replace_once(
              grid,
              "contentPadding = PaddingValues(8.dp)",
              "contentPadding = PaddingValues(12.dp)",
              "Grid content padding",
          )
          grid = replace_once(
              grid,
              "horizontalArrangement = Arrangement.spacedBy(8.dp)",
              "horizontalArrangement = Arrangement.spacedBy(12.dp)",
              "Grid horizontal spacing",
          )
          grid = replace_once(
              grid,
              "verticalArrangement = Arrangement.spacedBy(8.dp)",
              "verticalArrangement = Arrangement.spacedBy(12.dp)",
              "Grid vertical spacing",
          )

          text = text[:grid_start] + grid + text[grid_end:]

          card_start = text.find("private fun AppGridItem(")
          card_end = text.find("@Composable\nprivate fun UpdateCheckDialog(", card_start)
          if card_start < 0 or card_end < 0:
              raise SystemExit("Could not isolate AppGridItem.")
          card = text[card_start:card_end]

          card = replace_once(
              card,
              "        shape = RoundedCornerShape(8.dp)\n",
              "        shape = RoundedCornerShape(18.dp),\n"
              "        colors = CardDefaults.cardColors(\n"
              "            containerColor = MaterialTheme.colorScheme.surfaceContainerHigh\n"
              "        )\n",
              "Grid card styling",
          )
          card = replace_once(
              card,
              "AppIcon(app, size = 120, modifier = Modifier.fillMaxWidth())",
              "AppIcon(app, size = 132, modifier = Modifier.fillMaxWidth())",
              "Grid icon size",
          )
          card = replace_once(
              card,
              "Column(modifier = Modifier.padding(8.dp))",
              "Column(modifier = Modifier.padding(12.dp))",
              "Grid card padding",
          )
          card = replace_once(
              card,
              "style = MaterialTheme.typography.bodySmall,",
              "style = MaterialTheme.typography.bodyMedium,\n"
              "                    fontWeight = FontWeight.Medium,",
              "Grid title typography",
          )

          text = text[:card_start] + card + text[card_end:]

          # About screen, preserving upstream attribution.
          constants = {
              "ABOUT_DESCRIPTION_HTML": (
                  '"""VitaStation is an Android-focused emulator project based on '
                  'Vita3K-Plus and Vita3K. It focuses on a modern Android experience, '
                  'performance, compatibility, and responsible upstream attribution."""'
              ),
              "ABOUT_CREDIT_HTML": (
                  '"""Based on <a href="https://github.com/nckstwrt/Vita3K-Plus">'
                  'Vita3K-Plus</a> and <a href="https://github.com/Vita3K/Vita3K">'
                  'Vita3K</a>. VitaStation remains GPL-licensed and preserves upstream credits."""'
              ),
              "ABOUT_FOOTER_HTML": (
                  '"""<a href="https://github.com/shinkoou/VitaStation">VitaStation GitHub</a> '
                  '| <a href="https://github.com/nckstwrt/Vita3K-Plus">Vita3K-Plus</a> '
                  '| <a href="https://github.com/Vita3K/Vita3K">Vita3K</a>"""'
              ),
          }

          for name, value in constants.items():
              pattern = re.compile(
                  rf'(private const val {name}\s*=\s*)""".*?"""',
                  re.S,
              )
              text, count = pattern.subn(
                  lambda m, v=value: m.group(1) + v,
                  text,
                  count=1,
              )
              if count != 1:
                  raise SystemExit(f"{name}: expected 1 constant, found {count}")

          screen.write_text(text, encoding="utf-8")

          # ----------------------------------------------------------
          # 6) Official VitaStation icon with launcher-safe padding.
          # The payload lives INSIDE this script, not in one huge env var.
          # ----------------------------------------------------------
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_bytes(base64.b64decode(ICON_B64))

          # ----------------------------------------------------------
          # 7) Validation before spending time compiling native code.
          # ----------------------------------------------------------
          build_text = build_gradle.read_text(encoding="utf-8")
          strings_text = strings.read_text(encoding="utf-8")
          theme_text = theme.read_text(encoding="utf-8")
          screen_text = screen.read_text(encoding="utf-8")
          vm_text = vm.read_text(encoding="utf-8")

          checks = [
              ('namespace = "org.vita3k.emulator"' in build_text,
               "internal namespace preserved"),
              ('applicationId = "org.vitastation.emulator"' in build_text,
               "VitaStation applicationId"),
              ('versionCode = 22' in build_text, "versionCode 22"),
              ('versionName = "0.2.0"' in build_text, "versionName 0.2.0"),
              ('<string name="app_name">VitaStation</string>' in strings_text,
               "VitaStation Android label"),
              ('<string name="apps_list_app_title">VitaStation</string>' in strings_text,
               "VitaStation Library title"),
              ('Color(0xFF59D8FF)' in theme_text, "cyan identity"),
              ('Color(0xFF8B5CF6)' in theme_text, "violet identity"),
              ('GridCells.Adaptive(minSize = 148.dp)' in screen_text,
               "responsive Grid"),
              ('RoundedCornerShape(18.dp)' in screen_text, "rounded Grid cards"),
              ('BuildConfig.VERSION_NAME' in vm_text, "VitaStation version header"),
              (icon.exists() and icon.stat().st_size > 20000, "launcher icon"),
          ]

          for ok, label in checks:
              if not ok:
                  raise SystemExit(f"Validation failed: {label}")
              print(f"OK: {label}")

          print("\nVitaStation Phase02A validation passed.")
          PY

          git diff --check

      - name: Apply VitaStation Phase02B UI PT-BR and performance HUD
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/vitastation-phase02b.py.gz.b64 <<'VITASTATION_PHASE02B'
          
          VITASTATION_PHASE02B
          base64 -d /tmp/vitastation-phase02b.py.gz.b64 | gzip -d > /tmp/vitastation-phase02b.py
          python3 /tmp/vitastation-phase02b.py
          git diff --check

      - name: Persist VitaStation Phase02B
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"

          git add android vita3k/android/jni/native_session.cpp vita3k/renderer/src/renderer.cpp

          if git diff --cached --quiet; then
            echo "Phase02B already applied."
          else
            git commit -m "VitaStation v0.2.1 Phase02B: PT-BR, adaptive icon, premium UI and performance HUD"
            git push origin HEAD:main
          fi

      - name: Restore stable VitaStation dev signing key
        uses: actions/cache@v5
        with:
          path: ~/.android/debug.keystore
          key: vitastation-dev-debug-keystore-v1

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: vitastation-android-native-${{ hashFiles('CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            vitastation-android-native-

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        run: bash ./.ci/setup-android.sh

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Build VitaStation Phase02B APK
        run: bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/vitastation-android/app.apk
          mv artifacts/vitastation-android/app.apk \
            artifacts/vitastation-android/VitaStation-v0.2.1-Phase02B.apk
          ls -lh artifacts/vitastation-android/

      - name: Upload VitaStation Phase02B APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.2.1-Phase02B-Android
          path: artifacts/vitastation-android/VitaStation-v0.2.1-Phase02B.apk
          if-no-files-found: error
