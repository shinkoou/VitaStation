name: VitaStation Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'vita3k/**'
      - 'external/lsfg-vk-android/**'
      - 'LICENSES/**'
      - '.github/workflows/android-build.yml'

permissions:
  contents: write

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30

jobs:
  android-build:
    name: Build VitaStation v0.2.10 Phase04B-FIX1
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Apply VitaStation v0.2.10 Phase04B-FIX1
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress > /tmp/vitastation-phase04b-fix1.py
          echo "VitaStation workspace: $GITHUB_WORKSPACE"
          test -f "$GITHUB_WORKSPACE/android/app/build.gradle"
          python3 /tmp/vitastation-phase04b-fix1.py
          git diff --check
          grep -q 'versionName = "0.2.10"' android/app/build.gradle
          grep -q 'feedback_from_active_target' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q 'Snapdragon GSR EdgeDir' vita3k/renderer/src/vulkan/screen_renderer.cpp
          grep -q 'settings_gpu_filter_sgsr_edgedir' android/app/src/main/res/values/strings.xml
          grep -q 'settings_gpu_filter_sgsr_edgedir' android/app/src/main/res/values-pt-rBR/strings.xml
          grep -q 'UiLanguages.wrapContext' android/app/src/main/java/org/vita3k/emulator/Emulator.java

      - name: Install shader compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          glslangValidator -V -S frag \
            vita3k/shaders-builtin/vulkan/render_main_sgsr.frag \
            -o vita3k/shaders-builtin/vulkan/render_main_sgsr.frag.spv
          glslangValidator -V -S frag \
            vita3k/shaders-builtin/vulkan/render_main_sgsr_edgedir.frag \
            -o vita3k/shaders-builtin/vulkan/render_main_sgsr_edgedir.frag.spv
          test -s vita3k/shaders-builtin/vulkan/render_main_sgsr.frag.spv
          test -s vita3k/shaders-builtin/vulkan/render_main_sgsr_edgedir.frag.spv

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi

          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"

          keytool -list -v \
            -keystore "$SIGNING_FILE" \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" > "$RUNNER_TEMP/vitastation-key-info.txt"

          actual_fingerprint="$(
            grep -m1 'SHA256:' "$RUNNER_TEMP/vitastation-key-info.txt" \
              | sed 's/.*SHA256: //' \
              | tr -d ':' \
              | tr '[:upper:]' '[:lower:]'
          )"
          if [ "$actual_fingerprint" != "$VITASTATION_SIGNING_CERT_SHA256" ]; then
            echo "::error::Permanent signing certificate fingerprint mismatch."
            exit 1
          fi

          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Restore native dependency cache
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/share/vcpkg/installed
            /usr/local/share/vcpkg/packages
          key: vitastation-android-native-lsfg-${{ hashFiles('CMakeLists.txt', 'vita3k/CMakeLists.txt', 'external/lsfg-vk-android/framegen/CMakeLists.txt', 'cmake/**', '.ci/**', 'android/app/build.gradle', 'vcpkg.json') }}
          restore-keys: |
            vitastation-android-native-lsfg-
            vitastation-android-native-

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: on-failure
          cache-provider: basic
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        run: bash ./.ci/setup-android.sh

      - name: Release resource and Kotlin preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            --stacktrace

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Build VitaStation v0.2.10 APK
        run: bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify permanent APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/vitastation-android/app.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/apksigner-output.txt"
          actual="$(
            grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/apksigner-output.txt" \
              | sed 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]'
          )"
          if [ "$actual" != "$VITASTATION_SIGNING_CERT_SHA256" ]; then
            echo "::error::APK permanent signature mismatch."
            exit 1
          fi

      - name: Persist v0.2.10 only after successful signed build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"

          git add \
            android/app/build.gradle \
            android/app/src/main/java/org/vita3k/emulator/Emulator.java \
            android/app/src/main/java/org/vita3k/emulator/data/UiLanguages.kt \
            android/app/src/main/java/org/vita3k/emulator/ui/screens/InitialSetupScreen.kt \
            android/app/src/main/java/org/vita3k/emulator/ui/screens/settings/SettingsSections.kt \
            android/app/src/main/res/values/strings.xml \
            android/app/src/main/res/values-pt-rBR/strings.xml \
            vita3k/renderer/include/renderer/vulkan/surface_cache.h \
            vita3k/renderer/include/renderer/vulkan/types.h \
            vita3k/renderer/include/renderer/vulkan/screen_filters.h \
            vita3k/renderer/src/vulkan/surface_cache.cpp \
            vita3k/renderer/src/vulkan/scene.cpp \
            vita3k/renderer/src/vulkan/screen_filters.cpp \
            vita3k/renderer/src/vulkan/screen_renderer.cpp \
            vita3k/shaders-builtin/vulkan/render_main_sgsr.frag \
            vita3k/shaders-builtin/vulkan/render_main_sgsr.frag.spv \
            vita3k/shaders-builtin/vulkan/render_main_sgsr_edgedir.frag \
            vita3k/shaders-builtin/vulkan/render_main_sgsr_edgedir.frag.spv \
            LICENSES/Snapdragon-GSR-BSD-3-Clause.txt

          if git diff --cached --quiet; then
            echo "v0.2.10 source already applied."
          else
            git commit -m "VitaStation v0.2.10 Phase04B-FIX1: surface RAW, SGSR, welcome, l10n, exit [skip ci]"
            git push origin HEAD:main
          fi

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          test -f artifacts/vitastation-android/app.apk
          mv artifacts/vitastation-android/app.apk \
            artifacts/vitastation-android/VitaStation-v0.2.10-Phase04B-FIX1-Surface-RAW-SGSR-Welcome-L10n-Signed.apk
          ls -lh artifacts/vitastation-android/

      - name: Upload VitaStation v0.2.10 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.2.10-Phase04B-FIX1-Surface-RAW-SGSR-Welcome-L10n-Signed-Android
          path: artifacts/vitastation-android/VitaStation-v0.2.10-Phase04B-FIX1-Surface-RAW-SGSR-Welcome-L10n-Signed.apk
          if-no-files-found: error
