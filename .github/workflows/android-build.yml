name: VitaStation Gintama & Lord FIX29 Ultimate

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/android-build.yml

permissions:
  contents: read

concurrency:
  group: vitastation-gintama-fix29-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: /usr/local/share/vcpkg
  VITASTATION_SIGNING_CERT_SHA256: fc57542b62221ad0c0550d12b2791e4e40794e980c9f26a86d83250d67ed5d30
  PROBE_APK_NAME: VitaStation-v0.3.0-Alpha4-FIX29-Ultimate-Signed.apk

jobs:
  build-fix:
    name: Build FIX29 Ultimate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VitaStation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Reconstruct exact FIX21 runtime source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess
          import re
          from pathlib import Path

          yml = Path('.github/workflows/android-build.yml').read_text(encoding='utf-8')
          section = yml.split('name: Apply exact verified FIX7-R2 baseline from green Run 52')[1]
          section = section.split('name: Set up Java 17')[0]
          
          # extract all python run blocks and execute them to reproduce the source tree
          blocks = re.findall(r'python3 - <<\'PY\'\n(.*?)\n          PY', section, re.DOTALL)
          if not blocks:
              raise SystemExit("::error::FIX24 could not locate FIX21 patch-stack boundaries")

          env = None
          ran = 0
          for code in blocks:
              code = '\n'.join(line[10:] for line in code.split('\n')) # outdent 10 spaces
              
              if 'FIX28' in code or 'versionCode = 73' in code:
                  continue
              if 'FIX29' in code or 'versionCode = 74' in code:
                  continue

              subprocess.run(
                  ['python3', '-c', code],
                  cwd='.',
                  env=env,
                  check=True,
              )
              ran += 1

          if ran < 10:
              raise SystemExit(f'::error::FIX24 inherited suspiciously few FIX21 steps: {ran}')

          gradle = Path('android/app/build.gradle').read_text(encoding='utf-8')
          if 'versionCode = 66' not in gradle or '0.3.0-alpha4-fix21-lord-skin-diag-gintama-feedback-cap' not in gradle:
              raise SystemExit('::error::FIX24 runtime reconstruction did not reach expected version')

          print(f'[FIX24] exact FIX21 runtime patch stack reconstructed; inherited run steps={ran}')
          PY

      - name: Inject FIX29 Ultimate Protections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('android/app/build.gradle')
          text = path.read_text(encoding='utf-8')
          text = text.replace('versionCode = 66', 'versionCode = 74', 1)
          text = text.replace(
              'versionName = "0.3.0-alpha4-fix21-lord-skin-diag-gintama-feedback-cap"',
              'versionName = "0.3.0-alpha4-fix29-vita3k-plus-gintama-prerender"',
              1
          )
          path.write_text(text, encoding='utf-8')

          def once(file_path, a, b, label):
              p = Path(file_path)
              t = p.read_text(encoding="utf-8")
              n = t.count(a)
              if n != 1:
                  raise SystemExit(f"::error::FIX29 {label}: anchor count={n}")
              t = t.replace(a, b, 1)
              p.write_text(t, encoding="utf-8")

          once(
              "vita3k/kernel/src/sync_primitives.cpp",
              "            if (((++ownership_rewaits & 0xFFu) == 1u)) {",
              """            // [VS-LORD-DEADLOCK-BREAKER]
            if (ownership_rewaits > 1000) {
                LOG_ERROR("[VS-LORD-DEADLOCK-BREAKER] Forcing ownership transfer of mutex {} from {} to {}", mutex->uid, mutex->owner ? mutex->owner->id : 0, thread_id);
                mutex->owner = thread;
                res = SCE_KERNEL_OK;
                break;
            }
            if (((++ownership_rewaits & 0xFFu) == 1u)) {""",
              "kernel deadlock breaker injection"
          )

          # Injeção para o Lord of Apocalypse (Vertex Null Pointer UBO Fix)
          once(
              "vita3k/modules/SceGxm/SceGxm.cpp",
              "    const size_t size = (size_t)program->default_uniform_buffer_count * 4;\n    // data for the ring buffer must be 4 bytes aligned\n    context->state.vertex_ring_buffer_used = align(context->state.vertex_ring_buffer_used, 4);",
              """    size_t size = (size_t)program->default_uniform_buffer_count * 4;
              // [VS-LORD-UBO-NULL-FIX-VERT] Prevent returning 0x0 for stripped shaders that need skinning UBOs
              if (size == 0) {
                  LOG_ERROR("[VS-LORD-UBO-NULL-FIX-VERT] Vertex Shader default_uniform_buffer_count is 0! Forcing 1024 bytes allocation to prevent Null Pointer memory write!");
                  size = 1024;
              }
              // data for the ring buffer must be 4 bytes aligned
              context->state.vertex_ring_buffer_used = align(context->state.vertex_ring_buffer_used, 4);""",
              "ubo vert null pointer fix"
          )

          # Injeção para o Lord of Apocalypse (Fragment Null Pointer UBO Fix)
          once(
              "vita3k/modules/SceGxm/SceGxm.cpp",
              "    const size_t size = (size_t)program->default_uniform_buffer_count * 4;\n    // data for the ring buffer must be 4 bytes aligned\n    context->state.fragment_ring_buffer_used = align(context->state.fragment_ring_buffer_used, 4);",
              """    size_t size = (size_t)program->default_uniform_buffer_count * 4;
              // [VS-LORD-UBO-NULL-FIX-FRAG] Prevent returning 0x0 for stripped shaders that need skinning UBOs
              if (size == 0) {
                  LOG_ERROR("[VS-LORD-UBO-NULL-FIX-FRAG] Fragment Shader default_uniform_buffer_count is 0! Forcing 1024 bytes allocation to prevent Null Pointer memory write!");
                  size = 1024;
              }
              // data for the ring buffer must be 4 bytes aligned
              context->state.fragment_ring_buffer_used = align(context->state.fragment_ring_buffer_used, 4);""",
              "ubo frag null pointer fix"
          )

          # Injeção para o Lord of Apocalypse (Skinning Palette Infinity Fix) inspirado no Vita3K-nx
          once(
              "vita3k/shader/src/gxp_parser.cpp",
              "        if ((((investigated_ub & (1 << index)) == 0) && seems_symbols_stripped) || (buffer.size == MAXIMUM_GXP_ARRAY_SIZE)) {\n            // Symbols stripped shader with uniform buffer not referencing any uniform parameters, or\n            // buffer that has the potential of outsizing 1024 (due to limits on the size variable), will\n            // get their buffer turns to MAX_UB_IN_VEC4_UNIT here. Their upload amount will be controlled!\n            buffer.size = SCE_GXM_MAX_UB_IN_FLOAT_UNIT;\n        }",
              """        if ((((investigated_ub & (1 << index)) == 0) && seems_symbols_stripped) || (buffer.size == MAXIMUM_GXP_ARRAY_SIZE)) {
                  // Symbols stripped shader with uniform buffer not referencing any uniform parameters, or
                  // buffer that has the potential of outsizing 1024 (due to limits on the size variable), will
                  // get their buffer turns to MAX_UB_IN_VEC4_UNIT here. Their upload amount will be controlled!
                  buffer.size = SCE_GXM_MAX_UB_IN_FLOAT_UNIT;
              } else if (seems_symbols_stripped) {
                  // [VS-LORD-SKINNING-INFINITY] Force unbounded size for stripped shaders that lie about array size (like Lord of Apocalypse bone matrices)
                  LOG_ERROR("[VS-LORD-SKINNING-INFINITY] Stripped shader detected with bounded size! Forcing SCE_GXM_MAX_UB_IN_FLOAT_UNIT to prevent OOB/Ghosting!");
                  buffer.size = SCE_GXM_MAX_UB_IN_FLOAT_UNIT;
              }""",
              "stripped shader skinning infinity fix"
          )

          # Injeção para o Gintama (Vita3K-Plus Prerender Hack)
          once(
              "vita3k/renderer/src/vulkan/surface_cache.cpp",
              "        const bool late_resolve_in_renderpass = needs_late_resolve && context->in_renderpass;\n        vk::CommandBuffer cmd_buffer = needs_late_resolve\n            ? context->render_cmd\n            : context->prerender_cmd;",
              """        // [VS-VITA3K-PLUS-GINTAMA-FIX] Never stop render pass!
        // Vita3K-Plus prevents Adreno ErrorDeviceLost by forcing prerender_cmd on late resolve.
        const bool late_resolve_in_renderpass = false;
        vk::CommandBuffer cmd_buffer = context->prerender_cmd;""",
              "gintama prerender cmd adreno fix"
          )
          print("[FIX29] Lord UBO Fixes, Infinity Skinning, and Deadlock Breaker injected correctly")
          PY

      - name: FIX29 regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          gradle = Path('android/app/build.gradle').read_text(encoding='utf-8')
          if 'versionCode = 74' not in gradle:
              raise SystemExit('::error::FIX29 versionCode gate failed')
          PY

      - name: Apply exact verified FIX7-R2 baseline from green Run 52
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          
          def inject_fix(file_path, anchor, addition, label):
              p = Path(file_path)
              text = p.read_text(encoding="utf-8")
              if anchor not in text:
                  raise SystemExit(f"::error::Anchor not found for {label}")
              text = text.replace(anchor, addition, 1)
              p.write_text(text, encoding="utf-8")
              print(f"Applied: {label}")

          inject_fix(
              "vita3k/renderer/src/vulkan/context.cpp",
              "void VKContext::start_render_pass(bool load_color, bool load_depth, bool load_stencil) {",
              "void VKContext::start_render_pass(bool load_color, bool load_depth, bool load_stencil) {\n    if (in_renderpass) return;",
              "FIX2/FIX7-R2 start_render_pass idempotent gate"
          )

          inject_fix(
              "vita3k/renderer/src/vulkan/context.cpp",
              "void VKContext::stop_render_pass() {\n    if (!in_renderpass)\n        return;",
              "void VKContext::stop_render_pass() {\n    if (!in_renderpass)\n        return;\n    if (current_cmd_buffer)\n        current_cmd_buffer.endRenderPass();\n    in_renderpass = false;\n    return;\n",
              "FIX2/FIX7-R2 stop_render_pass fast-return"
          )
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;25.2.9519653"

      - name: Install CMake
        run: sdkmanager "cmake;3.22.1"

      - name: Build signed FIX29 APK
        working-directory: android
        run: ./gradlew assembleRelease
        env:
          ORG_GRADLE_PROJECT_VITASTATION_SIGNING_CERT_SHA256: ${{ env.VITASTATION_SIGNING_CERT_SHA256 }}

      - name: Rename and hash FIX29 APK
        id: prepare_apk
        run: |
          mv android/app/build/outputs/apk/release/app-release.apk "${PROBE_APK_NAME}"
          sha256sum "${PROBE_APK_NAME}" > "${PROBE_APK_NAME}.sha256"

      - name: Upload FIX29 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROBE_APK_NAME }}
          path: |
            ${{ env.PROBE_APK_NAME }}
            ${{ env.PROBE_APK_NAME }}.sha256
          retention-days: 7
