      - name: Compile and validate FIX4 typeless shader
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslang-tools
          SHADER="vita3k/shaders-builtin/vulkan/surface_cast_reinterpret.comp"
          SPV="${SHADER}.spv"
          test -s "$SHADER"
          glslangValidator -V --target-env vulkan1.1 "$SHADER" -o "$SPV"
          test -s "$SPV"
          spirv-val "$SPV"
          echo "[VS-FIX4] typeless shader validated: $(stat -c%s "$SPV") bytes"

      - name: Source gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 44' android/app/build.gradle
          grep -q 'versionName = "0.3.0-alpha4-fix4"' android/app/build.gradle
          grep -q '\[VS-KERNEL-OWNERSHIP-WAIT\]' vita3k/kernel/src/sync_primitives.cpp
          grep -q '\[VS-KERNEL-SYNC-FIX\]' vita3k/kernel/src/sync_primitives.cpp
          grep -q '\[VS-TYPELESS-HD-STAGING\]' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q 'source_mutable=0' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q '\[VS-TYPELESS-STAGING\]' vita3k/renderer/include/renderer/vulkan/surface_cache.h
          grep -q 'start_word' vita3k/renderer/include/renderer/vulkan/surface_cache.h
          grep -q '\[VS-TOUCH-ENGINE4\]' android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java
          grep -q '\[VS-GPU-HUD2\]' android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java
          test "$(git hash-object vita3k/renderer/src/vulkan/frame_generation.cpp)" = "1e7cc634f3308566b6ea3d972b73c55086f8f781"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and JVM preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac \
            --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done
          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"
          keytool -list -v -keystore "$SIGNING_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/vitastation-keytool.txt"
          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed VitaStation FIX4 APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify permanent APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/vitastation-android/app.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/vitastation-apksigner.txt"
          actual="$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/vitastation-apksigner.txt" | sed 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$VITASTATION_SIGNING_CERT_SHA256"

      - name: Persist FIX4 source only after green signed build
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object vita3k/renderer/src/vulkan/frame_generation.cpp)" = "1e7cc634f3308566b6ea3d972b73c55086f8f781"
          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            android/app/build.gradle \
            android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java \
            android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableButton.java \
            android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableDpad.java \
            android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableJoystick.java \
            android/app/src/main/res/values/integers.xml \
            vita3k/kernel/src/sync_primitives.cpp \
            vita3k/renderer/include/renderer/vulkan/surface_cache.h \
            vita3k/renderer/src/vulkan/surface_cache.cpp \
            vita3k/shaders-builtin/vulkan/surface_cast_reinterpret.comp \
            vita3k/shaders-builtin/vulkan/surface_cast_reinterpret.comp.spv
          if git diff --cached --quiet; then
            echo "[VS-FIX4] source already persisted"
          else
            git commit -m "VitaStation v0.3.0 Alpha4 FIX4: kernel ownership + typeless staging + touch engine4 [skip ci]"
            git push origin HEAD:main
          fi

      - name: Rename APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="artifacts/vitastation-android/app.apk"
          DST="artifacts/vitastation-android/VitaStation-v0.3.0-Alpha4-FIX4-KernelSync3-TypelessStaging-TouchEngine4-StableFG-Signed.apk"
          test -f "$SRC"
          mv "$SRC" "$DST"
          ls -lh "$DST"

      - name: Upload VitaStation FIX4 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.3.0-Alpha4-FIX4-KernelSync3-TypelessStaging-TouchEngine4-StableFG-Signed-Android
          path: artifacts/vitastation-android/VitaStation-v0.3.0-Alpha4-FIX4-KernelSync3-TypelessStaging-TouchEngine4-StableFG-Signed.apk
          if-no-files-found: error
