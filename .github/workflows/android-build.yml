      - name: FIX5 source gates and regression audits
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'versionCode = 45' android/app/build.gradle
          grep -q 'versionName = "0.3.0-alpha4-fix5"' android/app/build.gradle

          # Kernel Sync 4.0, while keeping FIX2 and FIX4 mechanisms.
          grep -q '\[VS-KERNEL-SYNC-FIX\]' vita3k/kernel/src/sync_primitives.cpp
          grep -q '\[VS-KERNEL-OWNERSHIP-WAIT\]' vita3k/kernel/src/sync_primitives.cpp
          grep -q '\[VS-LWMUTEX-WORKAREA\]' vita3k/kernel/src/sync_primitives.cpp
          grep -Fq 'int mutex_unlock(KernelState &kernel, MemState &mem' vita3k/kernel/include/kernel/sync_primitives.h
          grep -Fq 'mutex_unlock_impl(kernel, mem, export_name, thread_id, 1, condvar->associated_mutex, weight)' vita3k/kernel/src/sync_primitives.cpp
          grep -Fq 'mutex->owner = waiting_thread;' vita3k/kernel/src/sync_primitives.cpp
          grep -Fq 'sync_lw_workarea();' vita3k/kernel/src/sync_primitives.cpp
          mapfile -t unlock_sites < <(rg -n --glob '*.cpp' --glob '*.h' --glob '*.hpp' '\bmutex_unlock\s*\(' vita3k)
          mapfile -t impl_sites < <(rg -n --glob '*.cpp' --glob '*.h' --glob '*.hpp' '\bmutex_unlock_impl\s*\(' vita3k)
          test "${#unlock_sites[@]}" -eq 5
          test "${#impl_sites[@]}" -eq 3
          ! rg -n 'mutex_unlock\(emuenv\.kernel, export_name' vita3k/modules/SceLibKernel/SceLibKernel.cpp vita3k/modules/SceKernelThreadMgr/SceThreadmgr.cpp

          # Uncharted: mandatory late resolve can no longer be bypassed by cast-cache generation equality.
          grep -q '\[VS-FEEDBACK-CACHE\]' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -Fq 'if (!needs_late_resolve && casted->source_generation == source_generation)' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -Fq 'const bool needs_late_resolve = is_same_image || unresolved_scene_write;' vita3k/renderer/src/vulkan/surface_cache.cpp

          # FIX4 HD Typeless staging remains intact.
          grep -q '\[VS-TYPELESS-HD-STAGING\]' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q 'source_mutable=0' vita3k/renderer/src/vulkan/surface_cache.cpp
          grep -q '\[VS-TYPELESS-STAGING\]' vita3k/renderer/include/renderer/vulkan/surface_cache.h
          grep -q 'start_word' vita3k/renderer/include/renderer/vulkan/surface_cache.h
          ! grep -q 'reinterpret_store_view' vita3k/renderer/include/renderer/vulkan/surface_cache.h
          ! grep -q 'reinterpret_store_view' vita3k/renderer/src/vulkan/surface_cache.cpp

          # Query lifecycle audit only. stop_render_pass ends the query and draw() resumes it normally.
          grep -Fq 'render_cmd.endQuery(current_visibility_buffer->query_pool, current_query_idx);' vita3k/renderer/src/vulkan/context.cpp
          grep -Fq 'context.render_cmd.beginQuery(context.current_visibility_buffer->query_pool, context.current_query_idx, control_flags);' vita3k/renderer/src/vulkan/scene.cpp
          test "$(git hash-object vita3k/renderer/src/vulkan/context.cpp)" = "1d4cfe111377f9b55428b4190dbb4ea33df978c2"
          test "$(git hash-object vita3k/renderer/src/vulkan/scene.cpp)" = "c841e9adda4640aeddd884a145774db073046981"

          # Restore the historical GPU reader, not another heuristic state machine.
          HUD='android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java'
          grep -q '\[VS-GPU-HUD-HISTORICAL\]' "$HUD"
          grep -Fq '/sys/class/kgsl/kgsl-3d0/gpu_busy_percentage' "$HUD"
          grep -Fq '/sys/class/kgsl/kgsl-3d0/gpubusy' "$HUD"
          grep -Fq 'File devfreq = new File("/sys/class/devfreq")' "$HUD"
          ! grep -q '\[VS-GPU-HUD2\]' "$HUD"
          ! grep -q 'zeroCandidate\|previousGpuBusy\|GPU_DELTA\|PRIMED' "$HUD"

          # PNG touch art is authoritative; no MULTIPLY tint survives.
          OVERLAY='android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java'
          grep -q '\[VS-TOUCH-PNG5\]' "$OVERLAY"
          grep -Fq 'button.draw(canvas);' "$OVERLAY"
          grep -Fq 'dpad.draw(canvas);' "$OVERLAY"
          grep -Fq 'joystick.draw(canvas);' "$OVERLAY"
          grep -Fq 'OVERLAY_ACTIVE_ALPHA = 0.42f' "$OVERLAY"
          grep -Fq 'OVERLAY_IDLE_ALPHA = 0.22f' "$OVERLAY"
          ! grep -q 'tintBitmap(' "$OVERLAY"
          ! grep -q 'PorterDuffColorFilter' "$OVERLAY"
          ! grep -q 'drawVitaStationButton(canvas' "$OVERLAY"
          ! grep -q 'drawVitaStationDpad(canvas' "$OVERLAY"
          ! grep -q 'drawVitaStationJoystick(canvas' "$OVERLAY"
          grep -Fq 'value * 1.62f' android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableButton.java
          grep -Fq 'value * 1.62f' android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableDpad.java
          grep -Fq 'value * 1.62f' android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableJoystick.java

          # Frozen components stay bit-identical.
          test "$(git hash-object vita3k/renderer/src/vulkan/frame_generation.cpp)" = "1e7cc634f3308566b6ea3d972b73c55086f8f781"
          test "$(git hash-object vita3k/renderer/include/renderer/vulkan/surface_cache.h)" = "c30ac772a497c59f93a9b5d27c3de1edeb20f451"
          echo "[VS-FIX5] all source and regression gates passed"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          validate-wrappers: false

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4

      - name: Set up Android build environment
        shell: bash
        run: bash ./.ci/setup-android.sh

      - name: Release resource and JVM preflight
        shell: bash
        run: |
          set -euo pipefail
          cd android
          bash ./gradlew \
            :app:mergeReleaseResources \
            :app:compileReleaseKotlin \
            :app:compileReleaseJavaWithJavac \
            --stacktrace

      - name: Restore native ccache
        uses: hendrikmuhs/ccache-action@v1.2.23

      - name: Configure permanent VitaStation signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.VITASTATION_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VITASTATION_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VITASTATION_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VITASTATION_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing permanent signing secret: $name"
              exit 1
            fi
          done
          SIGNING_FILE="$RUNNER_TEMP/vitastation-permanent-release.jks"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$SIGNING_FILE"
          keytool -list -v -keystore "$SIGNING_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" > "$RUNNER_TEMP/vitastation-keytool.txt"
          echo "SIGNING_STORE_PATH=$SIGNING_FILE" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "SIGNING_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build signed VitaStation FIX5 APK
        shell: bash
        run: |
          set -euo pipefail
          bash ./.ci/build-android.sh artifacts/vitastation-android

      - name: Verify permanent APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="artifacts/vitastation-android/app.apk"
          test -f "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/vitastation-apksigner.txt"
          actual="$(grep -m1 'certificate SHA-256 digest:' "$RUNNER_TEMP/vitastation-apksigner.txt" | sed 's/.*digest: //' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$VITASTATION_SIGNING_CERT_SHA256"
          test "$(git hash-object vita3k/renderer/src/vulkan/frame_generation.cpp)" = "1e7cc634f3308566b6ea3d972b73c55086f8f781"

      - name: Rename FIX5 APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="artifacts/vitastation-android/app.apk"
          DST="artifacts/vitastation-android/VitaStation-v0.3.0-Alpha4-FIX5-KernelSync4-FeedbackResolve-TouchPNG-GPUReader-StableFG-Signed.apk"
          test -f "$SRC"
          mv "$SRC" "$DST"
          sha256sum "$DST"
          ls -lh "$DST"

      - name: Upload VitaStation FIX5 APK
        uses: actions/upload-artifact@v7
        with:
          name: VitaStation-v0.3.0-Alpha4-FIX5-KernelSync4-FeedbackResolve-TouchPNG-GPUReader-StableFG-Signed-Android
          path: artifacts/vitastation-android/VitaStation-v0.3.0-Alpha4-FIX5-KernelSync4-FeedbackResolve-TouchPNG-GPUReader-StableFG-Signed.apk
          if-no-files-found: error

      - name: Persist FIX5 source only after green signed artifact
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object vita3k/renderer/src/vulkan/frame_generation.cpp)" = "1e7cc634f3308566b6ea3d972b73c55086f8f781"
          git config user.name "VitaStation Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            android/app/build.gradle \
            vita3k/kernel/src/sync_primitives.cpp \
            vita3k/kernel/include/kernel/sync_primitives.h \
            vita3k/modules/SceLibKernel/SceLibKernel.cpp \
            vita3k/modules/SceKernelThreadMgr/SceThreadmgr.cpp \
            vita3k/renderer/src/vulkan/surface_cache.cpp \
            android/app/src/main/java/org/vita3k/emulator/ui/screens/emulation/PerformanceHudView.java \
            android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlay.java \
            android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableButton.java \
            android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableDpad.java \
            android/app/src/main/java/org/vita3k/emulator/overlay/InputOverlayDrawableJoystick.java \
            android/app/src/main/res/drawable/*.png

          if git diff --cached --quiet; then
            echo "[VS-FIX5] source already persisted"
            exit 0
          fi

          git commit -m "VitaStation v0.3.0 Alpha4 FIX5: LwMutex sync + feedback resolve + touch PNG + GPU reader [skip ci]"
          if ! git push origin HEAD:main; then
            echo "::error::FIX5 APK built, signed and uploaded, but source persistence to main failed. No persistence was claimed."
            exit 1
          fi
          echo "[VS-FIX5] source persisted to main after green signed artifact"
